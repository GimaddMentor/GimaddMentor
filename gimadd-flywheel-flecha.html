<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Gimadd Mentor — Flywheel · Flecha</title>
  <meta name="description" content="Flywheel Gimadd Mentor con flecha indicadora y logo. La flecha señala cada paso al voltear la tarjeta." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0&display=swap" rel="stylesheet" />
  <style id="arrowKeyframes"></style>
  <style>
    :root {
      --bg: #FFFFFF;
      --bg-soft: #F4F2EC;
      --ink: #0A0A0A;
      --ink-soft: #1F1F1F;
      --ink-mute: #6E6E6E;
      --line: #E8E6E0;
      --yellow: #F4D43C;
      --yellow-deep: #D8B814;
      --gold: #C09955;
      --green: #0F8B4A;
      --accent-glow: rgba(244, 212, 60, 0.5);
      --surface: rgba(255, 255, 255, 0.72);
      --surface-solid: #FFFFFF;
      --muted: var(--ink-mute);
      --ring-size: min(72vw, 520px);
      --step-w: clamp(108px, 22vw, 132px);
      --radius-md: 16px;
      --shadow-soft: 0 1px 2px rgba(10, 10, 10, 0.04), 0 12px 40px rgba(10, 10, 10, 0.07);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --arrow-size: calc(var(--ring-size) - var(--step-w) * 2.05);
      --core-width: 56%;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; background: var(--bg-soft); }

    body {
      font-family: "Manrope", -apple-system, sans-serif;
      background: var(--bg-soft);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: var(--yellow); color: var(--ink); }

    .flywheel-section {
      position: relative;
      padding: 80px 24px 96px;
      background:
        radial-gradient(ellipse 90% 60% at 50% -15%, rgba(244, 212, 60, 0.18) 0%, transparent 55%),
        radial-gradient(circle at 8% 85%, rgba(15, 139, 74, 0.06) 0%, transparent 35%),
        var(--bg-soft);
      isolation: isolate;
    }

    .section-inner {
      position: relative;
      z-index: 1;
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section-num {
      align-self: flex-end;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 28px;
    }

    .section-num .total { color: var(--ink); font-weight: 700; }

    .page-header { text-align: center; max-width: 680px; margin-bottom: 1.5rem; }

    .page-header .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 1rem;
    }

    .page-header .kicker::before {
      content: "";
      width: 24px;
      height: 1.5px;
      background: var(--yellow-deep);
    }

    .page-header h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(1.75rem, 4.5vw, 2.65rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.08;
      margin-bottom: 0.65rem;
    }

    .page-header h1 em {
      font-family: "Space Grotesk", sans-serif;
      font-style: italic;
      font-weight: 600;
      background: linear-gradient(135deg, var(--ink-soft) 0%, var(--ink-mute) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .page-header .intro {
      font-size: 0.95rem;
      color: var(--ink-mute);
      line-height: 1.65;
      max-width: 52ch;
      margin: 0 auto 1.5rem;
      font-weight: 500;
    }

    .page-header .intro strong { color: var(--ink); font-weight: 700; }

    .version-tabs {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
      padding: 0.3rem;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      box-shadow: 0 2px 12px rgba(10, 10, 10, 0.05);
    }

    .version-tabs button {
      font-family: "Manrope", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-mute);
      cursor: pointer;
      transition: color 0.3s var(--ease-out), background 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out), transform 0.2s var(--ease-out);
    }

    .version-tabs button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.5); }

    .version-tabs button.is-on {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 6px 20px rgba(10, 10, 10, 0.18);
      transform: translateY(-1px);
    }

    .version-desc {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      max-width: 52ch;
      margin: 0 auto 1.75rem;
      line-height: 1.5;
      min-height: 2.8em;
    }

    .version-desc strong { color: var(--ink); }

    .build-tag {
      font-family: "Space Grotesk", sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-mute);
      opacity: 0.55;
      margin-top: 0.35rem;
    }

    .flywheel-stage {
      position: relative;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto 1.25rem;
    }

    .flywheel-wrap {
      position: relative;
      width: var(--ring-size);
      height: var(--ring-size);
      flex-shrink: 0;
    }

    .flywheel-wrap[data-count="7"] {
      --ring-size: min(88vw, 600px);
      --step-w: clamp(84px, 15vw, 106px);
      --orbit-inset: 19%;
      --arrow-size: calc(min(88vw, 600px) - clamp(84px, 15vw, 106px) * 2.05);
      --core-width: 56%;
    }
    .flywheel-wrap[data-count="9"] {
      --ring-size: min(92vw, 630px);
      --step-w: clamp(84px, 14.8vw, 102px);
      --orbit-inset: 18%;
      --arrow-size: calc(min(92vw, 630px) - clamp(84px, 14.8vw, 102px) * 2.05);
      --core-width: 54%;
    }

    .flywheel-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .flywheel-ring--outer {
      border: 2px dashed rgba(10, 10, 10, 0.18);
      animation: spin-slow 40s linear infinite;
    }

    .flywheel-ring--mid {
      inset: 5%;
      border: 2px solid rgba(244, 212, 60, 0.55);
      box-shadow:
        0 0 80px rgba(244, 212, 60, 0.22),
        inset 0 0 40px rgba(244, 212, 60, 0.1);
      animation: spin-slow 28s linear infinite reverse;
    }

    .flywheel-ring--pulse {
      inset: 22%;
      background: radial-gradient(circle, rgba(244, 212, 60, 0.1) 0%, transparent 72%);
      animation: pulse-hub 4s ease-in-out infinite;
    }

    @keyframes spin-slow { to { transform: rotate(360deg); } }
    @keyframes pulse-hub {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .flow-svg {
      position: absolute;
      inset: -2%;
      width: 104%;
      height: 104%;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }

    .flow-path {
      fill: none;
      stroke: url(#flowGradient);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 8 14;
      animation: dash-flow 2s linear infinite;
      opacity: 0.9;
    }

    @keyframes dash-flow { to { stroke-dashoffset: -44; } }

    /* —— Flecha central —— */
    .arrow-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: var(--arrow-size);
      height: var(--arrow-size);
      z-index: 2;
      pointer-events: none;
    }

    .arrow-rotator {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      animation: arrow-cycle var(--cycle-dur, 24.5s) var(--ease-out) infinite;
      will-change: transform;
    }

    .arrow-rotator.is-paused { animation-play-state: paused; }

    .arrow-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(10, 10, 10, 0.22));
    }

    .arrow-core {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      width: var(--core-width);
      pointer-events: none;
    }

    .arrow-disc {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #0A0A0A;
      border: 2.5px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10% 8% 9%;
      text-align: center;
      gap: 0.15rem;
    }

    .arrow-logo-wrap {
      width: 52%;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(48, 48, 48, 0.72);
      padding: 11%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.45);
    }

    .arrow-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20%;
      filter: contrast(1.05);
    }

    .arrow-tagline {
      font-family: "Libre Baskerville", Georgia, "Times New Roman", serif;
      font-size: clamp(0.4rem, 1.45vw, 0.58rem);
      font-weight: 700;
      font-style: normal;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      background: transparent;
      padding: 0.15rem 0 0;
      margin-top: 0.1rem;
    }

    .flywheel-step {
      --angle: 0deg;
      --delay: 0s;
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--step-w);
      margin-left: calc(var(--step-w) / -2);
      margin-top: calc(var(--step-w) / -2);
      transform: rotate(var(--angle)) translateY(calc(var(--ring-size) / -2 + var(--orbit-inset, 14%))) rotate(calc(-1 * var(--angle)));
      z-index: 3;
      animation: step-active-pulse var(--cycle-dur, 8s) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes step-active-pulse {
      0%, 2%, 16%, 19%, 100% {
        z-index: 3;
        filter: drop-shadow(0 2px 8px rgba(10, 10, 10, 0.06));
      }
      4%, 14% {
        z-index: 5;
        filter: drop-shadow(0 16px 40px var(--accent-glow));
      }
    }

    .step-flip {
      display: block;
      width: 100%;
      border: none;
      background: none;
      padding: 0;
      margin: 0;
      font: inherit;
      text-align: inherit;
      cursor: pointer;
      perspective: 800px;
      position: relative;
      z-index: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .step-flip-inner {
      position: relative;
      width: 100%;
      min-height: 5.35rem;
      transform-style: preserve-3d;
      transition: transform 0.7s var(--ease-out);
      animation: step-auto-flip var(--cycle-dur, 8s) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes step-auto-flip {
      0%, 2%, 16%, 19%, 100% { transform: rotateY(0deg) scale(1); }
      4%, 14% { transform: rotateY(180deg) scale(1.04); }
    }

    .step-flip-inner.is-flipped {
      transform: rotateY(180deg);
      animation-play-state: paused;
    }

    .step-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: var(--radius-md);
      padding: 0.65rem 0.55rem 0.6rem;
      text-align: center;
      box-shadow: var(--shadow-soft);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .step-card--back {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotateY(180deg);
      padding: 0.55rem 0.45rem;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.95) 0%, rgba(244, 242, 236, 0.9) 100%);
      border-color: rgba(244, 212, 60, 0.35);
    }

    .step-num {
      position: absolute;
      top: -0.35rem;
      right: -0.35rem;
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--yellow) 0%, var(--yellow-deep) 100%);
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(244, 212, 60, 0.5);
      border: 2px solid var(--surface-solid);
      z-index: 10;
      pointer-events: none;
    }

    .step-ico {
      width: 2.1rem;
      height: 2.1rem;
      margin: 0 auto 0.35rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(10, 10, 10, 0.08);
    }

    .step-ico .material-symbols-rounded {
      font-size: 1.15rem;
      font-variation-settings: "FILL" 1, "wght" 600;
    }

    .step-ico--coach { background: var(--ink); color: var(--yellow); }
    .step-ico--player { background: var(--yellow); color: var(--ink); }
    .step-ico--loop { background: var(--green); color: #fff; }
    .step-ico--both { background: linear-gradient(140deg, var(--gold), #d4b06a); color: var(--ink); }

    .step-card h3 {
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.02em;
    }

    .step-card p,
    .step-card--back p {
      font-size: 0.56rem;
      color: var(--muted);
      line-height: 1.35;
      font-weight: 500;
    }

    .step-desc-front { display: none; }

    .step-role {
      display: inline-block;
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.44rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      margin-bottom: 0.3rem;
    }

    .step-role--coach { background: rgba(10,10,10,0.08); color: var(--ink); }
    .step-role--player { background: rgba(244,212,60,0.35); color: var(--ink-soft); }
    .step-role--loop { background: rgba(15,139,74,0.15); color: var(--green); }
    .step-role--both { background: rgba(192,153,85,0.2); color: #7a5c28; }

    .flywheel-wrap[data-count="9"] .step-card h3 { font-size: 0.64rem; }
    .flywheel-wrap[data-count="9"] .step-ico { width: 1.9rem; height: 1.9rem; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem 2rem;
      margin-top: 3.25rem;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: var(--radius-md);
      max-width: 720px;
      box-shadow: var(--shadow-soft);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-mute);
    }

    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-dot--coach { background: var(--ink); }
    .legend-dot--player { background: var(--yellow); }

    .cta-strip {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.88rem;
      color: var(--ink-mute);
      max-width: 520px;
      line-height: 1.6;
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.4);
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .cta-strip strong { color: var(--ink); font-weight: 700; }

    .section-cta {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn-mentor {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 30px;
      background: var(--ink);
      color: #fff;
      font-family: "Manrope", sans-serif;
      font-size: 14px;
      font-weight: 700;
      border-radius: 99px;
      text-decoration: none;
      border: 1px solid var(--ink);
      box-shadow: 0 8px 24px rgba(10, 10, 10, 0.2);
      transition: background 0.3s var(--ease-out), transform 0.25s var(--ease-out);
    }

    .btn-mentor--primary {
      background: linear-gradient(145deg, var(--yellow) 0%, var(--yellow-deep) 100%);
      color: var(--ink);
      border-color: var(--yellow-deep);
    }

    .btn-mentor--ghost {
      background: rgba(255, 255, 255, 0.5);
      color: var(--ink);
      border: 1px solid rgba(10, 10, 10, 0.15);
      box-shadow: none;
    }

    @media (max-width: 520px) {
      .flywheel-section { padding: 56px 16px 72px; }

      .flywheel-wrap[data-count="7"] {
        --ring-size: min(96vw, 420px);
        --step-w: 74px;
        --orbit-inset: 12%;
        --arrow-size: calc(min(96vw, 420px) - 74px * 2.05);
        --core-width: 58%;
      }
      .flywheel-wrap[data-count="9"] {
        --ring-size: min(97vw, 420px);
        --step-w: 68px;
        --orbit-inset: 10%;
        --arrow-size: calc(min(97vw, 420px) - 68px * 2.05);
        --core-width: 56%;
      }

      .step-flip-inner { min-height: 4.85rem; }
      .step-card h3 { font-size: 0.56rem; }
      .step-card--back p { font-size: 0.5rem; }
      .step-ico { width: 1.65rem; height: 1.65rem; }
      .step-num { width: 1.1rem; height: 1.1rem; font-size: 0.54rem; }
      .arrow-tagline {
        font-size: clamp(0.34rem, 2.7vw, 0.46rem);
        letter-spacing: 0.03em;
      }
      .legend { margin-top: 4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flywheel-ring--outer, .flywheel-ring--mid, .flow-path,
      .flywheel-ring--pulse { animation: none; }
      .arrow-rotator { animation: none !important; transform: rotate(0deg); }
      .flywheel-step { animation: none; }
      .step-flip-inner { animation: none !important; }
    }
  </style>
</head>
<body>

  <section class="flywheel-section" id="mentor-flywheel" aria-labelledby="flywheel-title">
    <div class="section-inner">
      <span class="section-num">/ 09 — <span class="total">Mentor</span></span>

      <header class="page-header">
        <p class="kicker">Gimadd Mentor</p>
        <h1 id="flywheel-title">Mejora tu pádel con <em>videoanálisis</em></h1>
        <p class="intro">
          La flecha señala el paso activo mientras la tarjeta se da la vuelta.
          <strong>Mismo flujo, lectura más clara.</strong>
        </p>

        <nav class="version-tabs" role="tablist" aria-label="Versión del flywheel">
          <button type="button" role="tab" aria-selected="true" data-version="player" class="is-on">Jugador · 7 pasos</button>
          <button type="button" role="tab" aria-selected="false" data-version="coach">Entrenador · 9 pasos</button>
        </nav>

      <p class="version-desc" id="versionDesc"></p>
      <p class="build-tag" aria-hidden="true">Build flecha · v2026-07-02h</p>
    </header>

      <div class="flywheel-stage" id="flywheelStage">
        <div class="flywheel-wrap" id="flywheel" data-count="7" role="img" aria-live="polite"></div>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="legend-dot legend-dot--player"></span> Lo hace el jugador</div>
        <div class="legend-item"><span class="legend-dot legend-dot--coach"></span> Lo hace el entrenador</div>
      </div>

      <p class="cta-strip" id="ctaStrip"></p>

      <div class="section-cta">
        <a class="btn-mentor btn-mentor--primary" href="https://gimaddmentor.github.io/GimaddMentor/Gimadd_Mentor_APP.html" target="_blank" rel="noopener">Probar Mentor →</a>
        <a class="btn-mentor btn-mentor--ghost" href="gimadd-flywheel-support-pro.html">Versión clásica</a>
      </div>
    </div>
  </section>

  <script>
    var VERSIONS = {
      player: {
        desc: "<strong>Jugador</strong>: mejora tu pádel con videoanálisis. Graba, recibe correcciones, entrena con foco y repite.",
        cta: "<strong>Vas a notar el cambio:</strong> cada vídeo te da correcciones claras y objetivos para la siguiente sesión.",
        steps: [
          { role: "player", icon: "videocam", title: "Graba en pista", desc: "Partido o sesión de entreno" },
          { role: "player", icon: "send", title: "Envía al coach", desc: "Cola de revisión pendiente" },
          { role: "coach", icon: "rate_review", title: "Analiza el vídeo", desc: "Ve tu juego con contexto" },
          { role: "coach", icon: "bookmark", title: "Correcciones clave", desc: "Marcas y notas en momentos exactos" },
          { role: "coach", icon: "flag", title: "Plan de acción", desc: "Objetivos claros para la pista" },
          { role: "player", icon: "auto_stories", title: "Diario", desc: "Entrenas con foco y marcas lo practicado" },
          { role: "both", icon: "check_circle", title: "Metas cumplidas", desc: "Todo el plan completado" }
        ]
      },
      coach: {
        desc: "<strong>Entrenador</strong>: convierte cada vídeo en una sesión de mejora medible con correcciones claras y objetivos accionables.",
        cta: "<strong>Valor para tu alumno:</strong> entregas correcciones clave + plan de acción. <strong>Valor para ti:</strong> retención y progreso visible.",
        steps: [
          { role: "coach", icon: "storefront", title: "Catálogo y packs", desc: "Pista + vídeo, precios y cupos" },
          { role: "player", icon: "shopping_bag", title: "Contrata servicio", desc: "Pago seguro · cupos activos" },
          { role: "player", icon: "videocam", title: "Graba en pista", desc: "Partido o sesión de entreno" },
          { role: "player", icon: "send", title: "Envía al coach", desc: "Cola de revisión pendiente" },
          { role: "coach", icon: "rate_review", title: "Analiza el vídeo", desc: "Ves el juego con contexto" },
          { role: "coach", icon: "bookmark", title: "Correcciones clave", desc: "Marcas y notas en el timeline" },
          { role: "coach", icon: "flag", title: "Plan de acción", desc: "Objetivos accionables al jugador" },
          { role: "player", icon: "auto_stories", title: "Diario", desc: "Marca objetivos practicados" },
          { role: "both", icon: "check_circle", title: "Metas cumplidas", desc: "Todo el plan completado" }
        ]
      }
    };

    var ROLE_LABEL = {
      coach: "Entrenador",
      player: "Jugador",
      both: "Jugador + coach"
    };

    var arrowRotatorEl = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

  function buildArrowKeyframes(n) {
      var slot = 100 / n;
      var stepDeg = 360 / n;
      var frames = [];

      for (var i = 0; i < n; i++) {
        var fromAngle = ((i - 1 + n) % n) * stepDeg;
        var toAngle = i * stepDeg;
        var rotStart = (i * slot + slot * 0.04).toFixed(4);
        var rotEnd = (i * slot + slot * 0.14).toFixed(4);

        frames.push(
          rotStart + "% { transform: rotate(" + fromAngle.toFixed(3) + "deg); }",
          rotEnd + "% { transform: rotate(" + toAngle.toFixed(3) + "deg); }"
        );
      }

      var lastAngle = ((n - 1) * stepDeg).toFixed(3);
      frames.push("99.99% { transform: rotate(" + lastAngle + "deg); }");
      frames.push("100% { transform: rotate(" + lastAngle + "deg); }");

      return "@keyframes arrow-cycle {\n  " + frames.join("\n  ") + "\n}";
    }

    function injectArrowKeyframes(n, cycleDur) {
      var styleEl = document.getElementById("arrowKeyframes");
      styleEl.textContent =
        buildArrowKeyframes(n) +
        "\n.arrow-rotator { animation-duration: " + cycleDur + "; }";
    }

    function arrowHubHtml() {
      return (
        '<div class="arrow-hub" aria-hidden="true">' +
        '<div class="arrow-rotator" id="arrowRotator">' +
        '<svg class="arrow-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
        '<linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" stop-color="#F4D43C"/>' +
        '<stop offset="100%" stop-color="#D8B814"/>' +
        '</linearGradient>' +
        '<mask id="ringHole">' +
        '<rect width="120" height="120" fill="#fff"/>' +
        '<circle cx="60" cy="60" r="33.5" fill="#000"/>' +
        '</mask>' +
        '</defs>' +
        '<circle cx="60" cy="60" r="46" fill="none" stroke="#F4D43C" stroke-width="0.8" opacity="0.25"/>' +
        '<circle cx="60" cy="60" r="43.5" fill="none" stroke="#F4D43C" stroke-width="0.6" opacity="0.18"/>' +
        '<path d="M60 0 C76 18 94 42 88 50 C84 56 76 53 70 53 L70 94 C70 101 60 104 60 104 C60 104 50 101 50 94 L50 53 C44 53 36 56 32 50 C26 42 44 18 60 0 Z" fill="url(#arrowGrad)"/>' +
        '<circle cx="60" cy="60" r="43" fill="#0A0A0A" mask="url(#ringHole)"/>' +
        '<circle cx="60" cy="60" r="43" fill="none" stroke="url(#arrowGrad)" stroke-width="2.5"/>' +
        '</svg>' +
        '</div>' +
        '<div class="arrow-core">' +
        '<div class="arrow-disc">' +
        '<div class="arrow-logo-wrap">' +
        '<img class="arrow-logo" src="assets/gimadd-mentor-logo.png" alt="Gimadd Mentor" width="64" height="64" decoding="async" />' +
        '</div>' +
        '<span class="arrow-tagline">Aprendizaje Continuo</span>' +
        '</div></div></div>'
      );
    }

    function stepFlipHtml(step) {
      var roleClass = "step-role--" + step.role;
      var icoClass = "step-ico--" + step.role;
      return (
        '<button type="button" class="step-flip" aria-label="' + escapeHtml(step.title) + ': pulsa para ver detalle" aria-expanded="false">' +
        '<div class="step-flip-inner">' +
        '<div class="step-card step-card--front">' +
        '<span class="step-role ' + roleClass + '">' + escapeHtml(ROLE_LABEL[step.role] || "") + '</span>' +
        '<div class="step-ico ' + icoClass + '"><span class="material-symbols-rounded">' + escapeHtml(step.icon) + '</span></div>' +
        '<h3>' + escapeHtml(step.title) + '</h3>' +
        '<p class="step-desc-front">' + escapeHtml(step.desc) + '</p></div>' +
        '<div class="step-card step-card--back" aria-hidden="true">' +
        '<p>' + escapeHtml(step.desc) + '</p></div>' +
        '</div></button>'
      );
    }

    function setArrowPaused(paused) {
      if (!arrowRotatorEl) return;
      arrowRotatorEl.classList.toggle("is-paused", paused);
    }

    function bindStepFlips(mount) {
      if (mount._flipBound) return;
      mount._flipBound = true;

      mount.addEventListener("click", function (e) {
        var btn = e.target.closest(".step-flip");
        if (!btn) return;

        var inner = btn.querySelector(".step-flip-inner");
        var willFlip = !inner.classList.contains("is-flipped");
        var anyFlipped = false;

        mount.querySelectorAll(".step-flip-inner.is-flipped").forEach(function (el) {
          el.classList.remove("is-flipped");
          el.style.animationPlayState = "";
          var otherBtn = el.closest(".step-flip");
          if (otherBtn) otherBtn.setAttribute("aria-expanded", "false");
        });

        if (willFlip) {
          inner.classList.add("is-flipped");
          inner.style.animationPlayState = "paused";
          btn.setAttribute("aria-expanded", "true");
          anyFlipped = true;
        }

        setArrowPaused(anyFlipped);
      });
    }

    function renderFlywheel(versionKey) {
      var v = VERSIONS[versionKey];
      var steps = v.steps;
      var n = steps.length;
      var mount = document.getElementById("flywheel");
      var cycleDur = (n * 3.5).toFixed(1) + "s";
      var stepTitles = steps.map(function (s) { return s.title; }).join(", ");

      mount.setAttribute("data-count", String(n));
      mount.style.setProperty("--cycle-dur", cycleDur);
      injectArrowKeyframes(n, cycleDur);

      var ringHtml =
        '<div class="flywheel-ring flywheel-ring--outer"></div>' +
        '<div class="flywheel-ring flywheel-ring--mid"></div>' +
        '<div class="flywheel-ring flywheel-ring--pulse"></div>' +
        '<svg class="flow-svg" viewBox="0 0 100 100" aria-hidden="true">' +
        '<defs><linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" stop-color="#0A0A0A"/><stop offset="50%" stop-color="#F4D43C"/><stop offset="100%" stop-color="#0F8B4A"/>' +
        '</linearGradient></defs><circle class="flow-path" cx="50" cy="50" r="44"/></svg>' +
        arrowHubHtml();

      var stepsHtml = steps.map(function (step, i) {
        var angle = (360 / n) * i;
        var delay = (i * (parseFloat(cycleDur) / n)).toFixed(2) + "s";
        return (
          '<div class="flywheel-step" style="--angle:' + angle + 'deg;--delay:' + delay + ';--cycle-dur:' + cycleDur + '">' +
          stepFlipHtml(step) +
          '<span class="step-num">' + (i + 1) + '</span></div>'
        );
      }).join("");

      mount.innerHTML = ringHtml + stepsHtml;
      arrowRotatorEl = document.getElementById("arrowRotator");
      bindStepFlips(mount);

      mount.setAttribute("aria-label", "Flywheel Gimadd Mentor con flecha, " + n + " pasos: " + stepTitles);
      document.getElementById("versionDesc").innerHTML = v.desc;
      document.getElementById("ctaStrip").innerHTML = v.cta;
    }

    document.querySelectorAll(".version-tabs button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-version");
        document.querySelectorAll(".version-tabs button").forEach(function (b) {
          var isOn = b === btn;
          b.classList.toggle("is-on", isOn);
          b.setAttribute("aria-selected", isOn ? "true" : "false");
        });
        renderFlywheel(key);
      });
    });

    renderFlywheel("player");
  </script>
</body>
</html>
