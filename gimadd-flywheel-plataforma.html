<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Gimadd Mentor — Flywheel · Plataforma</title>
  <meta name="description" content="Mejora tu pádel con videoanálisis. Flywheel Gimadd Mentor: flujo jugador (7 pasos) y entrenador (9 pasos)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f2ec;
      --ink: #0a0a0a;
      --ink-mute: #6e6e6e;
      --yellow: #f4d43c;
      --yellow-deep: #d8b814;
      --navy: #004a7c;
      --navy-deep: #003558;
      --green: #0f8b4a;
      --purple: #7c3aed;
      --ring-size: min(92vw, 640px);
      --step-w: clamp(88px, 14.5vw, 118px);
      --orbit-inset: 17%;
      --radius-md: 16px;
      --shadow-soft: 0 1px 2px rgba(10, 10, 10, 0.04), 0 12px 40px rgba(10, 10, 10, 0.08);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; background: var(--bg); }

    body {
      font-family: "Manrope", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--yellow); color: var(--ink); }

    .flywheel-section {
      padding: 72px 20px 88px;
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, rgba(244, 212, 60, 0.16) 0%, transparent 55%),
        var(--bg);
    }

    .section-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-header { text-align: center; max-width: 680px; margin-bottom: 1.25rem; }

    .page-header h1 {
      font-size: clamp(1.75rem, 4.5vw, 2.55rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.08;
      margin-bottom: 0.65rem;
    }

    .page-header h1 em {
      font-family: "Space Grotesk", sans-serif;
      font-style: normal;
      font-weight: 700;
      color: var(--yellow-deep);
    }

    .page-header .intro {
      font-size: 0.95rem;
      color: var(--ink-mute);
      line-height: 1.65;
      max-width: 52ch;
      margin: 0 auto 1.35rem;
      font-weight: 500;
    }

    .version-tabs {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: 0.65rem;
      padding: 0.28rem;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 0 2px 12px rgba(10, 10, 10, 0.05);
    }

    .version-tabs button {
      font-family: "Manrope", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.55rem 1.05rem;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-mute);
      cursor: pointer;
      transition: background 0.25s var(--ease-out), color 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out);
    }

    .version-tabs button.is-on {
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(244, 212, 60, 0.45);
    }

    .version-desc {
      text-align: center;
      font-size: 0.82rem;
      color: var(--ink-mute);
      max-width: 52ch;
      margin: 0 auto 1.5rem;
      line-height: 1.55;
      min-height: 2.6em;
    }

    .version-desc strong { color: var(--ink); }

    .flywheel-stage {
      width: 100%;
      max-width: 720px;
      margin: 0 auto 1.5rem;
    }

    .flywheel-wrap {
      position: relative;
      width: var(--ring-size);
      height: var(--ring-size);
      margin: 0 auto;
    }

    .flywheel-wrap[data-count="7"] {
      --ring-size: min(88vw, 580px);
      --step-w: clamp(84px, 15vw, 108px);
      --orbit-inset: 18%;
    }

    .ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .platform-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 46%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(165deg, var(--navy) 0%, var(--navy-deep) 100%);
      box-shadow: 0 10px 40px rgba(0, 74, 124, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8%;
      z-index: 2;
      color: #fff;
      gap: 0.2rem;
    }

    .platform-kicker {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(0.42rem, 1.2vw, 0.52rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--yellow);
    }

    .platform-icon {
      width: clamp(2rem, 8vw, 2.65rem);
      height: clamp(2rem, 8vw, 2.65rem);
      border-radius: 50%;
      background: var(--yellow);
      color: var(--navy-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.25rem 0 0.15rem;
      box-shadow: 0 4px 14px rgba(244, 212, 60, 0.45);
    }

    .platform-icon .material-symbols-rounded { font-size: 1.35rem; }

    .platform-title {
      font-size: clamp(0.72rem, 2.2vw, 0.95rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .platform-sub {
      font-size: clamp(0.48rem, 1.45vw, 0.62rem);
      font-weight: 600;
      opacity: 0.95;
    }

    .platform-tag {
      font-size: clamp(0.44rem, 1.3vw, 0.56rem);
      font-weight: 700;
      color: var(--yellow);
      margin-top: 0.1rem;
    }

    .flywheel-step {
      --angle: 0deg;
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--step-w);
      margin-left: calc(var(--step-w) / -2);
      margin-top: calc(var(--step-w) / -2);
      transform: rotate(var(--angle)) translateY(calc(var(--ring-size) / -2 + var(--orbit-inset))) rotate(calc(-1 * var(--angle)));
      z-index: 3;
    }

    .step-card {
      position: relative;
      background: #fff;
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-md);
      padding: 0.62rem 0.5rem 0.55rem;
      text-align: center;
      box-shadow: var(--shadow-soft);
      min-height: 5.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .step-num {
      position: absolute;
      top: -0.38rem;
      right: -0.38rem;
      width: 1.32rem;
      height: 1.32rem;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--yellow) 0%, var(--yellow-deep) 100%);
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 3px 10px rgba(244, 212, 60, 0.45);
    }

    .step-role {
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.44rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.12rem 0.35rem;
      border-radius: 4px;
      margin-bottom: 0.35rem;
      line-height: 1.2;
    }

    .step-role--coach { background: rgba(0, 74, 124, 0.12); color: var(--navy); }
    .step-role--player { background: rgba(244, 212, 60, 0.35); color: #5c4a00; }
    .step-role--detail { background: rgba(110, 110, 110, 0.14); color: #444; }
    .step-role--both { background: rgba(124, 58, 237, 0.14); color: var(--purple); }

    .step-ico {
      width: 2rem;
      height: 2rem;
      margin: 0 auto 0.3rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-ico--coach { background: rgba(0, 74, 124, 0.1); color: var(--navy); }
    .step-ico--player { background: rgba(244, 212, 60, 0.35); color: #7a6200; }
    .step-ico--both { background: rgba(124, 58, 237, 0.15); color: var(--purple); }

    .step-ico .material-symbols-rounded { font-size: 1.15rem; }

    .step-card h3 {
      font-size: clamp(0.56rem, 1.6vw, 0.68rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--ink);
    }

    .step-card--no-icon { padding-top: 0.85rem; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem 2rem;
      margin-top: 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-mute);
    }

    .legend-dot {
      display: inline-block;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }

    .legend-dot--player { background: var(--yellow); }
    .legend-dot--coach { background: var(--navy); }

    .section-cta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
      margin-top: 2rem;
    }

    .btn-mentor {
      font-family: "Manrope", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
    }

    .btn-mentor--primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 6px 20px rgba(10, 10, 10, 0.18);
    }

    .btn-mentor--ghost {
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      border: 1px solid rgba(10, 10, 10, 0.1);
    }

    .btn-mentor:hover { transform: translateY(-1px); }

    @media (max-width: 520px) {
      .flywheel-section { padding-top: 56px; }
      .step-card { min-height: 4.6rem; }
      .step-card h3 { font-size: 0.54rem; }
    }
  </style>
</head>
<body>
  <section class="flywheel-section" id="mentor-flywheel" aria-labelledby="flywheel-title">
    <div class="section-inner">
      <header class="page-header">
        <h1 id="flywheel-title">Mejora tu pádel con <em>videoanálisis</em></h1>
        <p class="intro">
          Graba tu juego, recibe correcciones claras del entrenador y entrena con foco.
          Vuelta a vuelta, mejoras de verdad.
        </p>

        <nav class="version-tabs" role="tablist" aria-label="Versión del flywheel">
          <button type="button" role="tab" aria-selected="false" data-version="player">Jugador · 7 pasos</button>
          <button type="button" role="tab" aria-selected="true" data-version="coach" class="is-on">Entrenador · 9 pasos</button>
        </nav>

        <p class="version-desc" id="versionDesc"></p>
      </header>

      <div class="flywheel-stage">
        <div class="flywheel-wrap" id="flywheel" data-count="9" role="img" aria-live="polite"></div>
      </div>

      <div class="legend">
        <div><span class="legend-dot legend-dot--player"></span> Lo hace el jugador</div>
        <div><span class="legend-dot legend-dot--coach"></span> Lo hace el entrenador</div>
      </div>

      <div class="section-cta">
        <a class="btn-mentor btn-mentor--primary" href="Gimadd_Mentor_APP.html">Probar Mentor →</a>
        <a class="btn-mentor btn-mentor--ghost" href="gimadd-flywheel-flecha.html">Versión flecha animada</a>
      </div>
    </div>
  </section>

  <script>
    var VERSIONS = {
      player: {
        desc: "<strong>Jugador</strong>: mejora tu pádel con videoanálisis. Graba, recibe correcciones, entrena con foco y repite.",
        steps: [
          { role: "player", icon: "videocam", title: "Graba en pista" },
          { role: "player", icon: "send", title: "Envía al coach" },
          { role: "detail", title: "Ves el juego con contexto" },
          { role: "coach", icon: "bookmark", title: "Correcciones clave" },
          { role: "coach", icon: "flag", title: "Plan de acción" },
          { role: "player", icon: "auto_stories", title: "Diario" },
          { role: "both", icon: "check_circle", title: "Metas cumplidas" }
        ]
      },
      coach: {
        desc: "<strong>Entrenador</strong>: convierte cada vídeo en una sesión de mejora medible con correcciones claras y objetivos accionables.",
        steps: [
          { role: "coach", icon: "storefront", title: "Catálogo y packs" },
          { role: "player", icon: "shopping_bag", title: "Contrata servicio" },
          { role: "player", icon: "videocam", title: "Graba en pista" },
          { role: "player", icon: "play_circle", title: "Envía al coach" },
          { role: "detail", title: "Ves el juego con contexto" },
          { role: "coach", icon: "bookmark", title: "Correcciones clave" },
          { role: "coach", icon: "flag", title: "Plan de acción" },
          { role: "player", icon: "auto_stories", title: "Diario" },
          { role: "both", icon: "check_circle", title: "Metas cumplidas" }
        ]
      }
    };

    var ROLE_LABEL = {
      coach: "Entrenador",
      player: "Jugador",
      detail: "Detalle",
      both: "Jugador + coach"
    };

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function ringSvgHtml(n) {
      var seg = 360 / n;
      var arcs = "";
      for (var i = 0; i < n; i++) {
        var start = i * seg - 90;
        var end = start + seg * 0.72;
        var large = seg > 180 ? 1 : 0;
        var r = 46;
        var cx = 50;
        var cy = 50;
        var rad = function (deg) { return (deg * Math.PI) / 180; };
        var x1 = cx + r * Math.cos(rad(start));
        var y1 = cy + r * Math.sin(rad(start));
        var x2 = cx + r * Math.cos(rad(end));
        var y2 = cy + r * Math.sin(rad(end));
        var color = i % 2 === 0 ? "#0F8B4A" : "#F4D43C";
        arcs +=
          '<path d="M ' + x1 + " " + y1 + " A " + r + " " + r + " 0 " + large + " 1 " + x2 + " " + y2 + '" ' +
          'fill="none" stroke="' + color + '" stroke-width="5.5" stroke-linecap="round"/>';
      }
      return (
        '<svg class="ring-svg" viewBox="0 0 100 100" aria-hidden="true">' +
        '<circle cx="50" cy="50" r="46" fill="none" stroke="rgba(10,10,10,0.14)" stroke-width="1.2" stroke-dasharray="3 5"/>' +
        arcs +
        "</svg>"
      );
    }

    function hubHtml() {
      return (
        '<div class="platform-hub">' +
        '<span class="platform-kicker">Plataforma</span>' +
        '<div class="platform-icon" aria-hidden="true"><span class="material-symbols-rounded">search</span></div>' +
        '<div class="platform-title">Gimadd Mentor</div>' +
        '<div class="platform-sub">Coaching online</div>' +
        '<div class="platform-tag">Basado en videoanálisis</div>' +
        "</div>"
      );
    }

    function stepHtml(step, index) {
      var roleClass = "step-role--" + step.role;
      var noIcon = step.role === "detail";
      var cardClass = noIcon ? " step-card--no-icon" : "";
      var icoHtml = noIcon
        ? ""
        : '<div class="step-ico step-ico--' + step.role + '"><span class="material-symbols-rounded">' +
          escapeHtml(step.icon) + "</span></div>";
      return (
        '<div class="step-card' + cardClass + '">' +
        '<span class="step-num">' + (index + 1) + "</span>" +
        '<span class="step-role ' + roleClass + '">' + escapeHtml(ROLE_LABEL[step.role] || "") + "</span>" +
        icoHtml +
        "<h3>" + escapeHtml(step.title) + "</h3></div>"
      );
    }

    function renderFlywheel(versionKey) {
      var v = VERSIONS[versionKey];
      var steps = v.steps;
      var n = steps.length;
      var mount = document.getElementById("flywheel");
      mount.setAttribute("data-count", String(n));

      var stepsHtml = steps.map(function (step, i) {
        var angle = (360 / n) * i;
        return (
          '<div class="flywheel-step" style="--angle:' + angle + 'deg">' +
          stepHtml(step, i) +
          "</div>"
        );
      }).join("");

      mount.innerHTML = ringSvgHtml(n) + hubHtml() + stepsHtml;
      mount.setAttribute(
        "aria-label",
        "Flywheel Gimadd Mentor, " + n + " pasos: " + steps.map(function (s) { return s.title; }).join(", ")
      );
      document.getElementById("versionDesc").innerHTML = v.desc;
    }

    document.querySelectorAll(".version-tabs button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-version");
        document.querySelectorAll(".version-tabs button").forEach(function (b) {
          var isOn = b === btn;
          b.classList.toggle("is-on", isOn);
          b.setAttribute("aria-selected", isOn ? "true" : "false");
        });
        renderFlywheel(key);
      });
    });

    renderFlywheel("coach");
  </script>
</body>
</html>
