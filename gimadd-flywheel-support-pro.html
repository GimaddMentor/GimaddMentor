<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gimadd Mentor — Flywheel · Support Pro</title>
  <meta name="description" content="Flujo de mejora con videoanálisis Gimadd Mentor. Diseño adaptado a la landing Support Pro." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --bg-soft: #F4F2EC;
      --ink: #0A0A0A;
      --ink-soft: #1F1F1F;
      --ink-mute: #6E6E6E;
      --line: #E8E6E0;
      --yellow: #F4D43C;
      --yellow-deep: #D8B814;
      --gold: #C09955;
      --green: #0F8B4A;
      --court: var(--ink-soft);
      --court-deep: var(--ink);
      --accent: var(--yellow);
      --accent-bright: var(--yellow);
      --accent-glow: rgba(244, 212, 60, 0.42);
      --surface: var(--bg);
      --muted: var(--ink-mute);
      --ring-size: min(72vw, 520px);
      --step-w: clamp(108px, 22vw, 132px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; background: var(--bg-soft); }

    body {
      font-family: "Manrope", -apple-system, sans-serif;
      background: var(--bg-soft);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: var(--yellow); color: var(--ink); }

    .flywheel-section {
      position: relative;
      padding: 72px 24px 88px;
      background: var(--bg-soft);
    }

    .section-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section-num {
      align-self: flex-end;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 28px;
    }

    .section-num .total { color: var(--ink); font-weight: 700; }

    .page-header {
      text-align: center;
      max-width: 680px;
      margin-bottom: 1.5rem;
    }

    .page-header .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 1rem;
    }

    .page-header .kicker::before {
      content: "";
      width: 24px;
      height: 1.5px;
      background: var(--yellow-deep);
    }

    .page-header h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(1.75rem, 4.5vw, 2.65rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.08;
      margin-bottom: 0.65rem;
      color: var(--ink);
    }

    .page-header h1 em {
      font-family: "Space Grotesk", sans-serif;
      font-style: italic;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .page-header .intro {
      font-size: 0.95rem;
      color: var(--ink-mute);
      line-height: 1.6;
      max-width: 52ch;
      margin: 0 auto 1.25rem;
      font-weight: 500;
    }

    /* Version tabs */
    .version-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      margin-bottom: 0.65rem;
    }

    .version-tabs button {
      font-family: "Manrope", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--ink);
      background: var(--bg);
      color: var(--ink-soft);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .version-tabs button:hover {
      background: var(--ink);
      color: #fff;
    }

    .version-tabs button.is-on {
      background: var(--yellow);
      border-color: var(--yellow-deep);
      color: var(--ink);
      box-shadow: 0 4px 16px rgba(244, 212, 60, 0.35);
    }

    .version-desc {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      max-width: 52ch;
      margin: 0 auto 1.75rem;
      line-height: 1.5;
      min-height: 2.8em;
    }

    .version-desc strong { color: var(--ink); }

    /* Flywheel */
    .flywheel-stage {
      position: relative;
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto 1.25rem;
    }

    .flywheel-wrap {
      position: relative;
      width: var(--ring-size);
      height: var(--ring-size);
      flex-shrink: 0;
    }

    .flywheel-wrap[data-count="3"] {
      --ring-size: min(80vw, 480px);
      --step-w: clamp(118px, 26vw, 148px);
      --orbit-inset: 18%;
      --hub-scale: 0.82;
    }
    .flywheel-wrap[data-count="6"] {
      --ring-size: min(76vw, 540px);
      --step-w: clamp(100px, 20vw, 122px);
      --orbit-inset: 16%;
    }
    .flywheel-wrap[data-count="7"] {
      --ring-size: min(88vw, 600px);
      --step-w: clamp(84px, 15vw, 106px);
      --orbit-inset: 19%;
    }
    .flywheel-wrap[data-count="8"] {
      --ring-size: min(90vw, 620px);
      --step-w: clamp(82px, 14.5vw, 104px);
      --orbit-inset: 20%;
    }
    .flywheel-wrap[data-count="9"] {
      --ring-size: min(92vw, 630px);
      --step-w: clamp(84px, 14.8vw, 102px);
      --orbit-inset: 18%;
    }
    .flywheel-wrap[data-count="10"] {
      --ring-size: min(94vw, 640px);
      --step-w: clamp(86px, 15vw, 100px);
      --orbit-inset: 19%;
    }

    .flywheel-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .flywheel-ring--outer {
      border: 2px dashed rgba(10, 10, 10, 0.12);
      animation: spin-slow 50s linear infinite;
    }

    .flywheel-ring--mid {
      inset: 7%;
      border: 1.5px solid rgba(244, 212, 60, 0.45);
      box-shadow: 0 0 40px rgba(244, 212, 60, 0.12);
      animation: spin-slow 38s linear infinite reverse;
    }

    .flywheel-ring--pulse {
      inset: 16%;
      background: radial-gradient(circle, rgba(244, 212, 60, 0.12) 0%, transparent 70%);
      animation: pulse-hub 4s ease-in-out infinite;
    }

    @keyframes spin-slow { to { transform: rotate(360deg); } }
    @keyframes pulse-hub {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .flow-svg {
      position: absolute;
      inset: -2%;
      width: 104%;
      height: 104%;
      pointer-events: none;
      overflow: visible;
    }

    .flow-path {
      fill: none;
      stroke: url(#flowGradient);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 8 14;
      animation: dash-flow 2.5s linear infinite;
      opacity: 0.9;
    }

    @keyframes dash-flow { to { stroke-dashoffset: -44; } }

    .loop-badge {
      display: none;
    }

    .hub-loop {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      margin-top: 0.4rem;
      padding: 0.32rem 0.65rem;
      border-radius: 999px;
      background: linear-gradient(140deg, #047857 0%, #10b981 100%);
      color: #fff;
      font-size: clamp(0.48rem, 1.5vw, 0.58rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 3px 12px rgba(16, 185, 129, 0.45);
      line-height: 1;
      white-space: nowrap;
    }

    .hub-loop .material-symbols-rounded {
      font-size: 0.85rem;
      font-variation-settings: "FILL" 1, "wght" 700;
      animation: spin-icon 3s linear infinite;
    }

    @keyframes spin-icon { to { transform: rotate(360deg); } }

    .flywheel-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--hub-scale, 1));
      width: 36%;
      min-width: 108px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--ink) 0%, var(--ink-soft) 100%);
      box-shadow:
        0 20px 50px rgba(10, 10, 10, 0.28),
        0 0 0 4px var(--bg),
        0 0 0 6px var(--yellow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.65rem 0.45rem;
      z-index: 2;
      gap: 0.15rem;
    }

    .flywheel-hub .hub-kicker {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(0.5rem, 1.5vw, 0.58rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--yellow);
      line-height: 1.1;
      margin-bottom: 0.1rem;
    }

    .flywheel-hub .infinity {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--accent-bright);
      line-height: 1;
      margin-bottom: 0.2rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .flywheel-hub .logo-mark {
      width: 2rem;
      height: 2rem;
      border-radius: 10px;
      background: var(--yellow);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.2rem;
    }

    .flywheel-hub .logo-mark .material-symbols-rounded {
      font-size: 1.3rem;
      font-variation-settings: "FILL" 1, "wght" 700;
    }

    .flywheel-hub strong {
      font-size: clamp(0.62rem, 1.85vw, 0.76rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
    }

    .flywheel-hub .hub-tagline {
      display: flex;
      flex-direction: column;
      gap: 0.08rem;
      margin-top: 0.15rem;
      padding: 0 0.15rem;
    }

    .flywheel-hub .hub-line {
      font-size: clamp(0.48rem, 1.45vw, 0.56rem);
      color: rgba(255,255,255,0.92);
      font-weight: 700;
      line-height: 1.2;
    }

    .flywheel-hub .hub-line--accent {
      color: var(--accent-bright);
      font-weight: 800;
    }

    .flywheel-step {
      --angle: 0deg;
      --delay: 0s;
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--step-w);
      margin-left: calc(var(--step-w) / -2);
      margin-top: calc(var(--step-w) / -2);
      transform: rotate(var(--angle)) translateY(calc(var(--ring-size) / -2 + var(--orbit-inset, 14%))) rotate(calc(-1 * var(--angle)));
      z-index: 3;
      animation: step-active-pulse var(--cycle-dur, 8s) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes step-active-pulse {
      0%, 2%, 16%, 19%, 100% {
        z-index: 3;
        filter: drop-shadow(0 4px 12px rgba(10, 10, 10, 0.08));
      }
      4%, 14% {
        z-index: 5;
        filter: drop-shadow(0 8px 24px var(--accent-glow));
      }
    }

    .step-flip {
      display: block;
      width: 100%;
      border: none;
      background: none;
      padding: 0;
      margin: 0;
      font: inherit;
      text-align: inherit;
      cursor: pointer;
      perspective: 600px;
      position: relative;
      z-index: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .step-flip-inner {
      position: relative;
      width: 100%;
      min-height: 5.35rem;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
      animation: step-auto-flip var(--cycle-dur, 8s) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes step-auto-flip {
      0%, 2%, 16%, 19%, 100% { transform: rotateY(0deg); }
      4%, 14% { transform: rotateY(180deg); }
    }

    .step-flip-inner.is-flipped {
      transform: rotateY(180deg);
      animation-play-state: paused;
    }

    .step-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.65rem 0.55rem 0.6rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(10, 10, 10, 0.06);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .step-card--back {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotateY(180deg);
      padding: 0.55rem 0.45rem;
    }

    .step-card--back .step-back-label {
      font-size: 0.48rem;
      font-weight: 800;
      color: var(--court-deep);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
    }

    .step-num {
      position: absolute;
      top: -0.3rem;
      right: -0.3rem;
      width: 1.3rem;
      height: 1.3rem;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--ink);
      font-size: 0.62rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(244, 212, 60, 0.45);
      border: 1px solid var(--yellow-deep);
      z-index: 10;
      pointer-events: none;
    }

    .step-ico {
      width: 2.1rem;
      height: 2.1rem;
      margin: 0 auto 0.35rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-ico .material-symbols-rounded {
      font-size: 1.15rem;
      font-variation-settings: "FILL" 1, "wght" 600;
    }

    .step-ico--coach { background: var(--ink); color: var(--yellow); }
    .step-ico--player { background: var(--yellow); color: var(--ink); }
    .step-ico--loop { background: var(--green); color: #fff; }
    .step-ico--both { background: linear-gradient(140deg, var(--gold), #d4b06a); color: var(--ink); }

    .step-card h3 {
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.02em;
      margin-bottom: 0;
    }

    .step-card p,
    .step-card--back p {
      font-size: 0.56rem;
      color: var(--muted);
      line-height: 1.35;
      font-weight: 500;
    }

    .step-desc-front { display: none; }

    .step-role {
      display: inline-block;
      font-size: 0.48rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      margin-bottom: 0.3rem;
    }

    .step-role--coach { background: rgba(10,10,10,0.08); color: var(--ink); }
    .step-role--player { background: rgba(244,212,60,0.35); color: var(--ink-soft); }
    .step-role--loop { background: rgba(15,139,74,0.15); color: var(--green); }
    .step-role--both { background: rgba(192,153,85,0.2); color: #7a5c28; }

    .flywheel-wrap[data-count="9"] .step-card h3 { font-size: 0.64rem; }
    .flywheel-wrap[data-count="9"] .step-card p { font-size: 0.52rem; }
    .flywheel-wrap[data-count="9"] .step-ico { width: 1.9rem; height: 1.9rem; }
    .flywheel-wrap[data-count="10"] .step-card h3 { font-size: 0.62rem; }
    .flywheel-wrap[data-count="10"] .step-card p { font-size: 0.5rem; }
    .flywheel-wrap[data-count="10"] .step-ico { width: 1.85rem; height: 1.85rem; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 1.75rem;
      margin-top: 3.25rem;
      padding: 0.9rem 1.25rem;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      max-width: 720px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
    }

    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
    .legend-dot--coach { background: var(--ink); }
    .legend-dot--player { background: var(--yellow); }

    .cta-strip {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--ink-mute);
      max-width: 520px;
      line-height: 1.55;
      padding: 0 0.5rem;
      font-weight: 500;
    }

    .cta-strip strong { color: var(--ink); font-weight: 700; }

    .section-cta {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn-mentor {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--ink);
      color: #fff;
      font-family: "Manrope", sans-serif;
      font-size: 14px;
      font-weight: 700;
      border-radius: 99px;
      text-decoration: none;
      transition: background 0.25s ease, transform 0.2s ease;
    }

    .btn-mentor:hover {
      background: var(--ink-soft);
      transform: translateY(-1px);
    }

    .btn-mentor--ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
    }

    .btn-mentor--ghost:hover {
      background: var(--ink);
      color: #fff;
    }

    @media (max-width: 520px) {
      .flywheel-section { padding: 48px 16px 64px; }
      .version-tabs button { font-size: 0.72rem; padding: 0.45rem 0.75rem; }
      .version-desc { margin-bottom: 1.25rem; min-height: auto; }

      .flywheel-wrap[data-count="7"] {
        --ring-size: min(96vw, 420px);
        --step-w: 74px;
        --orbit-inset: 10%;
        --hub-scale: 0.72;
      }
      .flywheel-wrap[data-count="8"] {
        --ring-size: min(96vw, 420px);
        --step-w: 72px;
        --orbit-inset: 9%;
        --hub-scale: 0.72;
      }
      .flywheel-wrap[data-count="9"] {
        --ring-size: min(97vw, 420px);
        --step-w: 68px;
        --orbit-inset: 8%;
        --hub-scale: 0.7;
      }
      .flywheel-wrap[data-count="10"] {
        --ring-size: min(98vw, 420px);
        --step-w: 66px;
        --orbit-inset: 7%;
        --hub-scale: 0.68;
      }

      .step-flip-inner { min-height: 4.85rem; }

      .step-card {
        padding: 0.48rem 0.38rem 0.42rem;
      }

      .step-card h3 {
        font-size: 0.56rem;
        margin-bottom: 0;
        line-height: 1.18;
      }

      .step-card--back p { font-size: 0.5rem; line-height: 1.3; }

      .step-ico {
        width: 1.65rem;
        height: 1.65rem;
        margin-bottom: 0.22rem;
      }

      .step-ico .material-symbols-rounded { font-size: 0.95rem; }

      .step-role {
        font-size: 0.42rem;
        margin-bottom: 0.18rem;
        padding: 0.08rem 0.28rem;
      }

      .step-num {
        width: 1.1rem;
        height: 1.1rem;
        font-size: 0.54rem;
        top: -0.2rem;
        right: -0.2rem;
      }

      .flywheel-hub .hub-kicker { font-size: 0.46rem; }
      .flywheel-hub strong { font-size: 0.58rem; }
      .flywheel-hub .hub-line { font-size: 0.44rem; }
      .flywheel-hub .logo-mark { width: 1.75rem; height: 1.75rem; margin-bottom: 0.12rem; }
      .flywheel-hub .logo-mark .material-symbols-rounded { font-size: 1.05rem; }

      .legend { margin-top: 4rem; }
      .cta-strip { margin-top: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flywheel-ring--outer, .flywheel-ring--mid, .flow-path,
      .flywheel-ring--pulse, .hub-loop .material-symbols-rounded {
        animation: none;
      }
      .flywheel-step { animation: none; }
      .step-flip-inner { animation: none !important; }
    }
  </style>
</head>
<body>

  <section class="flywheel-section" id="mentor-flywheel" aria-labelledby="flywheel-title">
  <div class="section-inner">
    <span class="section-num">/ 09 — <span class="total">Mentor</span></span>

  <header class="page-header">
    <p class="kicker">Gimadd Mentor</p>
    <h1 id="flywheel-title">Mejora tu pádel con <em>videoanálisis</em></h1>
    <p class="intro">
      Graba tu juego, recibe correcciones claras del entrenador y entrena con foco.
      <strong>Vuelta a vuelta, mejoras de verdad.</strong>
    </p>

    <nav class="version-tabs" role="tablist" aria-label="Versión del flywheel">
      <button type="button" role="tab" aria-selected="true" data-version="player" class="is-on">Jugador · 7 pasos</button>
      <button type="button" role="tab" aria-selected="false" data-version="coach">Entrenador · 9 pasos</button>
    </nav>

    <p class="version-desc" id="versionDesc"></p>
  </header>

  <div class="flywheel-stage" id="flywheelStage">
    <div class="flywheel-wrap" id="flywheel" data-count="7" role="img" aria-live="polite"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot legend-dot--player"></span> Lo hace el jugador</div>
    <div class="legend-item"><span class="legend-dot legend-dot--coach"></span> Lo hace el entrenador</div>
  </div>

  <p class="cta-strip" id="ctaStrip"></p>

  <div class="section-cta">
    <a class="btn-mentor" href="https://gimaddmentor.github.io/GimaddMentor/Gimadd_Mentor_APP.html" target="_blank" rel="noopener">Probar Mentor →</a>
    <a class="btn-mentor btn-mentor--ghost" href="https://brilliant-hotteok-755be0.netlify.app">Volver a Support Pro</a>
  </div>

  </div>
  </section>

  <script>
    var VERSIONS = {
      player: {
        desc: "<strong>Jugador</strong>: mejora tu pádel con videoanálisis. Graba, recibe correcciones, entrena con foco y repite.",
        cta: "<strong>Vas a notar el cambio:</strong> cada vídeo te da correcciones claras y objetivos para la siguiente sesión.",
        hub: {
          kicker: "Plataforma",
          title: "Gimadd Mentor",
          line1: "Coaching online",
          line2: "Basado en videoanálisis"
        },
        steps: [
          { role: "player", icon: "videocam", title: "Graba en pista", desc: "Partido o sesión de entreno" },
          { role: "player", icon: "send", title: "Envía al coach", desc: "Cola de revisión pendiente" },
          { role: "coach", icon: "rate_review", title: "Analiza el vídeo", desc: "Ve tu juego con contexto" },
          { role: "coach", icon: "bookmark", title: "Correcciones clave", desc: "Marcas y notas en momentos exactos" },
          { role: "coach", icon: "flag", title: "Plan de acción", desc: "Objetivos claros para la pista" },
          { role: "player", icon: "auto_stories", title: "Diario", desc: "Entrenas con foco y marcas lo practicado" },
          { role: "both", icon: "check_circle", title: "Metas cumplidas", desc: "Todo el plan completado" }
        ]
      },
      coach: {
        desc: "<strong>Entrenador</strong>: convierte cada vídeo en una sesión de mejora medible con correcciones claras y objetivos accionables.",
        cta: "<strong>Valor para tu alumno:</strong> entregas correcciones clave + plan de acción. <strong>Valor para ti:</strong> retención y progreso visible.",
        hub: {
          kicker: "Plataforma",
          title: "Gimadd Mentor",
          line1: "Coaching online",
          line2: "Basado en videoanálisis"
        },
        steps: [
          { role: "coach", icon: "storefront", title: "Catálogo y packs", desc: "Pista + vídeo, precios y cupos" },
          { role: "player", icon: "shopping_bag", title: "Contrata servicio", desc: "Pago seguro · cupos activos" },
          { role: "player", icon: "videocam", title: "Graba en pista", desc: "Partido o sesión de entreno" },
          { role: "player", icon: "send", title: "Envía al coach", desc: "Cola de revisión pendiente" },
          { role: "coach", icon: "rate_review", title: "Analiza el vídeo", desc: "Ves el juego con contexto" },
          { role: "coach", icon: "bookmark", title: "Correcciones clave", desc: "Marcas y notas en el timeline" },
          { role: "coach", icon: "flag", title: "Plan de acción", desc: "Objetivos accionables al jugador" },
          { role: "player", icon: "auto_stories", title: "Diario", desc: "Marca objetivos practicados" },
          { role: "both", icon: "check_circle", title: "Metas cumplidas", desc: "Todo el plan completado" }
        ]
      }
    };

    var ROLE_LABEL = {
      coach: "Entrenador",
      player: "Jugador",
      both: "Jugador + coach"
    };

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function hubContentHtml(hub) {
      return (
        '<div class="flywheel-hub">' +
        '<span class="hub-kicker">' + escapeHtml(hub.kicker) + '</span>' +
        '<div class="logo-mark"><span class="material-symbols-rounded">sports_tennis</span></div>' +
        '<strong>' + escapeHtml(hub.title) + '</strong>' +
        '<span class="hub-tagline">' +
        '<span class="hub-line">' + escapeHtml(hub.line1) + '</span>' +
        '<span class="hub-line hub-line--accent">' + escapeHtml(hub.line2) + '</span>' +
        '</span></div>'
      );
    }

    function stepFlipHtml(step) {
      var roleClass = "step-role--" + step.role;
      var icoClass = "step-ico--" + step.role;
      return (
        '<button type="button" class="step-flip" aria-label="' + escapeHtml(step.title) + ': pulsa para ver detalle" aria-expanded="false">' +
        '<div class="step-flip-inner">' +
        '<div class="step-card step-card--front">' +
        '<span class="step-role ' + roleClass + '">' + escapeHtml(ROLE_LABEL[step.role] || "") + '</span>' +
        '<div class="step-ico ' + icoClass + '"><span class="material-symbols-rounded">' + escapeHtml(step.icon) + '</span></div>' +
        '<h3>' + escapeHtml(step.title) + '</h3>' +
        '<p class="step-desc-front">' + escapeHtml(step.desc) + '</p></div>' +
        '<div class="step-card step-card--back" aria-hidden="true">' +
        '<span class="step-back-label">Detalle</span>' +
        '<p>' + escapeHtml(step.desc) + '</p></div>' +
        '</div></button>'
      );
    }

    function bindStepFlips(mount) {
      if (mount._flipBound) return;
      mount._flipBound = true;

      mount.addEventListener("click", function (e) {
        var btn = e.target.closest(".step-flip");
        if (!btn) return;

        var inner = btn.querySelector(".step-flip-inner");
        var willFlip = !inner.classList.contains("is-flipped");

        mount.querySelectorAll(".step-flip-inner.is-flipped").forEach(function (el) {
          el.classList.remove("is-flipped");
          el.style.animationPlayState = "";
          var otherBtn = el.closest(".step-flip");
          if (otherBtn) otherBtn.setAttribute("aria-expanded", "false");
        });

        if (willFlip) {
          inner.classList.add("is-flipped");
          inner.style.animationPlayState = "paused";
          btn.setAttribute("aria-expanded", "true");
        }
      });
    }

    function renderFlywheel(versionKey) {
      var v = VERSIONS[versionKey];
      var steps = v.steps;
      var n = steps.length;
      var mount = document.getElementById("flywheel");
      var cycleDur = (n * 3.5).toFixed(1) + "s";
      var stepTitles = steps.map(function (s) { return s.title; }).join(", ");

      mount.setAttribute("data-count", String(n));

      var hubHtml =
        '<div class="flywheel-ring flywheel-ring--outer"></div>' +
        '<div class="flywheel-ring flywheel-ring--mid"></div>' +
        '<div class="flywheel-ring flywheel-ring--pulse"></div>' +
        '<svg class="flow-svg" viewBox="0 0 100 100" aria-hidden="true">' +
        '<defs><linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" stop-color="#0A0A0A"/><stop offset="50%" stop-color="#F4D43C"/><stop offset="100%" stop-color="#0F8B4A"/>' +
        '</linearGradient></defs><circle class="flow-path" cx="50" cy="50" r="44"/></svg>' +
        hubContentHtml(v.hub);

      var stepsHtml = steps.map(function (step, i) {
        var angle = (360 / n) * i;
        var delay = (i * (parseFloat(cycleDur) / n)).toFixed(2) + "s";
        return (
          '<div class="flywheel-step" style="--angle:' + angle + 'deg;--delay:' + delay + ';--cycle-dur:' + cycleDur + '">' +
          stepFlipHtml(step) +
          '<span class="step-num">' + (i + 1) + '</span></div>'
        );
      }).join("");

      mount.innerHTML = hubHtml + stepsHtml;
      bindStepFlips(mount);

      mount.setAttribute("aria-label", "Flywheel Gimadd Mentor, " + n + " pasos: " + stepTitles);

      document.getElementById("versionDesc").innerHTML = v.desc;
      document.getElementById("ctaStrip").innerHTML = v.cta;
    }

    document.querySelectorAll(".version-tabs button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-version");
        document.querySelectorAll(".version-tabs button").forEach(function (b) {
          var isOn = b === btn;
          b.classList.toggle("is-on", isOn);
          b.setAttribute("aria-selected", isOn ? "true" : "false");
        });
        renderFlywheel(key);
      });
    });

    renderFlywheel("player");
  </script>
</body>
</html>
