    --bg:#f4f7fb;
    --surface:#ffffff;
    --surface-soft:#f1f5f9;
    --border:#d9e3ee;
    --ink:#0f172a;
    --ink-soft:#475569;
    --ink-faint:#7c8b99;
    --primary:#0369a1;
    --primary-dark:#0c4a6e;
    --primary-soft:#e0f2fe;
    --accent:#f2ec1f;
    --accent-ink:#121212;
    --danger:#c93f3f;
    --danger-soft:#fbe6e6;
    --block:#7a1f3d;
    --block-soft:#f6e3ea;
    --warn:#c98a1f;
    --warn-soft:#faefdb;
    --ok:#15803d;
    --ok-soft:#e3f2e8;
    --shadow: 0 1px 2px rgba(15,30,55,.06), 0 6px 20px -8px rgba(15,30,55,.18);
    --radius: 12px;

      --surface:#132033;
      --surface-soft:#18263c;
      --border:#2a3c55;
      --ink:#e8eef6;
      --ink-soft:#b4c2d4;
      --ink-faint:#7f91a8;
      --primary:#38bdf8;
      --primary-dark:#0ea5e9;
      --primary-soft:#0c2a3d;
      --accent:#f2ec1f;
      --accent-ink:#121212;
      --danger:#e57373;
      --danger-soft:#3a1f22;
      --block:#e28aa8;
      --block-soft:#3a1f2c;
      --warn:#e3b563;
      --warn-soft:#3a2f18;
      --ok:#7fca97;
      --ok-soft:#1c3324;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"DM Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Barlow Semi Condensed","DM Sans",sans-serif;
    font-weight:700;
    letter-spacing:.01em;
    text-wrap:balance;
    margin:0;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 20px 64px;}
  .topbar{
    display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;
    padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(155deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand-text h1{font-size:22px;line-height:1.1;}
  .brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--ink-faint);}
  .home-link{font-size:12px;color:var(--primary);font-weight:600;text-decoration:none;}
  .home-link:hover{text-decoration:underline;}
  .top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .reporter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .reporter input{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:6px 9px;font-size:13px;width:150px;font-family:inherit;
  }
  .reporter input:focus,.toolbar select:focus,.toolbar input:focus,.field input:focus,.field textarea:focus,.field select:focus{
    outline:2px solid var(--primary);outline-offset:1px;
  }
  .lang-toggle{
    display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface);
  }
  .lang-toggle button{
    border:none;background:transparent;color:var(--ink-soft);padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .lang-toggle button.active{background:var(--accent);color:var(--accent-ink);}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{
    flex:1 1 120px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow);
  }
  .stat b{display:block;font-family:"Barlow Semi Condensed";font-size:26px;font-variant-numeric:tabular-nums;line-height:1;}
  .stat span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .stat.total b{color:var(--primary);}
  .stat.block b{color:var(--block);}
  .stat.done b{color:var(--ok);}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
  .toolbar select,.toolbar input[type="search"]{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;
  }
  .toolbar input[type="search"]{min-width:200px;flex:1 1 200px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;
    padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:transform .08s ease, filter .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface-soft);color:var(--ink-soft);border:1px solid var(--border);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-icon{padding:7px 9px;}
  .btn:disabled{opacity:.6;cursor:wait;}
  .spacer{flex:1;}
  .banner{
    display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);
    border:1px solid var(--warn);border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:16px;
    color:var(--ink);
  }
  [hidden]{display:none!important;}
  .board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;}
  @media (max-width:960px){.board{grid-template-columns:1fr;}}
  .col{background:var(--surface-soft);border:1px solid var(--border);border-radius:14px;padding:10px;min-height:120px;}
  .col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;}
  .col-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .col-head h2{font-size:15px;}
  .col-count{margin-left:auto;font-size:12px;color:var(--ink-faint);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums;}
  .cards{display:flex;flex-direction:column;gap:9px;}
  .empty-col{font-size:12px;color:var(--ink-faint);padding:14px 8px;text-align:center;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;
    box-shadow:var(--shadow);transition:box-shadow .12s ease, border-color .1s ease;
  }
  .card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(15,30,55,.12), 0 8px 24px -8px rgba(15,30,55,.22);}
  .card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px;}
  .chip{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:2px 7px;border-radius:20px;white-space:nowrap;
  }
  .chip-bloqueante{background:var(--block-soft);color:var(--block);}
  .chip-alta{background:var(--danger-soft);color:var(--danger);}
  .chip-media{background:var(--warn-soft);color:var(--warn);}
  .chip-baja{background:var(--ok-soft);color:var(--ok);}
  .card-title{font-size:14px;font-weight:600;line-height:1.3;margin:0 0 4px;}
  .card-module{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:6px;}
  .card-thumb{width:100%;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--border);margin-bottom:7px;display:block;background:var(--surface-soft);}
  .zoomable{cursor:zoom-in;}
  .card-desc{font-size:12px;color:var(--ink-soft);line-height:1.4;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-faint);}
  .card-foot .who{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-foot .meta{display:flex;align-items:center;gap:8px;}
  .icn{width:12px;height:12px;vertical-align:-2px;}
  .overlay{position:fixed;inset:0;background:rgba(10,16,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;}
  .modal{background:var(--surface);border-radius:16px;max-width:640px;width:100%;box-shadow:0 20px 60px -15px rgba(0,0,0,.4);border:1px solid var(--border);}
  .modal-head{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border);}
  .modal-head h2{font-size:19px;flex:1;}
  .close-x{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:20px;line-height:1;padding:4px;}
  .close-x:hover{color:var(--ink);}
  .modal-body{padding:20px;display:flex;flex-direction:column;gap:16px;max-height:75vh;overflow:auto;}
  .field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:5px;}
  .field input[type="text"],.field textarea,.field select{
    width:100%;border:1px solid var(--border);background:var(--surface-soft);color:var(--ink);
    border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;resize:vertical;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.grid2{grid-template-columns:1fr;}}
  .drop{
    border:1.5px dashed var(--border);border-radius:12px;padding:16px;text-align:center;
    background:var(--surface-soft);cursor:pointer;font-size:12.5px;color:var(--ink-faint);
  }
  .drop.drag{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);}
  .drop img{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:0 auto 8px;}
  .drop video,.detail-video,.comment video,.comment-preview-video{
    width:100%;max-height:240px;border-radius:8px;display:block;margin:0 auto 8px;background:#0b1220;
  }
  .card-video{width:100%;height:92px;object-fit:cover;border-radius:7px;border:1px solid var(--border);margin-bottom:7px;display:block;background:#0b1220;}
  .drop small{display:block;margin-top:6px;}
  .status-row{display:flex;gap:6px;flex-wrap:wrap;}
  .status-btn{
    border:1px solid var(--border);background:var(--surface-soft);color:var(--ink-soft);
    border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .status-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .comments{display:flex;flex-direction:column;gap:10px;}
  .comment{background:var(--surface-soft);border:1px solid var(--border);border-radius:10px;padding:9px 11px;}
  .comment-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);margin-bottom:3px;}
  .comment-head b{color:var(--ink-soft);}
  .comment p{margin:0;font-size:13.5px;line-height:1.4;white-space:pre-wrap;}
  .comment img{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--border);}
  .comment video{max-height:240px;margin-top:8px;border:1px solid var(--border);}
  .comment-form{display:flex;gap:8px;align-items:center;}
  .comment-form input{flex:1;border:1px solid var(--border);background:var(--surface-soft);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;}
  .comment-preview{max-height:72px;border-radius:8px;border:1px solid var(--border);}
  .comment-preview-video{max-height:120px;margin-top:8px;border:1px solid var(--border);}
  .modal-foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);align-items:center;}
  .confirm-inline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--danger);}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:20px;font-size:13px;box-shadow:var(--shadow);z-index:80;
  }
  .footnote{margin-top:26px;font-size:11.5px;color:var(--ink-faint);text-align:center;}
  .lightbox{
    position:fixed;inset:0;z-index:100;background:rgba(8,12,20,.88);
    display:flex;align-items:center;justify-content:center;padding:28px 16px;cursor:zoom-out;
  }
  .lightbox img{
    max-width:96vw;max-height:94vh;object-fit:contain;border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default;
  }
  .lightbox-close{
    position:absolute;top:12px;right:14px;border:none;background:rgba(255,255,255,.12);
    color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;
  }
  .lightbox-close:hover{background:rgba(255,255,255,.22);}
</style>
</head>

  function persistTrCache(){

  function translateText(text, target){
    text = String(text || "").trim();
    if (!text) return Promise.resolve("");
    if (target === "ru" && hasCyrillic(text)) return Promise.resolve(text);
    if (target === "es" && !hasCyrillic(text)) return Promise.resolve(text);
    var cacheKey = target + ":" + text;
    if (trCache[cacheKey]) return Promise.resolve(trCache[cacheKey]);
    var sl = hasCyrillic(text) ? "ru" : "es";
    if (sl === target) return Promise.resolve(text);

    function save(out){
      trCache[cacheKey] = out;
      persistTrCache();
      return out;
    }
    function chunked(src){
      if (src.length < 1800) return [src];
      var parts = [];
      var buf = "";
      src.split(/(\n+)/).forEach(function(p){
        if ((buf + p).length > 1700){ if (buf) parts.push(buf); buf = p; }
        else buf += p;
      });
      if (buf) parts.push(buf);
      return parts;
    }
    function googleOne(q){
      var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + target + "&dt=t&q=" + encodeURIComponent(q);
      return fetch(url).then(function(r){ return r.json(); }).then(function(data){
        return (data[0] || []).map(function(row){ return row[0]; }).join("");
      });
    }
    function memoryOne(q){
      var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + sl + "|" + target;
      return fetch(url).then(function(r){ return r.json(); }).then(function(data){
        return (data.responseData && data.responseData.translatedText) || q;
      });
    }
    var parts = chunked(text);
    return parts.reduce(function(seq, part){
      return seq.then(function(acc){
        return googleOne(part).catch(function(){ return memoryOne(part); }).then(function(out){ return acc + out; });
      });
    }, Promise.resolve("")).then(save).catch(function(){ return text; });
  }

  function applyContentTranslations(){
    var nodes = document.querySelectorAll("[data-i18n-text]");
    nodes.forEach(function(el){
      var src = el.getAttribute("data-i18n-text");

        if (el.getAttribute("data-i18n-text") === src && el.textContent !== out) el.textContent = out;

  function cssEscape(s){
    if (window.CSS && CSS.escape) return CSS.escape(String(s));

  function eventPath(e){
    if (e.composedPath) return e.composedPath();
    var p = [];
    var n = e.target;
    while (n){ p.push(n); n = n.parentElement || n.parentNode; }
    return p;
  }

  function closestFromEvent(e, selector){
    var path = eventPath(e);
    for (var i = 0; i < path.length; i++){
      var n = path[i];
      if (n && n.nodeType === 1 && n.matches && n.matches(selector)) return n;
    }
    return null;
  }

  function uiBusy(){

  function mantlePath(path, method, body){
    var url, opts;
    if (path.indexOf("list/") === 0){
      url = "https://mantledb.sh/v2/" + path;
    } else {
      url = MANTLE_BASE + "/" + path;
    }
    opts = { method: method || "GET", headers: { "X-Mantle-Key": MANTLE_KEY, "Accept": "application/json" } };
    if (body !== undefined){
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function(res){
      if (!res.ok){
        return res.text().then(function(txt){
          var err = new Error(res.status + " " + txt);
          err.status = res.status;
          err.body = txt;
          if (res.status === 429 || /rate limit/i.test(txt || "")) err.rateLimited = true;
          throw err;
        });
      }
      if (res.status === 204) return null;
      var ct = res.headers.get("content-type") || "";
      if (ct.indexOf("json") === -1) return res.text();
      return res.json();
    });
  }

  function stripInternal(item){
    var hadFull = !!(item && (item.screenshotFull || item.hasRemoteShot));
    var copy = JSON.parse(JSON.stringify(item || {}));
    delete copy._full;
    delete copy._pack;
    delete copy._loadingShot;
    delete copy.screenshotFull;
    if (hadFull) copy.hasRemoteShot = true;
    return copy;
  }

  function bestShot(item){
    if (!item) return "";
    if (safeImg(item.screenshotFull)) return item.screenshotFull;
    if (safeImg(item.screenshot)) return item.screenshot;

  function saveFullShot(id, dataUrl){

  function isQuotaError(err){
    var txt = String((err && (err.body || err.message)) || "");
    return /entry limit|limit reached|100 entries/i.test(txt);

  function packPayload(packId){
    return {
      items: (state.items || []).filter(function(it){ return it._pack === packId; }).map(stripInternal)
    };
  }

  function savePack(packId){
    var body = packPayload(packId);
    if (!body.items.length){
      return mantlePath(packId, "DELETE").catch(function(){});
    }
    return mantlePath(packId, "POST", body);
  }

  function saveMeta(){
    var seen = {};
    var packs = [];
    (state.items || []).forEach(function(it){
      if (it._pack && !seen[it._pack]){
        seen[it._pack] = true;
        packs.push(it._pack);
      }
    });
    packs.sort(function(a,b){
      var na = parseInt(String(a).slice(2), 10) || 0;
      var nb = parseInt(String(b).slice(2), 10) || 0;
      return na - nb;
    });
    return mantlePath("meta", "POST", {
      v: 3,
      updatedAt: new Date().toISOString(),
      packs: packs,
      count: (state.items || []).length
    }).catch(function(){});
  }

  function allocPackFor(item){
    var byPack = {};
    (state.items || []).forEach(function(it){
      if (!it._pack) return;
      (byPack[it._pack] = byPack[it._pack] || []).push(it);
    });
    var ids = Object.keys(byPack).sort(function(a,b){
      return (parseInt(String(a).slice(2),10)||0) - (parseInt(String(b).slice(2),10)||0);
    });
    var cleanNew = stripInternal(item);
    for (var i=0; i<ids.length; i++){
      var trial = byPack[ids[i]].map(stripInternal).concat([cleanNew]);
      if (JSON.stringify({items: trial}).length <= MAX_PACK) return ids[i];
    }
    var n = 0;
    ids.forEach(function(id){
      var m = /^p\/(\d+)$/.exec(id);
      if (m) n = Math.max(n, parseInt(m[1], 10) + 1);
    });
    return "p/" + n;
  }

  function loadRemoteShot(item){
    if (!item || !item.id) return Promise.resolve(item);
    if (safeImg(item.screenshotFull) || !item.hasRemoteShot) return Promise.resolve(item);
    return mantlePath("i/" + item.id, "GET").then(function(data){
      if (data && data.screenshot){
        item.screenshotFull = data.screenshot;
        var idx = state.items.findIndex(function(i){ return sameId(i.id, item.id); });
        if (idx > -1) state.items[idx].screenshotFull = data.screenshot;
      }
      return item;
    }).catch(function(){ return item; });
  }

  function localLoad(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch(e){ return []; } }

  function setupLocalStore(){
    state.dbMode = "local";
    state.items = localLoad();

    render();
    store.add = function(data){
      var items = localLoad();

      items.unshift(item);
      localSave(items);
    };
    store.update = function(id, patch){
      var items = localLoad();
      var idx = items.findIndex(function(i){ return i.id === id; });
      if (idx > -1){
        items[idx] = Object.assign({}, items[idx], patch, {updatedAt: new Date().toISOString()});
        localSave(items);
      }
    };
    store.remove = function(id){
      localSave(localLoad().filter(function(i){ return i.id !== id; }));
    };
    localListeners.push(function(items){ state.items = items; render(); });
  }

  function mergeIncoming(incoming){
    incoming.sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
    var prevById = {};
    (state.items || []).forEach(function(it){ prevById[String(it.id)] = it; });
    var seen = {};
    var merged = incoming.map(function(row){
      var id = String(row.id);
      seen[id] = true;
      var prev = prevById[id];
      if (!prev) return row;
      var out = Object.assign({}, prev, row, {id: prev.id || row.id});
      if (prev.screenshot && !row.screenshot) out.screenshot = prev.screenshot;
      if (prev.screenshotFull && !row.screenshotFull) out.screenshotFull = prev.screenshotFull;
      if (prev._loadingShot) out._loadingShot = prev._loadingShot;
      if (prev._full){
        out._full = true;
        if ((!row.comments || !row.comments.length) && prev.comments) out.comments = prev.comments;
        if (!row.description && prev.description) out.description = prev.description;
        if (!row.video && prev.video) out.video = prev.video;
      }
      return out;
    });
    Object.keys(prevById).forEach(function(id){
      if (seen[id]) return;
      var prev = prevById[id];
      if (!prev || !prev._full || !prev.createdAt) return;
      var age = Date.now() - Date.parse(prev.createdAt);
      if (isFinite(age) && age < 15 * 60 * 1000) merged.unshift(prev);
    });
    state.items = merged;
    state.ready = true;
  }

  function fetchAllTickets(){
    return mantlePath("meta", "GET").then(function(meta){
      if (meta && Number(meta.v) >= 3 && Array.isArray(meta.packs)){
        if (!meta.packs.length) return [];
        return Promise.all(meta.packs.map(function(p){
          return mantlePath(p, "GET").then(function(doc){
            return ((doc && doc.items) || []).map(function(it){
              return Object.assign({comments: []}, it, {id: it.id, _pack: p, _full: true});
            });
          }).catch(function(){ return []; });
        })).then(function(groups){
          return groups.reduce(function(acc, rows){ return acc.concat(rows); }, []);
        });
      }
      throw new Error("no_packs");
    }).catch(function(){
      return mantlePath("list/" + MANTLE_NS, "GET").then(function(list){
        var entries = (list && list.entries) || [];
        var packPaths = entries.map(function(e){ return e.path; }).filter(function(p){ return p && p.indexOf("p/") === 0; });
        if (packPaths.length){
          return Promise.all(packPaths.map(function(p){
            return mantlePath(p, "GET").then(function(doc){
              return ((doc && doc.items) || []).map(function(it){
                return Object.assign({comments: []}, it, {id: it.id, _pack: p, _full: true});
              });
            }).catch(function(){ return []; });
          })).then(function(groups){
            return groups.reduce(function(acc, rows){ return acc.concat(rows); }, []);
          });
        }
        var ticketPaths = entries.map(function(e){ return e.path; }).filter(function(p){ return p && p.indexOf("t/") === 0; });
        if (!ticketPaths.length) return [];
        return Promise.all(ticketPaths.map(function(p){
          return mantlePath(p, "GET").then(function(data){
            var id = p.slice(2);
            return Object.assign({id: id, comments: []}, data, {id: id, _full: true});
          }).catch(function(){ return null; });
        })).then(function(rows){ return rows.filter(Boolean); });
      });
    });
  }

  function hydrateTicket(item){
    if (!item || !item.id) return Promise.resolve(item);
    if (item._full) return Promise.resolve(item);
    return mantlePath("t/" + item.id, "GET").then(function(data){
      if (!data) return item;
      var merged = Object.assign({}, item, data, {id: item.id, _full: true});
      if (!merged.comments) merged.comments = [];
      var idx = state.items.findIndex(function(i){ return sameId(i.id, item.id); });
      if (idx > -1) state.items[idx] = merged;
      return merged;
    }).catch(function(){ return item; });
  }

  function maybeHeartbeat(){ /* no crear entradas extra: el cupo gratis es 100 */ }

  function scheduleSync(ms){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){
      if (state.dbMode !== "db" || document.hidden){
        scheduleSync(SYNC_MS);
        return;
      }
      refreshBoard().catch(function(){});
    }, ms || SYNC_MS);
  }

  function refreshBoard(){
    return fetchAllTickets().then(function(items){
      var fp = indexFingerprint(items);
      var busy = uiBusy();
      if (fp === lastIndexFp && state.ready){
        clearBanner();
        state.dbMode = "db";
        setFootnote();
        syncBackoffMs = SYNC_MS;
        maybeHeartbeat();
        scheduleSync(SYNC_MS);
        return;
      }
      lastIndexFp = fp;
      mergeIncoming(items);
      clearBanner();
      state.dbMode = "db";
      setFootnote();
      syncBackoffMs = SYNC_MS;
      maybeHeartbeat();
      scheduleSync(SYNC_MS);
      if (busy){
        renderStats();
        return;
      }
      renderStats();
      renderBoard();
      applyContentTranslations();
    }).catch(function(err){
      console.error(err);
      if (err && err.rateLimited){
        showBanner(t("syncFailRate"));
        syncBackoffMs = Math.min((syncBackoffMs || SYNC_MS) * 2, 30 * 60 * 1000);
        scheduleSync(syncBackoffMs);
        return;
      }
      showBanner(t("syncFail"));
      /* Si ya hay datos en memoria, no tirar a local vacío; reintentar. */
      if (state.items && state.items.length){
        scheduleSync(SYNC_MS);
        return;
      }
      setupLocalStore();
      scheduleSync(SYNC_MS);
    });
  }

  function setupDbStore(){
    state.dbMode = "db";
    setFootnote();
    refreshBoard();
    store.add = function(data){
      var id = uid();
      var item = Object.assign({id: id, createdAt: new Date().toISOString(), comments: []}, data, {_full: true});
      if (item.screenshotFull) item.hasRemoteShot = true;
      var packId = allocPackFor(item);
      item._pack = packId;
      state.items.unshift(item);
      var writes = [];
      if (item.screenshotFull){
        writes.push(saveFullShot(id, item.screenshotFull).catch(function(err){
          if (isQuotaError(err)) item.hasRemoteShot = false;
          else throw err;
        }));
      }
      writes.push(savePack(packId));
      writes.push(saveMeta());
      return Promise.all(writes).then(function(){
        lastIndexFp = indexFingerprint(state.items);
        render();
      }).catch(function(err){
        console.error(err);
        state.items = state.items.filter(function(i){ return !sameId(i.id, id); });
        showToast(isQuotaError(err) ? t("saveFailLimit") : t("saveFail"));
        throw err;
      });
    };
    store.update = function(id, patch){
      var current = state.items.filter(function(i){ return sameId(i.id, id); })[0] || {};
      var merged = Object.assign({}, current, patch, {updatedAt: new Date().toISOString(), _full: true, _pack: current._pack});
      if (!merged._pack) merged._pack = allocPackFor(merged);
      var idx = state.items.findIndex(function(i){ return sameId(i.id, id); });
      var prev = idx > -1 ? state.items[idx] : null;
      var oldPack = current._pack;
      if (idx > -1) state.items[idx] = merged;
      if (patch.screenshot || patch.screenshotFull){
        var packedSize = JSON.stringify(packPayload(merged._pack)).length;
        if (packedSize > MAX_PACK){
          merged._pack = null;
          if (idx > -1) state.items[idx]._pack = null;
          merged._pack = allocPackFor(merged);
          if (idx > -1) state.items[idx]._pack = merged._pack;
        }
      }
      var writes = [];
      if (patch.screenshotFull){
        merged.hasRemoteShot = true;
        if (idx > -1) state.items[idx].hasRemoteShot = true;
        writes.push(saveFullShot(id, patch.screenshotFull).catch(function(err){
          if (isQuotaError(err)){
            if (idx > -1) state.items[idx].hasRemoteShot = false;
            return;
          }
          throw err;
        }));
      }
      writes.push(savePack(merged._pack));
      if (oldPack && oldPack !== merged._pack) writes.push(savePack(oldPack));
      writes.push(saveMeta());
      return Promise.all(writes).then(function(){
        lastIndexFp = indexFingerprint(state.items);
        lastBoardSig = "";
        render();
      }).catch(function(err){
        console.error(err);
        if (idx > -1 && prev) state.items[idx] = prev;
        showToast(isQuotaError(err) ? t("saveFailLimit") : t("saveFail"));
      });
    };
    store.remove = function(id){
      var current = state.items.filter(function(i){ return sameId(i.id, id); })[0];
      var packId = current && current._pack;
      state.items = state.items.filter(function(i){ return !sameId(i.id, id); });
      var writes = [];
      if (packId) writes.push(savePack(packId));
      writes.push(mantlePath("i/" + id, "DELETE").catch(function(){}));
      writes.push(saveMeta());
      Promise.all(writes).then(function(){
        lastIndexFp = indexFingerprint(state.items);
        render();
      }).catch(function(){ showToast(t("saveFail")); });
    };
  }

  var MAX_VIDEO_BYTES = 80 * 1024 * 1024;
  var VIDEO_NAME_RE = /\.(mp4|webm|mov|m4v|ogv)$/i;

  function isImageFile(file){
    return !!(file && String(file.type || "").indexOf("image/") === 0);
  }
  function isVideoFile(file){
    if (!file) return false;
    var t = String(file.type || "").toLowerCase();
    if (t.indexOf("video/") === 0) return true;
    return VIDEO_NAME_RE.test(file.name || "");
  }
  function videoUploadName(file){
    var name = String(file && file.name || "clip.mp4");
    if (VIDEO_NAME_RE.test(name)) return name.replace(/[^\w.\-]+/g, "_");
    var t = String(file && file.type || "");
    var ext = t === "video/webm" ? ".webm" : (t === "video/quicktime" ? ".mov" : ".mp4");
    return "clip" + ext;
  }
  function uploadVideoFile(file){
    var fd = new FormData();
    fd.append("reqtype", "fileupload");
    fd.append("time", "72h");
    fd.append("fileToUpload", file, videoUploadName(file));
    return fetch("https://litterbox.catbox.moe/resources/internals/api.php", { method: "POST", body: fd }).then(function(res){
      if (!res.ok) throw new Error("http");
      return res.text();
    }).then(function(txt){
      var url = String(txt || "").trim().split(/\s+/)[0];
      if (!safeVideo(url) || url.indexOf("https://litter.catbox.moe/") !== 0) throw new Error("bad_url");
      return url;
    });
  }
  function videoFileToPoster(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var v = document.createElement("video");
      var done = false;
      function finish(err, data){
        if (done) return;
        done = true;
        URL.revokeObjectURL(url);
        if (err) reject(err);
        else resolve(data);
      }
      v.muted = true;
      v.playsInline = true;
      v.preload = "auto";
      v.onloadeddata = function(){
        try { v.currentTime = Math.min(0.25, (v.duration && isFinite(v.duration) ? v.duration : 1) * 0.1); }
        catch(e){ capture(); }
      };
      v.onseeked = capture;
      v.onerror = function(){ finish(new Error("poster")); };
      function capture(){
        try {
          var w = v.videoWidth || 0, h = v.videoHeight || 0;
          if (!w || !h){ finish(new Error("poster")); return; }
          var scale = Math.min(1, 640 / w);
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          canvas.getContext("2d").drawImage(v, 0, 0, cw, ch);
          finish(null, canvas.toDataURL("image/jpeg", 0.7));
        } catch(e){ finish(e || new Error("poster")); }
      }
      setTimeout(function(){ finish(new Error("poster")); }, 5000);
      v.src = url;
    });
  }
  function wireRemoteVideos(){
    var nodes = document.querySelectorAll("video[src^='https://']");
    Array.prototype.forEach.call(nodes, function(el){
      if (el.getAttribute("data-wired") === "1") return;
      el.setAttribute("data-wired", "1");
      el.addEventListener("error", function(){
        if (el.getAttribute("data-blobbed") === "1") return;
        var src = el.getAttribute("src");
        if (!safeVideo(src)) return;
        el.setAttribute("data-blobbed", "1");
        fetch(src).then(function(r){ if (!r.ok) throw new Error("http"); return r.blob(); }).then(function(blob){
          el.removeAttribute("crossorigin");
          el.src = URL.createObjectURL(blob);
        }).catch(function(){});
      });
    });
  }

  function encodeLoadedImage(img, maxW, quality, maxLen){
    var w0 = maxW;
    var q = quality;
    function encode(){
      var scale = Math.min(1, w0 / img.width);
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
      ctx.imageSmoothingEnabled = true;
      if (ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, w, h);
      return canvas.toDataURL("image/jpeg", q);
    }
    var out = encode();
    var tries = 0;
    while (out.length > maxLen && tries < 12){
      if (q > 0.55) q -= 0.07;
      else w0 = Math.round(w0 * 0.88);
      out = encode();
      tries++;
    }
    return out;
  }

  function fileToImageVersions(file){
    return new Promise(function(resolve, reject){
      if (!file || String(file.type).indexOf("image/") !== 0){ reject(new Error("not_image")); return; }
      var reader = new FileReader();
      reader.onerror = function(){ reject(reader.error); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("bad_image")); };
        img.onload = function(){
          resolve({
            full: encodeLoadedImage(img, 1600, 0.88, MAX_FULL_SHOT),
            thumb: encodeLoadedImage(img, 720, 0.7, MAX_THUMB)
          });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function fileToCompressedDataUrl(file, maxLen){
    return new Promise(function(resolve, reject){
      if (!file || String(file.type).indexOf("image/") !== 0){ reject(new Error("not_image")); return; }
      var reader = new FileReader();
      reader.onerror = function(){ reject(reader.error); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("bad_image")); };
        img.onload = function(){
          resolve(encodeLoadedImage(img, 1200, 0.82, maxLen || MAX_COMMENT_SHOT));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    snapshotDraft();
    renderChrome();
    renderStats();
    renderBoard();
    document.getElementById("modalRoot").innerHTML = newModalHtml() + detailModalHtml();
    wireDropzone();
    wireRemoteVideos();
    applyContentTranslations();
  }

  function getReporter(){
    var el = document.getElementById("reporterInput");
    var v = (el && el.value || "").trim();
    return v || t("anon");
  }

  function setLang(lang){
    if (state.lang === lang) return;
    snapshotDraft();
    state.lang = lang;
    try { localStorage.setItem(langKey, lang); } catch(e){}
    render();
    showToast(t("translating"));
  }

  function snapshotDraft(){
    if (state.newOpen && state.draft){
      var tEl = document.getElementById("draftTitle");
      var mEl = document.getElementById("draftModule");
      var pEl = document.getElementById("draftPriority");
      var dEl = document.getElementById("draftDesc");
      if (tEl) state.draft.title = tEl.value;
      if (mEl) state.draft.module = mEl.value;
      if (pEl) state.draft.priority = pEl.value;
      if (dEl) state.draft.description = dEl.value;
    }
  }

  document.getElementById("reporterInput").addEventListener("input", function(e){
    try { localStorage.setItem(reporterKey, e.target.value); } catch(err){}
  });
  document.getElementById("openNew").addEventListener("click", openNewModal);
  document.getElementById("langEs").addEventListener("click", function(){ setLang("es"); });
  document.getElementById("langRu").addEventListener("click", function(){ setLang("ru"); });
  document.getElementById("filterModule").addEventListener("change", function(e){ state.filterModule = e.target.value; renderBoard(); applyContentTranslations(); });
  document.getElementById("filterPriority").addEventListener("change", function(e){ state.filterPriority = e.target.value; renderBoard(); applyContentTranslations(); });
  document.getElementById("filterSearch").addEventListener("input", function(e){ state.filterSearch = e.target.value; renderBoard(); applyContentTranslations(); });

  function openTicket(id){
    if (!id) return;
    state.openId = id;
    state.confirmDeleteId = null;
    state.commentImage = null;
    state.commentVideo = null;
    renderModal();
    var it = state.items.filter(function(i){ return sameId(i.id, id); })[0];
    if (!it) return;
    var needHydrate = !it._full;
    var needShot = !!(it.hasRemoteShot && !it.screenshotFull);
    if (!needHydrate && !needShot) return;
    var seq = needHydrate ? hydrateTicket(it) : Promise.resolve(it);
    seq.then(function(full){
      return needShot ? loadRemoteShot(full || it) : (full || it);
    }).then(function(){
      if (sameId(state.openId, id)) renderModal();
    });
  }

  document.addEventListener("click", function(e){
    if (e.target.id === "lightbox" || e.target.id === "lightboxClose"){
      closeLightbox();
      return;
    }
    var lbImg = closestFromEvent(e, "[data-lightbox]");
    if (lbImg && (lbImg.tagName === "IMG") && safeImg(lbImg.getAttribute("src") || lbImg.src)){
      e.preventDefault();
      e.stopPropagation();
      var card = closestFromEvent(e, "[data-open]");
      var fullSrc = lbImg.getAttribute("data-full-src") || "";
      var it = card ? state.items.filter(function(i){ return sameId(i.id, card.getAttribute("data-open")); })[0] : null;
      if (it && it.hasRemoteShot && !safeImg(it.screenshotFull) && !safeImg(fullSrc)){
        loadRemoteShot(it).then(function(){ openLightbox(bestShot(it) || lbImg.getAttribute("src")); });
        return;
      }
      openLightbox(fullSrc || (it ? bestShot(it) : "") || lbImg.getAttribute("src") || lbImg.src);
      return;
    }
    if (closestFromEvent(e, ".card video, video.card-video")){
      return;
    }
    var openCard = closestFromEvent(e, "[data-open]");
    if (openCard){
      openTicket(openCard.getAttribute("data-open"));
      return;
    }
    var closeBtn = closestFromEvent(e, "[data-close]");
    if (closeBtn){
      var which = closeBtn.getAttribute("data-close");
      if (which === "new") { state.newOpen = false; state.draft = null; }
      if (which === "detail") { state.openId = null; state.confirmDeleteId = null; state.commentImage = null; state.commentVideo = null; }
      renderModal();
      return;
    }
    var overlay = closestFromEvent(e, "[data-close-overlay]");
    if (overlay && e.target === overlay){
      var w = overlay.getAttribute("data-close-overlay");
      if (w === "new") { state.newOpen = false; state.draft = null; }
      if (w === "detail") { state.openId = null; state.confirmDeleteId = null; state.commentImage = null; state.commentVideo = null; }
      renderModal();
      return;
    }
    if (e.target.id === "saveDraft"){
      var titleEl = document.getElementById("draftTitle");
      var title = titleEl.value.trim();
      if (!title){ titleEl.focus(); showToast(t("needTitle")); return; }
      var payload = {
        title: title,
        module: document.getElementById("draftModule").value,
        priority: document.getElementById("draftPriority").value,
        description: document.getElementById("draftDesc").value.trim(),
        screenshotFull: state.draft.screenshotFull || null,
        screenshot: state.draft.screenshot,
        video: state.draft.video || null,
        status: "pendiente",
        reporter: getReporter()
      };
      state.newOpen = false; state.draft = null;
      render();
      Promise.resolve(store.add(payload)).then(function(){ showToast(t("saved")); }).catch(function(){});
      return;
    }
    var statusBtn = closestFromEvent(e, "[data-set-status]");
    if (statusBtn && state.openId){
      store.update(state.openId, {status: statusBtn.getAttribute("data-set-status")});
      return;
    }
    if (e.target.id === "sendComment" && state.openId){ sendCommentFor(state.openId); return; }
    if (closestFromEvent(e, "#attachComment")){
      var cf = document.getElementById("commentFile");
      if (cf) cf.click();
      return;
    }
    if (closestFromEvent(e, "#attachCommentVideo")){
      var vf = document.getElementById("commentVideoFile");
      if (vf) vf.click();
      return;
    }
    if (e.target.id === "askDelete"){ state.confirmDeleteId = state.openId; renderModal(); return; }
    if (e.target.id === "confirmDeleteNo"){ state.confirmDeleteId = null; renderModal(); return; }
    if (e.target.id === "confirmDeleteYes" && state.openId){
      store.remove(state.openId);
      state.openId = null; state.confirmDeleteId = null; state.commentImage = null; state.commentVideo = null;
      render();
      showToast(t("deleted"));
      return;
    }
    if (closestFromEvent(e, "#dropzone") && e.target.tagName !== "INPUT" && e.target.tagName !== "VIDEO"){
      var fi = document.getElementById("fileInput");
      if (fi) fi.click();
      return;
    }
    if (closestFromEvent(e, "#detailDropzone") && e.target.tagName !== "INPUT" && e.target.tagName !== "VIDEO"){
      var df = document.getElementById("detailFileInput");
      if (df) df.click();
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && document.activeElement && document.activeElement.id === "commentInput" && state.openId){
      sendCommentFor(state.openId);
    }
    if (e.key === "Escape"){
      if (isLightboxOpen()){ closeLightbox(); return; }
      if (state.newOpen){ state.newOpen = false; state.draft = null; renderModal(); }
      else if (state.openId){ state.openId = null; state.confirmDeleteId = null; state.commentImage = null; state.commentVideo = null; renderModal(); }
    }
  });

  function sendCommentFor(id){
    var input = document.getElementById("commentInput");
    var text = (input && input.value || "").trim();
    var image = state.commentImage;
    var video = state.commentVideo;
    if (!text && !image && !video) return;
    var it = state.items.filter(function(i){ return sameId(i.id, id); })[0];
    var comments = (it && it.comments || []).slice();
    comments.push({author: getReporter(), text: text, at: new Date().toISOString(), image: image || null, video: video || null});
    state.commentImage = null;
    state.commentVideo = null;
    store.update(id, {comments: comments});
    if (input) input.value = "";
  }

  function bindDropzone(zoneId, inputId, target){
    var dz = document.getElementById(zoneId);
    var fileInput = document.getElementById(inputId);
    if (fileInput){
      fileInput.addEventListener("change", function(){
        handleFiles(fileInput.files, target);
        fileInput.value = "";
      });
    }
    if (dz){
      dz.addEventListener("dragover", function(e){ e.preventDefault(); dz.classList.add("drag"); });
      dz.addEventListener("dragleave", function(){ dz.classList.remove("drag"); });
      dz.addEventListener("drop", function(e){
        e.preventDefault(); dz.classList.remove("drag");
        handleFiles(e.dataTransfer.files, target);
      });
    }
  }

  function wireDropzone(){
    bindDropzone("dropzone", "fileInput", "draft");
    bindDropzone("detailDropzone", "detailFileInput", "detail");
    var commentFile = document.getElementById("commentFile");
    if (commentFile){
      commentFile.addEventListener("change", function(){
        if (commentFile.files && commentFile.files[0]) handlePickedFile(commentFile.files[0], "comment");
        commentFile.value = "";
      });
    }
    var commentVideoFile = document.getElementById("commentVideoFile");
    if (commentVideoFile){
      commentVideoFile.addEventListener("change", function(){
        if (commentVideoFile.files && commentVideoFile.files[0]) handlePickedFile(commentVideoFile.files[0], "comment");
        commentVideoFile.value = "";
      });
    }
  }

  document.addEventListener("paste", function(e){
    if (!state.newOpen && !state.openId) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i=0; i<items.length; i++){
      if (items[i].type.indexOf("image/") === 0){
        var f = items[i].getAsFile();
        if (f){
          var pasteTarget = "comment";
          if (state.newOpen) pasteTarget = "draft";
          else if (document.activeElement && document.activeElement.id === "commentInput") pasteTarget = "comment";
          else if (state.openId) pasteTarget = "detail";
          handleImageFile(f, pasteTarget);
          e.preventDefault();
        }
        return;
      }
    }
  });

  function handlePickedFile(file, target){
    if (isVideoFile(file)) handleVideoFile(file, target);
    else if (isImageFile(file)) handleImageFile(file, target);
    else showToast(t("vidType"), 4000);
  }
  function handleFiles(list, target){
    Array.prototype.forEach.call(list || [], function(f){ handlePickedFile(f, target); });
  }
  function handleVideoFile(file, target){
    if (file.size > MAX_VIDEO_BYTES){ showToast(t("vidBig"), 4000); return; }
    if (!isVideoFile(file)){ showToast(t("vidType"), 4000); return; }
    showToast(t("vidWait"), 20000);
    snapshotDraft();
    uploadVideoFile(file).then(function(url){
      if (target === "comment"){
        state.commentVideo = url;
        renderModal();
        return;
      }
      if (target === "detail" && state.openId){
        store.update(state.openId, {video: url});
        showToast(t("saved"));
        return;
      }
      if (state.draft) state.draft.video = url;
      var needPoster = state.draft && !state.draft.screenshot;
      if (!needPoster){ renderModal(); return; }
      return videoFileToPoster(file).then(function(poster){
        if (state.draft && !state.draft.screenshot) state.draft.screenshot = poster;
      }).catch(function(){}).then(function(){ renderModal(); });
    }).catch(function(){ showToast(t("vidFail"), 4000); });
  }

  function handleImageFile(file, target){
    showToast(t("imgWait"));
    snapshotDraft();
    if (target === "comment"){
      fileToCompressedDataUrl(file, MAX_COMMENT_SHOT).then(function(dataUrl){
        state.commentImage = dataUrl;
        renderModal();
      }).catch(function(){ showToast(t("imgFail")); });
      return;
    }
    fileToImageVersions(file).then(function(v){
      if (target === "detail" && state.openId){
        store.update(state.openId, {
          screenshot: v.thumb,
          screenshotFull: v.full,
          hasRemoteShot: true
        });
        showToast(t("shotSaved"));
        return;
      }
      if (!state.draft) return;
      state.draft.screenshot = v.thumb;
      state.draft.screenshotFull = v.full;
      renderModal();
    }).catch(function(){ showToast(t("imgFail")); });
  }

  function openLightbox(src){
    var root = document.getElementById("lightbox");
    var img = document.getElementById("lightboxImg");
    var btn = document.getElementById("lightboxClose");
    if (!root || !img || !safeImg(src)) return;
    img.src = src;
    if (btn) btn.setAttribute("aria-label", t("closeImg"));
    root.hidden = false;
  }
  function closeLightbox(){
    var root = document.getElementById("lightbox");
    var img = document.getElementById("lightboxImg");
    if (root) root.hidden = true;
    if (img) img.removeAttribute("src");
  }
  function isLightboxOpen(){
    var root = document.getElementById("lightbox");
    return !!(root && !root.hidden);
  }

  init();
  render();
})();
</script>
</body>
</html>
