  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;flex:none;

  .home-link:hover{text-decoration:underline;}

  .reporter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .reporter input{

  .reporter input:focus,.toolbar select:focus,.toolbar input:focus,.field input:focus,.field textarea:focus,.field select:focus{

  .lang-toggle button{

  .stat{

  .stat span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .stat.total b{color:var(--primary);}
  .stat.block b{color:var(--block);}
  .stat.done b{color:var(--ok);}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
  .toolbar select,.toolbar input[type="search"]{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;
  }

    display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;

    transition:transform .08s ease, filter .12s ease;

  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface-soft);color:var(--ink-soft);border:1px solid var(--border);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}

  .spacer{flex:1;}

  .empty-col{font-size:12px;color:var(--ink-faint);padding:14px 8px;text-align:center;}

  .chip-baja{background:var(--ok-soft);color:var(--ok);}

  .card-module{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:6px;}

  .card-desc{font-size:12px;color:var(--ink-soft);line-height:1.4;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  function translateText(text, target){
    text = String(text || "").trim();
    if (!text) return Promise.resolve("");
    if (target === "ru" && hasCyrillic(text)) return Promise.resolve(text);
    if (target === "es" && !hasCyrillic(text)) return Promise.resolve(text);
    var cacheKey = target + ":" + text;
    if (trCache[cacheKey]) return Promise.resolve(trCache[cacheKey]);
    var sl = hasCyrillic(text) ? "ru" : "es";
    if (sl === target) return Promise.resolve(text);

    function save(out){
      trCache[cacheKey] = out;
      persistTrCache();
      return out;
    }
    function chunked(src){
      if (src.length < 1800) return [src];
      var parts = [];
      var buf = "";
      src.split(/(\n+)/).forEach(function(p){
        if ((buf + p).length > 1700){ if (buf) parts.push(buf); buf = p; }
        else buf += p;
      });
      if (buf) parts.push(buf);
      return parts;
    }
    function googleOne(q){
      var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + target + "&dt=t&q=" + encodeURIComponent(q);
      return fetch(url).then(function(r){ return r.json(); }).then(function(data){
        return (data[0] || []).map(function(row){ return row[0]; }).join("");
      });
    }
    function memoryOne(q){
      var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + sl + "|" + target;
      return fetch(url).then(function(r){ return r.json(); }).then(function(data){
        return (data.responseData && data.responseData.translatedText) || q;
      });
    }
    var parts = chunked(text);
    return parts.reduce(function(seq, part){
      return seq.then(function(acc){
        return googleOne(part).catch(function(){ return memoryOne(part); }).then(function(out){ return acc + out; });
      });
    }, Promise.resolve("")).then(save).catch(function(){ return text; });
  }

  function mantlePath(path, method, body){
    var url, opts;
    if (path.indexOf("list/") === 0){
      url = "https://mantledb.sh/v2/" + path;
    } else {
      url = MANTLE_BASE + "/" + path;
    }
    opts = { method: method || "GET", headers: { "X-Mantle-Key": MANTLE_KEY, "Accept": "application/json" } };
    if (body !== undefined){
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function(res){
      if (!res.ok) return res.text().then(function(txt){ throw new Error(res.status + " " + txt); });
      if (res.status === 204) return null;
      var ct = res.headers.get("content-type") || "";
      if (ct.indexOf("json") === -1) return res.text();
      return res.json();
    });
  }

  function fitDoc(obj){
    var copy = JSON.parse(JSON.stringify(obj));
    var json = JSON.stringify(copy);
    if (json.length <= MAX_DOC) return { doc: copy, extra: null };
    var shot = copy.screenshot || null;
    copy.screenshot = null;
    copy.hasRemoteShot = !!shot;
    json = JSON.stringify(copy);
    if (json.length > MAX_DOC && copy.comments){
      copy.comments = copy.comments.map(function(c){
        var n = Object.assign({}, c);
        if (n.image){ n.hasRemoteImage = true; n.image = null; }
        return n;
      });
    }
    return { doc: copy, extra: shot ? { screenshot: shot } : null };
  }

      return item;
    }).catch(function(){ return item; });

  function fetchAllTickets(){

      if (!ticketPaths.length) return [];
      return Promise.all(ticketPaths.map(function(p){

          var id = p.slice(2);
          return Object.assign({id: id, comments: []}, data, {id: id});

  function setupDbStore(){
    state.dbMode = "db";
    setFootnote();
    function refresh(){
      return fetchAllTickets().then(function(items){
        mergeItems(items);
        maybeHeartbeat();
      });
    }
    refresh().catch(function(err){
      console.error(err);
      showBanner(t("syncFail"));
      setupLocalStore();
    });
    store.add = function(data){
      var id = uid();
      var item = Object.assign({id: id, createdAt: new Date().toISOString(), comments: []}, data);
      var packed = fitDoc(item);
      var writes = [mantlePath("t/" + id, "POST", packed.doc)];
      if (packed.extra) writes.push(mantlePath("i/" + id, "POST", packed.extra));
      return Promise.all(writes).then(function(){
        state.items.unshift(Object.assign({}, packed.doc, packed.extra || {}, {screenshot: item.screenshot, video: item.video || packed.doc.video || null}));
        render();
      }).catch(function(err){
        console.error(err);
        showToast(t("saveFail"));
        throw err;
      });
    };
    store.update = function(id, patch){
      var current = state.items.filter(function(i){ return i.id === id; })[0] || {};
      var merged = Object.assign({}, current, patch, {updatedAt: new Date().toISOString()});
      var packed = fitDoc(merged);
      var writes = [mantlePath("t/" + id, "POST", packed.doc)];
      if (packed.extra) writes.push(mantlePath("i/" + id, "POST", packed.extra));
      Promise.all(writes).then(function(){
        var idx = state.items.findIndex(function(i){ return i.id === id; });
        if (idx > -1) state.items[idx] = Object.assign({}, packed.doc, packed.extra || {}, {screenshot: merged.screenshot, video: merged.video || packed.doc.video || null});
        render();
      }).catch(function(err){
        console.error(err);
        showToast(t("saveFail"));
      });
    };
    store.remove = function(id){
      Promise.all([
        mantlePath("t/" + id, "DELETE").catch(function(){}),
        mantlePath("i/" + id, "DELETE").catch(function(){})
      ]).then(function(){
        state.items = state.items.filter(function(i){ return i.id !== id; });
        render();
      }).catch(function(){ showToast(t("saveFail")); });
    };
    setInterval(function(){
      if (state.dbMode !== "db" || state.newOpen) return;
      refresh().catch(function(){});
    }, 5 * 60 * 1000);
  }

  var MAX_VIDEO_BYTES = 80 * 1024 * 1024;
  var VIDEO_NAME_RE = /\.(mp4|webm|mov|m4v|ogv)$/i;

  function isImageFile(file){
    return !!(file && String(file.type || "").indexOf("image/") === 0);
  }
  function isVideoFile(file){
    if (!file) return false;
    var t = String(file.type || "").toLowerCase();
    if (t.indexOf("video/") === 0) return true;
    return VIDEO_NAME_RE.test(file.name || "");
  }
  function videoUploadName(file){
    var name = String(file && file.name || "clip.mp4");
    if (VIDEO_NAME_RE.test(name)) return name.replace(/[^\w.\-]+/g, "_");
    var t = String(file && file.type || "");
    var ext = t === "video/webm" ? ".webm" : (t === "video/quicktime" ? ".mov" : ".mp4");
    return "clip" + ext;
  }
  function uploadVideoFile(file){
    var fd = new FormData();
    fd.append("reqtype", "fileupload");
    fd.append("time", "72h");
    fd.append("fileToUpload", file, videoUploadName(file));
    return fetch("https://litterbox.catbox.moe/resources/internals/api.php", { method: "POST", body: fd }).then(function(res){
      if (!res.ok) throw new Error("http");
      return res.text();
    }).then(function(txt){
      var url = String(txt || "").trim().split(/\s+/)[0];
      if (!safeVideo(url) || url.indexOf("https://litter.catbox.moe/") !== 0) throw new Error("bad_url");
      return url;
    });
  }
  function videoFileToPoster(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var v = document.createElement("video");
      var done = false;
      function finish(err, data){
        if (done) return;
        done = true;
        URL.revokeObjectURL(url);
        if (err) reject(err);
        else resolve(data);
      }
      v.muted = true;
      v.playsInline = true;
      v.preload = "auto";
      v.onloadeddata = function(){
        try { v.currentTime = Math.min(0.25, (v.duration && isFinite(v.duration) ? v.duration : 1) * 0.1); }
        catch(e){ capture(); }
      };
      v.onseeked = capture;
      v.onerror = function(){ finish(new Error("poster")); };
      function capture(){
        try {
          var w = v.videoWidth || 0, h = v.videoHeight || 0;
          if (!w || !h){ finish(new Error("poster")); return; }
          var scale = Math.min(1, 640 / w);
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          canvas.getContext("2d").drawImage(v, 0, 0, cw, ch);
          finish(null, canvas.toDataURL("image/jpeg", 0.7));
        } catch(e){ finish(e || new Error("poster")); }
      }
      setTimeout(function(){ finish(new Error("poster")); }, 5000);
      v.src = url;
    });
  }
  function wireRemoteVideos(){
    var nodes = document.querySelectorAll("video[src^='https://']");
    Array.prototype.forEach.call(nodes, function(el){
      if (el.getAttribute("data-wired") === "1") return;
      el.setAttribute("data-wired", "1");
      el.addEventListener("error", function(){
        if (el.getAttribute("data-blobbed") === "1") return;
        var src = el.getAttribute("src");
        if (!safeVideo(src)) return;
        el.setAttribute("data-blobbed", "1");
        fetch(src).then(function(r){ if (!r.ok) throw new Error("http"); return r.blob(); }).then(function(blob){
          el.removeAttribute("crossorigin");
          el.src = URL.createObjectURL(blob);
        }).catch(function(){});
      });
    });
  }

  function fileToCompressedDataUrl(file){
    return new Promise(function(resolve, reject){
      if (!file || String(file.type).indexOf("image/") !== 0){ reject(new Error("not_image")); return; }
      var reader = new FileReader();
      reader.onerror = function(){ reject(reader.error); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("bad_image")); };
        img.onload = function(){
          var maxW = 1000;
          var quality = 0.7;
          function encode(){
            var scale = Math.min(1, maxW / img.width);
            var w = Math.max(1, Math.round(img.width * scale));
            var h = Math.max(1, Math.round(img.height * scale));
            var canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext("2d");
            ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
            ctx.drawImage(img, 0, 0, w, h);
            return canvas.toDataURL("image/jpeg", quality);
          }
          var out = encode();
          var tries = 0;
          while (out.length > 48000 && tries < 8){
            if (quality > 0.28) quality -= 0.12;
            else maxW = Math.round(maxW * 0.82);
            out = encode();
            tries++;
          }
          resolve(out);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    document.getElementById("stats").innerHTML =
      stat("total", items.length, t("statTotal")) +
      stat("block", blockAlta, t("statBlock")) +
      stat("", byStatus.en_desarrollo || 0, t("statDev")) +
      stat("done", byStatus.verificado || 0, t("statDone"));
  }

  function renderBoard(){
    var items = filteredItems();
    var html = "";
    STATUSES.forEach(function(col){
      var colItems = items.filter(function(it){ return it.status === col.id; });
      html += '<div class="col" data-status="' + col.id + '">';
      html += '<div class="col-head"><span class="col-dot" style="background:' + col.dot + '"></span><h2>' + escapeHtml(stLabel(col.id)) + '</h2><span class="col-count mono">' + colItems.length + "</span></div>";
      html += '<div class="cards">';
      if (!colItems.length) html += '<div class="empty-col">' + escapeHtml(t("empty")) + "</div>";
      else colItems.forEach(function(it){ html += cardHtml(it); });
      html += "</div></div>";
    });
    document.getElementById("board").innerHTML = html;
    wireRemoteVideos();
    items.forEach(function(it){
      if (it.hasRemoteShot && !it.screenshot && !it._loadingShot){
        it._loadingShot = true;
        loadRemoteShot(it).then(function(){
          it._loadingShot = false;
          renderBoard();
          applyContentTranslations();
        });
      }
    });
  }

  function cardHtml(it){
    var commentCount = (it.comments || []).length;
    var shot = it.screenshot;
    var media = "";
    if (safeImg(shot)) media += '<img class="card-thumb zoomable" data-lightbox src="' + shot + '" alt="">';
    if (safeVideo(it.video)) media += videoPlayerHtml(it.video, "card-video", shot);
    return '<div class="card" data-open="' + escapeHtml(it.id) + '">'
      + '<div class="card-top"><span class="chip chip-' + escapeHtml(it.priority||"media") + '">' + escapeHtml(priLabel(it.priority)) + "</span></div>"
      + '<div class="card-module">' + escapeHtml(moduleLabel(it.module)) + "</div>"
      + media
      + '<p class="card-title" data-i18n-text="' + escapeHtml(it.title || "") + '">' + escapeHtml(it.title || t("untitled")) + "</p>"
      + (it.description ? '<p class="card-desc" data-i18n-text="' + escapeHtml(it.description) + '">' + escapeHtml(it.description) + "</p>" : "")
      + '<div class="card-foot"><span class="who">' + escapeHtml(it.reporter || t("anon")) + " · " + fmtDate(it.createdAt) + "</span>"
      + '<span class="meta">' + (shot || it.hasRemoteShot ? camIcon() : "") + (safeVideo(it.video) ? videoIcon() : "") + (commentCount ? chatIcon() + commentCount : "") + "</span></div>"
      + "</div>";
  }

  function openNewModal(){
    state.draft = { title:"", module: "video", priority:"media", description:"", screenshot:null, video:null };
    state.newOpen = true;
    render();
    setTimeout(function(){ var el = document.getElementById("draftTitle"); if (el) el.focus(); }, 30);
  }

  function dropzoneHtml(shot, video){
    var has = safeImg(shot) || safeVideo(video);
    var inner = "";
    if (safeVideo(video)) inner += videoPlayerHtml(video, "drop-video", shot);
    else if (safeImg(shot)) inner += '<img src="' + shot + '" alt="">';
    else inner += "<div>" + videoIcon() + camIcon() + "</div>";
    inner += "<div>" + escapeHtml(t(has ? "dropReplace" : "dropEmpty")) + "</div>";
    inner += "<small>" + escapeHtml(t("dropHint")) + "</small>";
    inner += '<input type="file" accept="image/*,video/mp4,video/webm,video/quicktime,video/*" id="fileInput" hidden multiple>';
    return '<div class="drop" id="dropzone" tabindex="0">' + inner + "</div>";
  }

  function newModalHtml(){
    if (!state.newOpen) return "";
    var d = state.draft;
    var modOpts = MODULE_IDS.map(function(id){
      return '<option value="' + id + '"' + (id===d.module?" selected":"") + ">" + escapeHtml(moduleLabel(id)) + "</option>";
    }).join("");
    var prOpts = PRIORITIES.map(function(id){
      return '<option value="' + id + '"' + (id===d.priority?" selected":"") + ">" + escapeHtml(priLabel(id)) + "</option>";
    }).join("");
    return '<div class="overlay" data-close-overlay="new">'
      + '<div class="modal" role="dialog" aria-modal="true">'
        + '<div class="modal-head"><h2>' + escapeHtml(t("newTitle")) + '</h2><button class="close-x" data-close="new">✕</button></div>'
        + '<div class="modal-body">'
          + '<div class="field"><label>' + escapeHtml(t("fieldTitle")) + '</label><input type="text" id="draftTitle" placeholder="' + escapeHtml(t("titlePh")) + '" value="' + escapeHtml(d.title) + '"></div>'
          + '<div class="grid2">'
            + '<div class="field"><label>' + escapeHtml(t("fieldModule")) + "</label><select id=\"draftModule\">" + modOpts + "</select></div>"
            + '<div class="field"><label>' + escapeHtml(t("fieldPriority")) + "</label><select id=\"draftPriority\">" + prOpts + "</select></div>"
          + "</div>"
          + '<div class="field"><label>' + escapeHtml(t("fieldDesc")) + '</label><textarea id="draftDesc" rows="4" placeholder="' + escapeHtml(t("descPh")) + '">' + escapeHtml(d.description) + "</textarea></div>"
          + '<div class="field"><label>' + escapeHtml(t("fieldShot")) + "</label>" + dropzoneHtml(d.screenshot, d.video) + "</div>"
        + "</div>"
        + '<div class="modal-foot">'
          + '<button class="btn btn-ghost" data-close="new">' + escapeHtml(t("cancel")) + "</button>"
          + '<div class="spacer"></div>'
          + '<button class="btn btn-primary" id="saveDraft">' + escapeHtml(t("save")) + "</button>"
        + "</div>"
      + "</div></div>";
  }

  function detailModalHtml(){
    if (!state.openId) return "";
    var it = state.items.filter(function(i){ return i.id === state.openId; })[0];
    if (!it) return "";
    var statusBtns = STATUSES.map(function(s){
      return '<button class="status-btn' + (s.id===it.status?" active":"") + '" data-set-status="' + s.id + '">' + escapeHtml(stLabel(s.id)) + "</button>";
    }).join("");
    var comments = (it.comments || []).slice().reverse().map(function(c){
      return '<div class="comment"><div class="comment-head"><b>' + escapeHtml(c.author||t("anon")) + "</b><span>" + fmtDate(c.at) + "</span></div>"
        + (c.text ? '<p data-i18n-text="' + escapeHtml(c.text) + '">' + escapeHtml(c.text) + "</p>" : "")
        + (safeImg(c.image) ? '<img class="zoomable" data-lightbox src="' + c.image + '" alt="">' : "")
        + (safeVideo(c.video) ? videoPlayerHtml(c.video, "", c.image) : "")
        + "</div>";
    }).join("") || '<div class="empty-col">' + escapeHtml(t("noComments")) + "</div>";

    var confirmRow = state.confirmDeleteId === it.id
      ? '<div class="confirm-inline">' + escapeHtml(t("deleteAsk")) + ' <button class="btn btn-danger btn-icon" id="confirmDeleteYes">' + escapeHtml(t("deleteYes")) + '</button><button class="btn btn-ghost btn-icon" id="confirmDeleteNo">' + escapeHtml(t("cancel")) + "</button></div>"
      : '<button class="btn btn-ghost btn-icon" id="askDelete" title="Delete">🗑</button>';

    var commentImg = state.commentImage
      ? '<img class="comment-preview" src="' + state.commentImage + '" alt="">'
      : "";
    var commentVid = safeVideo(state.commentVideo)
      ? videoPlayerHtml(state.commentVideo, "comment-preview-video")
      : "";

    return '<div class="overlay" data-close-overlay="detail">'
      + '<div class="modal" role="dialog" aria-modal="true">'
        + '<div class="modal-head"><span class="chip chip-' + escapeHtml(it.priority||"media") + '">' + escapeHtml(priLabel(it.priority)) + '</span><h2 data-i18n-text="' + escapeHtml(it.title||"") + '">' + escapeHtml(it.title||"") + '</h2><button class="close-x" data-close="detail">✕</button></div>'
        + '<div class="modal-body">'
          + '<div class="field"><label>' + escapeHtml(t("fieldModule")) + "</label><div>" + escapeHtml(moduleLabel(it.module)) + "</div></div>"
          + (it.description ? '<div class="field"><label>' + escapeHtml(t("fieldDesc")) + '</label><p style="margin:0;font-size:14px;line-height:1.5;" data-i18n-text="' + escapeHtml(it.description) + '">' + escapeHtml(it.description) + "</p></div>" : "")
          + (safeImg(it.screenshot) ? '<div class="field"><label>' + escapeHtml(t("capture")) + '</label><img class="zoomable" data-lightbox src="' + it.screenshot + '" alt="" style="width:100%;border-radius:10px;border:1px solid var(--border);"></div>' : "")
          + (safeVideo(it.video) ? '<div class="field"><label>' + escapeHtml(t("videoLabel")) + "</label>" + videoPlayerHtml(it.video, "detail-video", it.screenshot) + "</div>" : "")
          + '<div class="field"><label>' + escapeHtml(t("status")) + '</label><div class="status-row">' + statusBtns + "</div></div>"
          + '<div class="field"><label>' + escapeHtml(t("comments")) + '</label><div class="comments">' + comments + "</div>"
            + '<div class="comment-form" style="margin-top:8px;">'
              + '<input type="text" id="commentInput" placeholder="' + escapeHtml(t("commentPh")) + '" maxlength="600">'
              + '<button class="btn btn-ghost btn-icon" id="attachComment" title="' + escapeHtml(t("attachImage")) + '">' + camIcon() + "</button>"
              + '<button class="btn btn-ghost btn-icon" id="attachCommentVideo" title="' + escapeHtml(t("attachVideo")) + '">' + videoIcon() + "</button>"
              + '<input type="file" accept="image/*" id="commentFile" hidden>'
              + '<input type="file" accept="video/*" id="commentVideoFile" hidden>'
              + '<button class="btn btn-primary btn-icon" id="sendComment">' + escapeHtml(t("send")) + "</button>"
            + "</div>"
            + commentImg + commentVid
          + "</div>"
          + '<div style="font-size:11.5px;color:var(--ink-faint);">' + escapeHtml(t("reportedBy")) + " " + escapeHtml(it.reporter||t("anon")) + " · " + fmtDate(it.createdAt) + (it.updatedAt ? " · " + escapeHtml(t("updated")) + " " + fmtDate(it.updatedAt) : "") + "</div>"
        + "</div>"
        + '<div class="modal-foot">' + confirmRow + "</div>"
      + "</div></div>";
  }

  function render(){
    renderChrome();
    renderStats();
    renderBoard();
    document.getElementById("modalRoot").innerHTML = newModalHtml() + detailModalHtml();
    wireDropzone();
    wireRemoteVideos();
    applyContentTranslations();
  }

  function getReporter(){
    var el = document.getElementById("reporterInput");
    var v = (el && el.value || "").trim();
    return v || t("anon");
  }

  function setLang(lang){
    if (state.lang === lang) return;
    snapshotDraft();
    state.lang = lang;
    try { localStorage.setItem(langKey, lang); } catch(e){}
    render();
    showToast(t("translating"));
  }

  function snapshotDraft(){
    if (state.newOpen && state.draft){
      var tEl = document.getElementById("draftTitle");
      var mEl = document.getElementById("draftModule");
      var pEl = document.getElementById("draftPriority");
      var dEl = document.getElementById("draftDesc");
      if (tEl) state.draft.title = tEl.value;
      if (mEl) state.draft.module = mEl.value;
      if (pEl) state.draft.priority = pEl.value;
      if (dEl) state.draft.description = dEl.value;
    }
  }

  document.getElementById("reporterInput").addEventListener("input", function(e){
    try { localStorage.setItem(reporterKey, e.target.value); } catch(err){}
  });
  document.getElementById("openNew").addEventListener("click", openNewModal);
  document.getElementById("langEs").addEventListener("click", function(){ setLang("es"); });
  document.getElementById("langRu").addEventListener("click", function(){ setLang("ru"); });
  document.getElementById("filterModule").addEventListener("change", function(e){ state.filterModule = e.target.value; renderBoard(); applyContentTranslations(); });
  document.getElementById("filterPriority").addEventListener("change", function(e){ state.filterPriority = e.target.value; renderBoard(); applyContentTranslations(); });
  document.getElementById("filterSearch").addEventListener("input", function(e){ state.filterSearch = e.target.value; renderBoard(); applyContentTranslations(); });

  document.addEventListener("click", function(e){
    if (e.target.id === "lightbox" || e.target.id === "lightboxClose"){
      closeLightbox();
      return;
    }
    var lbImg = e.target.closest && e.target.closest("[data-lightbox]");
    if (lbImg && (lbImg.tagName === "IMG") && safeImg(lbImg.getAttribute("src") || lbImg.src)){
      e.preventDefault();
      e.stopPropagation();
      openLightbox(lbImg.getAttribute("src") || lbImg.src);
      return;
    }
    if (e.target.closest && e.target.closest(".card video, video.card-video")){
      return;
    }
    var openCard = e.target.closest("[data-open]");
    if (openCard){
      state.openId = openCard.getAttribute("data-open");
      state.confirmDeleteId = null;
      state.commentImage = null;
      state.commentVideo = null;
      var it = state.items.filter(function(i){ return i.id === state.openId; })[0];
      if (it) loadRemoteShot(it).then(function(){ render(); });
      else render();
      return;
    }
    var closeBtn = e.target.closest("[data-close]");
    if (closeBtn){
      var which = closeBtn.getAttribute("data-close");
      if (which === "new") { state.newOpen = false; state.draft = null; }
      if (which === "detail") { state.openId = null; state.confirmDeleteId = null; state.commentImage = null; state.commentVideo = null; }
      render();
      return;
    }
    var overlay = e.target.closest("[data-close-overlay]");
    if (overlay && e.target === overlay){
      var w = overlay.getAttribute("data-close-overlay");
      if (w === "new") { state.newOpen = false; state.draft = null; }
      if (w === "detail") { state.openId = null; state.confirmDeleteId = null; state.commentImage = null; state.commentVideo = null; }
      render();
      return;
    }
    if (e.target.id === "saveDraft"){
      var titleEl = document.getElementById("draftTitle");
      var title = titleEl.value.trim();
      if (!title){ titleEl.focus(); showToast(t("needTitle")); return; }
      var payload = {
        title: title,
        module: document.getElementById("draftModule").value,
        priority: document.getElementById("draftPriority").value,
        description: document.getElementById("draftDesc").value.trim(),
        screenshot: state.draft.screenshot,
        video: state.draft.video || null,
        status: "pendiente",
        reporter: getReporter()
      };
      state.newOpen = false; state.draft = null;
      render();
      Promise.resolve(store.add(payload)).then(function(){ showToast(t("saved")); }).catch(function(){});
      return;
    }
    if (e.target.matches("[data-set-status]") && state.openId){
      store.update(state.openId, {status: e.target.getAttribute("data-set-status")});
      return;
    }
    if (e.target.id === "sendComment" && state.openId){ sendCommentFor(state.openId); return; }
    if (e.target.id === "attachComment" || (e.target.closest && e.target.closest("#attachComment"))){
      var cf = document.getElementById("commentFile");
      if (cf) cf.click();
      return;
    }
    if (e.target.id === "attachCommentVideo" || (e.target.closest && e.target.closest("#attachCommentVideo"))){
      var vf = document.getElementById("commentVideoFile");
      if (vf) vf.click();
      return;
    }
    if (e.target.id === "askDelete"){ state.confirmDeleteId = state.openId; render(); return; }
    if (e.target.id === "confirmDeleteNo"){ state.confirmDeleteId = null; render(); return; }
    if (e.target.id === "confirmDeleteYes" && state.openId){
      store.remove(state.openId);
      state.openId = null; state.confirmDeleteId = null; state.commentImage = null; state.commentVideo = null;
      render();
      showToast(t("deleted"));
      return;
    }
    if (e.target.closest && e.target.closest("#dropzone") && e.target.tagName !== "INPUT" && e.target.tagName !== "VIDEO"){
      var fi = document.getElementById("fileInput");
      if (fi) fi.click();
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && document.activeElement && document.activeElement.id === "commentInput" && state.openId){
      sendCommentFor(state.openId);
    }
    if (e.key === "Escape"){
      if (isLightboxOpen()){ closeLightbox(); return; }
      if (state.newOpen){ state.newOpen = false; state.draft = null; render(); }
      else if (state.openId){ state.openId = null; state.confirmDeleteId = null; state.commentImage = null; state.commentVideo = null; render(); }
    }
  });

  function sendCommentFor(id){
    var input = document.getElementById("commentInput");
    var text = (input && input.value || "").trim();
    var image = state.commentImage;
    var video = state.commentVideo;
    if (!text && !image && !video) return;
    var it = state.items.filter(function(i){ return i.id === id; })[0];
    var comments = (it && it.comments || []).slice();
    comments.push({author: getReporter(), text: text, at: new Date().toISOString(), image: image || null, video: video || null});
    state.commentImage = null;
    state.commentVideo = null;
    store.update(id, {comments: comments});
    if (input) input.value = "";
  }

  function wireDropzone(){
    var dz = document.getElementById("dropzone");
    var fileInput = document.getElementById("fileInput");
    if (fileInput){
      fileInput.addEventListener("change", function(){
        handleFiles(fileInput.files, "draft");
        fileInput.value = "";
      });
    }
    if (dz){
      dz.addEventListener("dragover", function(e){ e.preventDefault(); dz.classList.add("drag"); });
      dz.addEventListener("dragleave", function(){ dz.classList.remove("drag"); });
      dz.addEventListener("drop", function(e){
        e.preventDefault(); dz.classList.remove("drag");
        handleFiles(e.dataTransfer.files, "draft");
      });
    }
    var commentFile = document.getElementById("commentFile");
    if (commentFile){
      commentFile.addEventListener("change", function(){
        if (commentFile.files && commentFile.files[0]) handlePickedFile(commentFile.files[0], "comment");
        commentFile.value = "";
      });
    }
    var commentVideoFile = document.getElementById("commentVideoFile");
    if (commentVideoFile){
      commentVideoFile.addEventListener("change", function(){
        if (commentVideoFile.files && commentVideoFile.files[0]) handlePickedFile(commentVideoFile.files[0], "comment");
        commentVideoFile.value = "";
      });
    }
  }

  document.addEventListener("paste", function(e){
    if (!state.newOpen && !state.openId) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i=0; i<items.length; i++){
      if (items[i].type.indexOf("image/") === 0){
        var f = items[i].getAsFile();
        if (f){
          handleImageFile(f, state.newOpen ? "draft" : "comment");
          e.preventDefault();
        }
        return;
      }
    }
  });

  function handlePickedFile(file, target){
    if (isVideoFile(file)) handleVideoFile(file, target);
    else if (isImageFile(file)) handleImageFile(file, target);
    else showToast(t("vidType"), 4000);
  }
  function handleFiles(list, target){
    Array.prototype.forEach.call(list || [], function(f){ handlePickedFile(f, target); });
  }
  function handleVideoFile(file, target){
    if (file.size > MAX_VIDEO_BYTES){ showToast(t("vidBig"), 4000); return; }
    if (!isVideoFile(file)){ showToast(t("vidType"), 4000); return; }
    showToast(t("vidWait"), 20000);
    snapshotDraft();
    uploadVideoFile(file).then(function(url){
      if (target === "comment") state.commentVideo = url;
      else if (state.draft) state.draft.video = url;
      var needPoster = target !== "comment" && state.draft && !state.draft.screenshot;
      if (!needPoster){ render(); return; }
      return videoFileToPoster(file).then(function(poster){
        if (state.draft && !state.draft.screenshot) state.draft.screenshot = poster;
      }).catch(function(){}).then(function(){ render(); });
    }).catch(function(){ showToast(t("vidFail"), 4000); });
  }

  function handleImageFile(file, target){
    showToast(t("imgWait"));
    snapshotDraft();
    fileToCompressedDataUrl(file).then(function(dataUrl){
      if (target === "comment"){
        state.commentImage = dataUrl;
      } else if (state.draft){
        state.draft.screenshot = dataUrl;
      }
      render();
    }).catch(function(){ showToast(t("imgFail")); });
  }

  function openLightbox(src){
    var root = document.getElementById("lightbox");
    var img = document.getElementById("lightboxImg");
    var btn = document.getElementById("lightboxClose");
    if (!root || !img || !safeImg(src)) return;
    img.src = src;
    if (btn) btn.setAttribute("aria-label", t("closeImg"));
    root.hidden = false;
  }
  function closeLightbox(){
    var root = document.getElementById("lightbox");
    var img = document.getElementById("lightboxImg");
    if (root) root.hidden = true;
    if (img) img.removeAttribute("src");
  }
  function isLightboxOpen(){
    var root = document.getElementById("lightbox");
    return !!(root && !root.hidden);
  }

  var origRender = render;
  render = function(){
    snapshotDraft();
    origRender();
  };

  init();
  render();
})();
</script>
</body>
</html>
