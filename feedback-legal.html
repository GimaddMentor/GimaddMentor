<title>Checklist legal MVP · Gimadd Mentor</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f4f7fb; --surface:#fff; --surface-soft:#f1f5f9; --border:#d9e3ee;
    --ink:#0f172a; --ink-soft:#475569; --ink-faint:#7c8b99;
    --primary:#0369a1; --primary-dark:#0c4a6e; --primary-soft:#e0f2fe;
    --accent:#f2ec1f; --accent-ink:#121212;
    --danger:#c93f3f; --danger-soft:#fbe6e6;
    --warn:#c98a1f; --warn-soft:#faefdb;
    --ok:#15803d; --ok-soft:#e3f2e8;
    --todo:#64748b; --todo-soft:#eef2f6;
    --wip:#b45309; --wip-soft:#fff4e5;
    --shadow: 0 1px 2px rgba(15,30,55,.06), 0 6px 20px -8px rgba(15,30,55,.18);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --surface:#132033; --surface-soft:#18263c; --border:#2a3c55;
      --ink:#e8eef6; --ink-soft:#b4c2d4; --ink-faint:#7f91a8;
      --primary:#38bdf8; --primary-dark:#0ea5e9; --primary-soft:#0c2a3d;
      --accent:#f2ec1f; --accent-ink:#121212;
      --danger:#e57373; --danger-soft:#3a1f22;
      --warn:#e3b563; --warn-soft:#3a2f18;
      --ok:#7fca97; --ok-soft:#1c3324;
      --todo:#94a3b8; --todo-soft:#1a2738;
      --wip:#f0b56a; --wip-soft:#3a2d18;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"DM Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Barlow Semi Condensed","DM Sans",sans-serif;font-weight:700;letter-spacing:.01em;margin:0;}
  a{color:inherit;}
  button,input,select{font-family:inherit;}
  [hidden]{display:none!important;}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px;}
  .topbar{
    display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;
    padding-bottom:18px;margin-bottom:16px;border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(155deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand-text h1{font-size:22px;line-height:1.1;}
  .brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--ink-faint);}
  .home-link{font-size:12px;color:var(--primary);font-weight:600;text-decoration:none;margin-right:10px;}
  .home-link:hover{text-decoration:underline;}
  .top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .reporter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .reporter input{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:6px 9px;font-size:13px;width:150px;
  }
  .reporter input:focus,.toolbar select:focus,.toolbar input:focus,.note-input:focus{
    outline:2px solid var(--primary);outline-offset:1px;
  }
  .lang-toggle{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface);}
  .lang-toggle button{border:none;background:transparent;color:var(--ink-soft);padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .lang-toggle button.active{background:var(--accent);color:var(--accent-ink);}
  .banner{
    display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);
    border:1px solid var(--warn);border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:14px;
  }
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{
    flex:1 1 110px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow);
  }
  .stat b{display:block;font-family:"Barlow Semi Condensed";font-size:26px;font-variant-numeric:tabular-nums;line-height:1;}
  .stat span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .stat.todo b{color:var(--todo);}
  .stat.wip b{color:var(--wip);}
  .stat.done b{color:var(--ok);}
  .stat.p0 b{color:var(--danger);}
  .progress{height:8px;background:var(--surface-soft);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin:0 0 14px;display:flex;}
  .progress i{display:block;height:100%;}
  .progress .p-done{background:var(--ok);}
  .progress .p-wip{background:var(--wip);}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;position:sticky;top:0;z-index:8;background:var(--bg);padding:8px 0;}
  .toolbar select,.toolbar input[type="search"]{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:9px;padding:8px 10px;font-size:13px;
  }
  .toolbar input[type="search"]{min-width:180px;flex:1 1 180px;}
  .pills{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .pill.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-soft);border-radius:9px;
    padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .sec{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;
  }
  .sec > summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:14px 16px;font-family:"Barlow Semi Condensed",sans-serif;font-size:17px;font-weight:700;
  }
  .sec > summary::-webkit-details-marker{display:none;}
  .sec > summary:hover{background:var(--surface-soft);}
  .sec-mark{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;}
  .sec-counts{margin-left:auto;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;color:var(--ink-faint);background:var(--surface-soft);border:1px solid var(--border);border-radius:20px;padding:2px 9px;}
  .rows{border-top:1px solid var(--border);}
  .row{
    display:grid;grid-template-columns:auto 1fr;gap:6px 12px;
    padding:12px 14px;border-bottom:1px solid var(--border);align-items:start;
  }
  .row:last-child{border-bottom:none;}
  .row.st-done{background:color-mix(in srgb, var(--ok-soft) 45%, transparent);}
  .row.st-wip{background:color-mix(in srgb, var(--wip-soft) 50%, transparent);}
  .row-head{display:flex;gap:8px;align-items:flex-start;}
  .row-id{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;font-weight:500;
    color:var(--primary);min-width:36px;padding-top:2px;
  }
  .q{
    margin:0;font-size:14.5px;font-weight:600;line-height:1.35;cursor:pointer;
  }
  .q:hover{color:var(--primary);}
  .preview{
    margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--ink-soft);cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .row.open .preview{display:none;}
  .open-hint{font-size:11.5px;font-weight:600;color:var(--primary);margin-top:5px;cursor:pointer;}
  .row.open .open-hint{display:none;}
  .hint{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;font-size:13px;line-height:1.55;color:var(--ink-soft);
    margin-bottom:14px;box-shadow:var(--shadow);
  }
  .hint b{color:var(--ink);}
  .box.mean{background:var(--primary-soft);border-color:color-mix(in srgb, var(--primary) 35%, var(--border));}
  .box.check{background:var(--ok-soft);border-color:color-mix(in srgb, var(--ok) 35%, var(--border));}
  .box.dev{background:var(--warn-soft);border-color:color-mix(in srgb, var(--warn) 35%, var(--border));}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 0;}
  .chip{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:2px 7px;border-radius:20px;white-space:nowrap;
  }
  .chip-p0{background:var(--danger-soft);color:var(--danger);}
  .chip-p1{background:var(--todo-soft);color:var(--todo);}
  .extra{grid-column:1 / -1;display:none;padding:4px 0 2px 36px;}
  .row.open .extra{display:block;}
  .extra .box{
    background:var(--surface-soft);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;
  }
  .extra .box label,.note-wrap label{
    display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-faint);margin-bottom:4px;
  }
  .extra p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-soft);white-space:pre-wrap;}
  .st-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;grid-column:1 / -1;}
  .st-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:20px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .st-btn[data-s="todo"].active{background:var(--todo-soft);border-color:var(--todo);color:var(--todo);}
  .st-btn[data-s="wip"].active{background:var(--wip-soft);border-color:var(--wip);color:var(--wip);}
  .st-btn[data-s="done"].active{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
  .who{font-size:11.5px;color:var(--ink-faint);margin-left:4px;}
  .note-input{
    width:100%;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:9px;padding:8px 10px;font-size:13px;
  }
  .empty{text-align:center;color:var(--ink-faint);padding:28px 12px;font-size:14px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:20px;font-size:13px;box-shadow:var(--shadow);z-index:80;
  }
  .footnote{margin-top:22px;font-size:11.5px;color:var(--ink-faint);text-align:center;}
  @media (min-width:720px){
    .row{grid-template-columns:auto 1fr auto;align-items:start;}
    .st-row{grid-column:auto;margin-top:0;justify-content:flex-end;max-width:360px;padding-top:2px;}
    .extra{grid-column:2 / -1;padding-left:0;}
  }
</style>
</head>

<script>
(function(){
  "use strict";
  var MANTLE_NS = "gimadd-mentor-qa-20261023";
  var MANTLE_KEY = "b84b1187f396c12e5857a242314a1364481528e4a786afd34dd931c27aa67828";
  var MANTLE_BASE = "https://mantledb.sh/v2/" + MANTLE_NS;
  var LEGAL_PATH = "legal";
  var SYNC_MS = 45 * 1000;
  var ITEMS = [{"id":"PAY1","kind":"pay","pri":"P0","q":"Compra por internet: ¿quién cobra y quién emite cada factura?","a":"El Entrenador o academia recibe el dinero del servicio; Gimadd recibe su comisión. Gimadd prepara la factura del servicio a nombre del Entrenador o academia y emite otra propia por su comisión.","mean":"En una compra por internet hay tres sujetos posibles: quien vende el servicio, el Jugador que compra y quien paga la cuota de Gimadd. Una academia puede cobrar o figurar en una factura; no se crea un cuarto perfil.","check":"Comprad un servicio de prueba: la factura del servicio sale a nombre del Entrenador o academia y la de la comisión a nombre de Gimadd Fitness S.L.","note":"","sec":"pay"},{"id":"PAY2","kind":"pay","pri":"P0","q":"Cuota de uso de Gimadd: ¿quién cobra y quién emite la factura?","a":"Cobra Gimadd. Gimadd factura al Entrenador o academia que paga la cuota.","mean":"La cuota de Gimadd es distinta de las clases. La factura va a quien paga esa cuota, que puede ser el Entrenador o una academia.","check":"Haced que una academia pague la cuota y un Entrenador venda una clase: dos facturas, cada una con el titular correcto.","note":"","sec":"pay"},{"id":"PAY3","kind":"pay","pri":"P0","q":"Clase en efectivo: ¿quién cobra y quién emite la factura?","a":"El Entrenador o academia cobra directamente. Se ocupa de la factura. Gimadd no cobra comisión ni emite factura por esa clase.","mean":"Gimadd puede registrar que se pagó en efectivo, pero no cobra, no pasa por Stripe y no factura el servicio.","check":"Marcad una clase como pagada en efectivo y comprobad que no hay cobro Stripe ni factura o comisión de Gimadd.","note":"","sec":"pay"},{"id":"PAY4","kind":"pay","pri":"P0","q":"Devolución: ¿quién recibe el dinero y quién corrige las facturas?","a":"Se devuelve el dinero que corresponda de cada parte. Cada emisor corrige su factura si es necesario.","mean":"La devolución del servicio y la de la comisión de Gimadd se tratan por separado, cada una con su documento de corrección.","check":"Haced una devolución total y comprobad los importes recibidos y las facturas de corrección.","note":"","sec":"pay"},{"id":"01","kind":"q","pri":"P0","q":"¿A qué productos se aplicará esta documentación?","a":"Solo Gimadd Mentor: web, catálogo público de Entrenadores y aplicación para entrenadores y jugadores. No se aplica a la tienda de Gimadd Support.","mean":"El alcance legal y funcional corresponde exclusivamente al ecosistema Gimadd Mentor, no al ecommerce del soporte físico. Evitad reutilizar en Mentor banners, condiciones o flujos contractuales de Gimadd Support.","check":"Entrar en web, catálogo público de Entrenadores y aplicación: los textos y enlaces remiten a Mentor y no mezclan la tienda física.","note":"","sec":"s01"},{"id":"02","kind":"q","pri":"P0","q":"¿Quién podrá registrarse como entrenador?","a":"Solo personas mayores de 18 años.","mean":"El rol entrenador permite crear servicios, gestionar Jugadores y cobrar. No puede activarse por una persona que declare ser menor de edad.","check":"Intentar registrar un Entrenador menor de 18 años y confirmar que no se activa el rol.","note":"","sec":"s01"},{"id":"03","kind":"q","pri":"P0","q":"¿Podrán usar la plataforma los jugadores menores de edad?","a":"Sí, con autorización verificable del padre, madre o representante legal, especialmente para contratar servicios de pago.","mean":"Los menores pueden ser jugadores, pero su uso y especialmente la contratación requieren un representante legal autorizado. El consentimiento del adulto no debe asumirse al escribir su email.","check":"Crear cuenta de menor: no puede contratar antes de completar autorización; tras autorizar se habilitan las funciones permitidas.","note":"Registrar el consentimiento y el adulto autorizante; no pedir documentos de identidad por defecto.","sec":"s01"},{"id":"04","kind":"q","pri":"P0","q":"¿Cómo se autorizará la cuenta de un menor?","a":"Mediante un flujo de autorización por correo electrónico del representante legal, con aceptación registrada y enlace verificable.","mean":"El adulto recibe un enlace verificable, ve qué autoriza y confirma. Guardar quién autorizó, cuándo, desde qué proceso y qué textos aceptó; enlaces caducados o reutilizados no deben funcionar.","check":"Probar enlace válido, caducado y revocado; revisar registro auditable de la autorización.","note":"El menor no debe acceder a contratación sin autorización válida.","sec":"s01"},{"id":"05","kind":"q","pri":"P0","q":"¿Qué ocurrirá si el representante legal revoca la autorización?","a":"El representante podrá revocarla mediante un enlace seguro y verificado; se limitará la cuenta del menor conforme a la ley y contratos pendientes.","mean":"Debe existir un mecanismo seguro para que el responsable legal retire su autorización. La plataforma bloqueará lo que proceda y resolverá servicios ya contratados sin borrar pruebas necesarias.","check":"Revocar desde el enlace autenticado y comprobar que cambian los permisos del menor y que se registra el evento.","note":"","sec":"s01"},{"id":"06","kind":"q","pri":"P0","q":"¿Qué ocurre cuando un jugador menor cumple 18 años?","a":"Deberá aceptar personalmente las condiciones vigentes y confirmar sus datos; se conservará su historial conforme a los plazos aplicables.","mean":"Al llegar a 18 años el usuario pasa a consentir por sí mismo. La transición no debe crear una cuenta nueva ni borrar su progreso deportivo.","check":"Simular cumpleaños 18: solicitar aceptación propia y mantener historial y compras correspondientes.","note":"","sec":"s01"},{"id":"07","kind":"q","pri":"P0","q":"¿Quién puede pagar la cuota mensual de Gimadd del Entrenador?","a":"La cuota puede pagarla el Entrenador o una academia. Cada Entrenador tiene su propio espacio de trabajo.","mean":"Si paga una academia, la factura de la cuota debe ir a nombre de esa academia. Eso no convierte su espacio en una cuenta compartida para varios Entrenadores.","check":"Haced que una academia pague la cuota de Gimadd. Comprobad su nombre en la factura y que el Entrenador tenga una cuenta individual.","note":"","sec":"s01"},{"id":"08","kind":"q","pri":"P0","q":"¿Qué necesita un Entrenador para vender servicios en Gimadd?","a":"Ser mayor de 18 años, confirmar que ejerce legalmente y completar la comprobación de identidad y cobros de Stripe.","mean":"Se puede utilizar la lista de Jugadores sin vender servicios. Pero el Entrenador no puede cobrar por Gimadd hasta completar la comprobación.","check":"Intentad vender con un Entrenador sin verificar. La venta debe bloquearse hasta completar los datos.","note":"","sec":"s01"},{"id":"09","kind":"q","pri":"P0","q":"¿Quién es responsable de prestar una clase, un programa o un videoanálisis?","a":"El servicio lo presta y vende el Entrenador o la academia indicada. Gimadd facilita la aplicación y el pago; no presta directamente el servicio deportivo.","mean":"El Jugador debe saber antes de pagar quién le está vendiendo el servicio. La factura del servicio debe ser de ese Entrenador o academia, no de Gimadd.","check":"Comprad una clase y revisad que el nombre de quien vende aparece correctamente antes del pago y en la factura.","note":"","sec":"s01"},{"id":"10","kind":"q","pri":"P0","q":"¿Puede vender una academia una clase que imparte un Entrenador?","a":"Sí. Si la academia vende el servicio, le corresponde recibir el cobro y figurar en la factura, aunque la clase la dé un Entrenador.","mean":"Diferenciar quién imparte la clase de quién es el responsable de la venta y de su factura.","check":"Comprad una clase vendida por una academia y comprobad que el dinero y la factura corresponden a la academia.","note":"","sec":"s01"},{"id":"11","kind":"q","pri":"P0","q":"¿Pueden ser distintos quien paga la cuota de Gimadd y quien vende la clase?","a":"Sí. Separar quien paga la cuota de Gimadd, quien vende cada servicio y el Jugador que lo compra.","mean":"Una academia puede pagar la cuota de Gimadd y otro Entrenador vender una clase. Las facturas tienen que reflejar cada situación.","check":"Preparad una compra con academia pagadora y Entrenador vendedor distinto. Comprobad los titulares de ambas facturas.","note":"","sec":"s01"},{"id":"12","kind":"q","pri":"P0","q":"¿Qué debe saber el Jugador sobre el Entrenador o academia antes de pagar?","a":"Antes de pagar debe poder consultar la identidad y los datos de contacto necesarios de quien vende el servicio. La factura llevará sus datos fiscales completos.","mean":"No basta con identificar al Entrenador o academia únicamente en la factura posterior.","check":"Entrad a una compra como Jugador y revisad que esta información aparece antes de pagar.","note":"","sec":"s01"},{"id":"13","kind":"q","pri":"P1","q":"¿Puede el entrenador ocultar su perfil en el catálogo público de Entrenadores?","a":"Sí, mediante un control de visibilidad del perfil; para vender públicamente deberá completar la verificación pertinente.","mean":"El entrenador debe decidir si su ficha es pública. La privacidad del perfil no elimina la posibilidad de trabajar con Jugadores ya vinculados cuando el sistema lo permita.","check":"Alternar visibilidad y comprobar búsqueda pública; verificar que funciones internas no desaparecen.","note":"","sec":"s01"},{"id":"14","kind":"q","pri":"P1","q":"¿Cómo se ordenarán los entrenadores en el catálogo público de Entrenadores?","a":"Por criterios relevantes como ubicación, idioma, especialidad, reseñas verificadas y filtros del jugador; sin priorización pagada encubierta en el lanzamiento.","mean":"Ordenar resultados mediante criterios pertinentes al jugador, sin publicidad encubierta. Documentar el criterio principal de ordenación visible al consumidor.","check":"Buscar con filtros de idioma y ubicación y comprobar cambios coherentes; no insertar puestos pagados sin etiqueta.","note":"","sec":"s01"},{"id":"15","kind":"q","pri":"P0","q":"¿Qué idiomas tendrán los documentos legales de lanzamiento?","a":"Español e inglés, con versión y fecha de aceptación identificables.","mean":"Presentar documentos ES/EN según idioma de interfaz y registrar exactamente la versión aceptada. No bastan enlaces estáticos sin trazabilidad del consentimiento contractual.","check":"Contratar en ambos idiomas y confirmar versión, fecha y texto vinculados a la aceptación.","note":"","sec":"s01"},{"id":"16","kind":"q","pri":"P1","q":"¿Se ofrecerá el catálogo público de Entrenadores internacionalmente sin restricciones?","a":"Solo en territorios donde sea viable cumplir las obligaciones de contratación, pagos, protección de datos y fiscalidad.","mean":"No habilitar cobros en países no soportados por fiscalidad, prestadores, medios de pago o condiciones regulatorias. Evitar asumir que Stripe disponible significa venta autorizada.","check":"Simular país soportado/no soportado: verificar restricción y mensaje informativo.","note":"","sec":"s01"},{"id":"17","kind":"q","pri":"P0","q":"¿Qué servicios se podrán contratar en el lanzamiento?","a":"Programas de 3, 6 y 12 meses, videoanálisis individuales, clases presenciales, packs y suscripciones mensuales del Jugador.","mean":"Solo servicios individuales. No mostrar videollamadas ni precios o contratación en pareja.","check":"Cread y comprad un ejemplo de cada servicio y comprobad que no aparece la opción de pareja.","note":"","sec":"s02"},{"id":"18","kind":"q","pri":"P0","q":"¿Los servicios tendrán modalidad para parejas?","a":"No. La contratación y el seguimiento son individuales en el MVP.","mean":"El MVP no admite precio para dos jugadores ni un servicio compartido por pareja. No confundir esta exclusión con que haya dos jugadores distintos en una clase grupal real fuera de la aplicación.","check":"Revisar formulario de alta, listado y pantalla de pago: no existen selector pareja ni precios duales.","note":"","sec":"s02"},{"id":"19","kind":"q","pri":"P0","q":"¿Cómo se contratan los programas de 3, 6 y 12 meses?","a":"Mediante pago único por duración cerrada y condiciones previamente visibles y aceptadas.","mean":"Programa es contrato prepago de plazo fijo, no una suscripción. Deben mostrarse duración y contenido del seguimiento antes del cargo único.","check":"Comprar programa 3 meses; comprobar un único cargo y contrato con vencimiento visible.","note":"","sec":"s02"},{"id":"20","kind":"q","pri":"P0","q":"¿Desde cuándo empieza a contar la duración del programa?","a":"Desde la fecha de pago; debe distinguirse del momento en el que realmente comienza a prestarse el servicio a efectos de cancelaciones.","mean":"El vencimiento se calcula desde el pago, pero las reglas de reembolso dependen de si realmente hubo prestación. Guardar ambos hitos como datos independientes.","check":"Pagar programa sin actividad; confirmar fecha final y que sigue aplicando cancelación de programa no iniciado.","note":"","sec":"s02"},{"id":"21","kind":"q","pri":"P0","q":"¿El entrenador puede fijar el precio de sus servicios?","a":"Sí, indicando precios con los impuestos aplicables y las condiciones particulares de cada servicio antes de su contratación.","mean":"El Entrenador gestiona sus precios de venta con impuestos incluidos y condiciones claras. La plataforma calcula la comisión adicional del jugador sin alterar la oferta del Entrenador.","check":"Editar precio de servicio; comprobar precio en ficha, pantalla de pago y factura del vendedor.","note":"","sec":"s02"},{"id":"22","kind":"q","pri":"P1","q":"¿Qué tipos de packs pueden venderse?","a":"Combinaciones de servicios individuales; mostrar composición, vigencia, precio y condiciones particulares antes de pagar.","mean":"Pack agrupa servicios definidos, con cantidad, posible vigencia y reglas de uso. Mantener registro de unidades consumidas para aplicar cancelación total o parcial.","check":"Comprar pack, consumir un componente y comprobar saldo y política de devolución.","note":"","sec":"s02"},{"id":"23","kind":"q","pri":"P0","q":"¿La clase presencial se reserva automáticamente en un calendario externo?","a":"No. Solicitud del jugador, acuerdo por chat y registro manual de fecha/hora por el entrenador.","mean":"No existe reserva automática por huecos de calendario. El jugador solicita y se conversa la hora; el entrenador la registra manualmente.","check":"Crear solicitud sin fecha; acordar por chat y verificar que Entrenador puede asignar fecha y hora.","note":"","sec":"s02"},{"id":"24","kind":"q","pri":"P0","q":"¿Qué estados tendrá una clase presencial?","a":"Pendiente de acordar; programada; completada; cancelada.","mean":"Estados de la clase representan la prestación, no el dinero. No mezclar clase completada con factura emitida ni con cobro en efectivo.","check":"Recorrer pendiente→programada→completada y caso cancelado; verificar historial de estados.","note":"","sec":"s02"},{"id":"25","kind":"q","pri":"P0","q":"¿Qué estados de pago se necesitan para una clase?","a":"Pagado online; pago pendiente en efectivo; pagado en efectivo; incluido en pack.","mean":"Cada clase tiene un estado de pago separado del estado de la clase. En un pack no hay que volver a cobrar al consumir una clase.","check":"Registrar clase pagadera en efectivo, pagada online e incluida en pack; comprobar que no hay doble cargo.","note":"","sec":"s02"},{"id":"26","kind":"q","pri":"P0","q":"¿Puede el entrenador modificar objetivos y planes durante el programa?","a":"Sí. Es parte del seguimiento deportivo ordinario; modificaciones sustanciales del contrato requieren aceptación expresa del jugador.","mean":"Cambiar un ejercicio o meta es la operativa normal del seguimiento. Alterar precio, duración o prestaciones ya vendidas requiere aceptación del comprador.","check":"Editar objetivo sin pedir aceptación contractual; cambiar duración/precio y verificar que requiere aceptación.","note":"","sec":"s02"},{"id":"27","kind":"q","pri":"P0","q":"¿El entrenador puede ofrecer una política de cancelación más favorable?","a":"Sí. Gimadd fija garantías mínimas; la política del entrenador puede ampliar, nunca reducir, los derechos mínimos y legales.","mean":"Los entrenadores pueden mejorar plazos o devoluciones, pero no empeorar los mínimos de Gimadd ni los derechos indisponibles del consumidor.","check":"Introducir política más restrictiva que el mínimo y comprobar que no se aplica.","note":"","sec":"s02"},{"id":"28","kind":"q","pri":"P0","q":"¿Cómo vamos a cobrar los servicios por internet?","a":"Con Stripe Connect. La cuenta del Entrenador o academia debe estar verificada, cada pago debe ir a quien vende y ningún aviso repetido de Stripe debe duplicar una compra.","mean":"Un mismo pago no puede crear dos servicios, dos cobros ni dos facturas aunque Stripe mande dos veces el aviso.","check":"Probad un cobro correcto, uno fallido y dos avisos iguales. Solo debe registrarse una operación cuando corresponda.","note":"Comprobar que un aviso repetido de Stripe no duplique la compra y gestión de errores.","sec":"s03"},{"id":"29","kind":"q","pri":"P0","q":"¿Qué importes tiene que ver el Jugador antes de pagar?","a":"Precio final del servicio con sus impuestos, comisión de Gimadd con los impuestos aplicables y total a pagar.","mean":"Los importes mostrados antes del pago deben coincidir exactamente con lo cobrado y lo facturado.","check":"Probando distintos precios, sumad los importes y revisad el total cobrado y las facturas.","note":"","sec":"s03"},{"id":"30","kind":"q","pri":"P0","q":"¿Cuánto cobra Gimadd de comisión al Jugador?","a":"Normalmente el 5 % del precio del servicio, con un mínimo de 1,50 €. Las promociones y condiciones especiales se muestran antes de pagar.","mean":"La comisión de Gimadd se añade al servicio. Aplicad correctamente los impuestos según el caso.","check":"Comprobad una compra de 10 € y otra de 100 € y revisad que la comisión y el total sean correctos.","note":"","sec":"s03"},{"id":"31","kind":"q","pri":"P0","q":"¿Quién paga la comisión de Gimadd?","a":"La paga el Jugador, separada del precio del servicio. No se descuenta por defecto al Entrenador.","mean":"La comisión de Gimadd tendrá su propia factura y no figurará como si la hubiera pagado el Entrenador.","check":"Haced una compra y revisad las cantidades y las dos facturas.","note":"","sec":"s03"},{"id":"32","kind":"q","pri":"P0","q":"¿A nombre de quién se emite la factura del servicio deportivo?","a":"A nombre del Entrenador o academia que vende el servicio. Gimadd podrá prepararla en su nombre si existe el acuerdo necesario.","mean":"No poner a Gimadd como emisor de una clase o programa vendido por otra persona o empresa.","check":"Probad una compra a un Entrenador y otra a una academia. Revisad el nombre, datos fiscales, impuestos y numeración.","note":"","sec":"s03"},{"id":"33","kind":"q","pri":"P0","q":"¿Quién emite la factura de la comisión de Gimadd?","a":"Gimadd Fitness S.L. hace su propia factura al Jugador por la comisión.","mean":"En una compra por internet puede haber una factura por el servicio y otra diferente por la comisión de Gimadd.","check":"Comprobad que las dos facturas aparecen con titulares e importes correctos.","note":"","sec":"s03"},{"id":"34","kind":"q","pri":"P0","q":"¿A nombre de quién va la factura de la cuota mensual de Gimadd?","a":"Gimadd emite esa factura a quien paga la cuota: Entrenador o academia.","mean":"No confundir el titular de esta factura con el vendedor de una clase.","check":"Haced que una academia pague la cuota y un Entrenador venda una clase; revisad las facturas por separado.","note":"","sec":"s03"},{"id":"35","kind":"q","pri":"P0","q":"¿Gimadd factura las clases pagadas en efectivo?","a":"No. El Entrenador o academia recibe directamente ese dinero y se ocupa de la factura. Gimadd solo registra el estado del pago.","mean":"No cargar comisiones ni crear facturas de Gimadd por clases pagadas en efectivo.","check":"Marcando una clase como pagada en efectivo, comprobad que no hay cobro Stripe ni factura de Gimadd.","note":"","sec":"s03"},{"id":"36","kind":"q","pri":"P0","q":"¿Se cobra comisión Gimadd en clases presenciales pagadas en efectivo?","a":"No se cobra comisión de Gimadd por las clases pagadas fuera de la pasarela en efectivo.","mean":"El pago presencial en efectivo no lleva comisión de Gimadd. Un cambio de estado en el lista de Jugadores no puede activar cargos retrospectivos.","check":"Clase cash: coste en Gimadd por intermediación = 0; no se crea factura de comisión.","note":"","sec":"s03"},{"id":"37","kind":"q","pri":"P0","q":"¿Qué servicio permite pago en efectivo?","a":"Solo la clase presencial. Los demás productos del catálogo público de Entrenadores se pagan online cuando se contratan a través de Gimadd.","mean":"Solo las clases presenciales ofrecen opción efectivo. Programas, videoanálisis, packs y mensualidades se contratan online si pasan por Mentor.","check":"Revisar pantalla de pago de los cinco productos: botón efectivo únicamente en clase presencial.","note":"","sec":"s03"},{"id":"38","kind":"q","pri":"P0","q":"¿Qué pasa si el cobro funciona pero falla la factura?","a":"Gimadd debe registrar el problema y permitir solucionarlo sin volver a cobrar al Jugador.","mean":"El cobro y la factura se gestionan por separado. El error en la factura no debe duplicar dinero ni activar otra compra.","check":"Forzad un fallo al generar la factura después de un pago correcto. Verificad que solo hay un cargo y que la incidencia queda guardada.","note":"Prueba obligatoria: aviso automático de Stripe duplicado y fallo de factura.","sec":"s03"},{"id":"39","kind":"q","pri":"P0","q":"¿Cómo hacemos una devolución de dinero?","a":"Devolver lo que corresponda del servicio y de la comisión de Gimadd. Corregir las facturas cuando sea necesario.","mean":"Cada devolución debe estar relacionada con la compra original y sus facturas.","check":"Haced una devolución total y comprobad los importes recibidos y las facturas de corrección.","note":"","sec":"s03"},{"id":"40","kind":"q","pri":"P0","q":"¿Qué datos guardamos de cada compra?","a":"Guardar quién vende, qué Jugador compra, servicio, importes, impuestos, comisión Gimadd, pagos, facturas y devoluciones.","mean":"Al abrir una compra debe verse todo lo que ha ocurrido, sin mezclarla con otras.","check":"Comprad un servicio de prueba y comprobad que se puede seguir el pago, su comisión, las facturas y una eventual devolución.","note":"","sec":"s03"},{"id":"41","kind":"q","pri":"P0","q":"¿Qué sucede si el entrenador cancela un servicio sin causa justificada?","a":"Reembolso del 100 % del importe del servicio y del 100 % de la comisión Gimadd; salvo reprogramación expresamente aceptada por el jugador.","mean":"Si el vendedor cancela unilateralmente sin causa justificada, el jugador recupera servicio y comisión de Gimadd. Solo mantener la reserva si el jugador acepta un cambio equivalente.","check":"Entrenador cancela: devolución 100 % total; si jugador acepta fecha nueva, no duplicar devolución.","note":"","sec":"s04"},{"id":"42","kind":"q","pri":"P0","q":"¿Hasta cuándo puede cancelar gratuitamente el jugador una clase presencial?","a":"Hasta 24 horas antes de la fecha y hora acordadas: reembolso íntegro del precio del servicio y de la comisión Gimadd.","mean":"Se toma la fecha/hora finalmente acordada. Hasta 24 horas antes, el jugador tiene reembolso íntegro incluido comisión de Gimadd; cuidado con huso horario y nuevas fechas reprogramadas.","check":"Cancelar 25 horas antes y comprobar reintegro de ambos conceptos; verificar hora de corte.","note":"","sec":"s04"},{"id":"43","kind":"q","pri":"P0","q":"¿Qué ocurre con la cancelación de una clase dentro de las últimas 24 horas?","a":"Se aplicará la política particular del entrenador comunicada antes de contratar, siempre que sea legalmente válida.","mean":"Fuera de la ventana gratuita se aplica la política explícita del Entrenador que figuraba al contratar, siempre subordinada a las normas de consumidores.","check":"Cancelar 2 horas antes y comprobar que sistema consulta condiciones guardadas de la compra.","note":"","sec":"s04"},{"id":"44","kind":"q","pri":"P0","q":"¿Quién gestiona penalizaciones por no asistencia a una clase pagadera en efectivo?","a":"El entrenador directamente, solo si la penalización fue pactada previamente y es válida; Gimadd no la cobra ni la factura.","mean":"Gimadd no actúa como cobrador de sanciones de clases cash. Solo puede reflejar el estado de la reserva; el Entrenador gestiona directamente cualquier penalización válida.","check":"Marcar no-show en clase cash y verificar cero cargo y cero factura por penalización en Gimadd.","note":"","sec":"s04"},{"id":"45","kind":"q","pri":"P0","q":"¿Puede el jugador cancelar un programa si todavía no se ha prestado ningún servicio?","a":"Sí, reembolso íntegro del precio del programa y de la comisión de Gimadd, sin perjuicio de otras garantías legales.","mean":"Aunque ya haya empezado a correr el plazo desde el pago, si no se ha ejecutado ninguna prestación procede el reembolso integral acordado. Registrar actividad efectivamente prestada.","check":"Pagar un programa, no entregar análisis ni planes, cancelar: reintegro servicio y comisión de Gimadd.","note":"","sec":"s04"},{"id":"46","kind":"q","pri":"P0","q":"¿Qué ocurre si se cancela un programa ya iniciado?","a":"Aplicar la política previamente aceptada del entrenador y los mínimos de Gimadd, con respeto al desistimiento y demás derechos legales.","mean":"Con prestación ya iniciada, consultar las condiciones aceptadas por ese jugador, no una política modificada después. Mantener las excepciones legales de desistimiento.","check":"Editar política del Entrenador después de compra; cancelar y verificar aplicación de versión contractual original.","note":"","sec":"s04"},{"id":"47","kind":"q","pri":"P0","q":"¿Qué ocurre si se cancela un pack totalmente sin usar?","a":"Reembolso del 100 % del precio del pack y de la comisión Gimadd.","mean":"El pack totalmente sin usar tiene devolución total, tanto del vendedor como de Gimadd. Consumir cero elementos debe verificarse en sistema interno.","check":"Comprar pack sin uso, cancelar y obtener reembolso íntegro y rectificaciones.","note":"","sec":"s04"},{"id":"48","kind":"q","pri":"P0","q":"¿Qué ocurre con un pack usado parcialmente?","a":"Aplicar la política del entrenador aceptada antes de contratar, sin perjuicio de derechos legales.","mean":"Si se ha utilizado una parte, computar componentes ya prestados y aplicar las condiciones iniciales del entrenador respetando derechos legales.","check":"Consumir una clase de un pack y confirmar que no se trata como «pack intacto».","note":"","sec":"s04"},{"id":"49","kind":"q","pri":"P0","q":"¿Cuándo deja de ser cancelable gratis un videoanálisis ordinario?","a":"El jugador recibe reembolso íntegro mientras el entrenador no haya comenzado efectivamente el análisis; el inicio real debe quedar registrado y nunca eliminar derechos legales de desistimiento por sí solo.","mean":"El comienzo del análisis exige trabajo real del Entrenador, con marca temporal auditable. No vale iniciar ficticiamente para negar devolución; el desistimiento legal se trata aparte.","check":"Cancelar antes de iniciar y recuperar todo; iniciar con evento real y verificar política posterior.","note":"","sec":"s04"},{"id":"50","kind":"q","pri":"P0","q":"¿Cómo se informa del derecho de desistimiento en compras a distancia?","a":"Pantalla de pago con información legal adaptada al tipo de servicio y, cuando proceda, solicitud expresa para empezar antes de 14 días; no asumir pérdida automática del derecho por iniciar la actividad.","mean":"Antes de pagar mostrar desistimiento y reglas aplicables al servicio específico. Solicitar expresamente el comienzo anticipado cuando corresponda, sin checkbox genérico que suponga renuncia automática.","check":"Verificar pantalla de pago de clase, programa y videoanálisis y registro de solicitud de inicio anticipado.","note":"","sec":"s04"},{"id":"51","kind":"q","pri":"P0","q":"¿Qué pasa si falla la mensualidad del Jugador?","a":"Día 0: falla el cobro. Días 1 a 3: acceso y nuevos intentos. Días 4 a 6: servicio suspendido. Día 7: cancelación. Sin borrar el historial.","mean":"No confundir la mensualidad del Jugador con la cuota de Gimadd del Entrenador.","check":"Simulad una tarjeta fallida y avanzad los días de prueba. Comprobad los accesos y la cancelación.","note":"","sec":"s04"},{"id":"52","kind":"q","pri":"P0","q":"¿Qué pasa si el Entrenador no paga su cuota mensual de Gimadd?","a":"Primeros 7 días: acceso completo. Del día 8 al 30: solo funciones necesarias para terminar servicios ya vendidos. Después de 30 días, Gimadd puede iniciar la baja.","mean":"El Entrenador no podrá vender servicios nuevos desde el día 8, pero debe poder atender a los Jugadores con servicios pagados.","check":"Simulad el impago y comprobad accesos y bloqueo de nuevas ventas en cada periodo.","note":"","sec":"s04"},{"id":"53","kind":"q","pri":"P0","q":"¿Cómo cancela el Entrenador su cuota de Gimadd si no tiene servicios pendientes?","a":"Puede desactivar futuras renovaciones y usar Gimadd hasta que termine el periodo pagado, sin devolución automática por días restantes.","mean":"No debe quedar ningún nuevo cobro tras la baja.","check":"Cancelad una cuota sin servicios pendientes y comprobad el fin de acceso y la ausencia de otro cargo.","note":"","sec":"s04"},{"id":"54","kind":"q","pri":"P0","q":"¿Qué pasa si el Entrenador quiere cancelar Gimadd pero tiene servicios vendidos pendientes?","a":"Debe mantener su cuota hasta terminarlos, o cancelar esos servicios y devolver todo lo acordado al Jugador, incluso si hubo parte del servicio prestada.","mean":"No permitir dejar servicios pagados pendientes sin resolver. Los servicios externos no pagados en Gimadd no bloquean la baja.","check":"Probad una baja con un programa activo comprado en Gimadd y otra con un servicio externo. Deben comportarse de forma diferente.","note":"Servicios externos no pagados en Gimadd no bloquean la baja de la cuota de Gimadd.","sec":"s04"},{"id":"55","kind":"q","pri":"P0","q":"¿Qué pasa con las suscripciones del Jugador cuando el Entrenador cancela Gimadd?","a":"Gimadd detiene las próximas renovaciones y avisa al Jugador. Hay que prestar el periodo ya pagado o devolverlo íntegro si se interrumpe por decisión del Entrenador.","mean":"No se puede seguir cobrando mensualmente por un seguimiento que no se prestará.","check":"Cancelad la cuota de Gimadd de un Entrenador con suscripciones de Jugadores y comprobad los siguientes cobros.","note":"","sec":"s04"},{"id":"56","kind":"q","pri":"P0","q":"¿Qué puede hacer el Entrenador durante los 90 días después de su baja?","a":"Consultar su espacio sin modificarlo y reactivarlo dentro de los 90 días. Después se borra, salvo datos que deban guardarse por ley. No se elimina el historial propio del Jugador.","mean":"La cuenta pasa a solo lectura desde la baja efectiva, no desde que pide cancelarla.","check":"Simulad la fecha de baja, intentad editar información y después comprobad reactivación y eliminación según corresponda.","note":"","sec":"s04"},{"id":"57","kind":"q","pri":"P1","q":"¿Qué avisos habrá antes de borrar el espacio del entrenador?","a":"En fechas 0, 7, 30, 60, 83, 89 y 90 días, con canales legalmente permitidos y diferenciación de avisos operativos frente a marketing.","mean":"Los avisos de cuenta van por necesidad contractual y no dependen de consentimientos publicitarios. Programar cada día respecto a la baja efectiva, no respecto a la solicitud.","check":"Forzar cronograma de 0, 7, 30, 60, 83, 89 y 90 y verificar una sola notificación por evento.","note":"","sec":"s04"},{"id":"58","kind":"q","pri":"P0","q":"¿Qué pasa si Gimadd sube el precio de la cuota del Entrenador?","a":"Debe avisar con 30 días. Los servicios vendidos antes del aviso mantienen el precio anterior para ese Entrenador hasta que terminen. Los contratos nuevos no prolongan esa protección.","mean":"Guardar cuándo se avisó y qué servicios del Entrenador ya estaban comprometidos.","check":"Cread un servicio antes y otro después del aviso. Comprobad qué precio aplica en cada momento.","note":"","sec":"s04"},{"id":"59","kind":"q","pri":"P1","q":"¿Cuándo aparece un Jugador en la lista de Jugadores del Entrenador?","a":"Todo Jugador vinculado aparece en la lista, aunque no haya pagado dentro de Gimadd. Hay que distinguir servicios activos, externos y ausencia de servicio.","mean":"No confundir estar vinculado con haber comprado, ni actividad deportiva con pago.","check":"Vinculad un Jugador sin compra y comprobad que aparece, pero sin servicio pagado en Gimadd.","note":"","sec":"s05"},{"id":"60","kind":"q","pri":"P0","q":"¿Cómo se identifica un seguimiento contratado fuera de Gimadd?","a":"Como Servicio externo, distinto de un servicio comprado en la plataforma y sin cobro asociado en Gimadd.","mean":"La actividad externa permite seguimiento con la relación autorizada, pero no debe generar pedido, comisión ni facturas ficticias del catálogo público.","check":"Registrar servicio externo y comprobar seguimiento permitido sin cargo Stripe.","note":"","sec":"s05"},{"id":"61","kind":"q","pri":"P0","q":"¿Cómo se incorporan Jugadores al entrenador?","a":"Alta manual de contacto; enlace genérico o código de entrenador, con aceptación de vinculación antes de compartir datos deportivos.","mean":"Alta de contacto, link y código son mecanismos distintos. Ninguno debe revelar información de jugador registrado hasta aceptación expresa de la vinculación.","check":"Invitar contacto y abrir código: datos deportivos bloqueados antes de aceptar y visibles después según permisos.","note":"","sec":"s05"},{"id":"62","kind":"q","pri":"P0","q":"¿Puede un entrenador ver datos de una cuenta solo porque la añadió manualmente?","a":"No. El alta manual no da acceso a la cuenta ni a datos personales deportivos hasta aceptación de vínculo por el jugador.","mean":"Agregar un email o teléfono a la lista de Jugadores no autoriza a ver la cuenta de ese email, ni siquiera si ya tiene usuario Gimadd.","check":"Entrenador añade email existente: el panel no muestra sus vídeos ni historial sin aceptar vínculo.","note":"","sec":"s05"},{"id":"63","kind":"q","pri":"P0","q":"¿Se puede descargar toda la lista de Jugadores para enviar publicidad?","a":"No habrá herramientas para sacar todos los contactos ni enviar campañas comerciales desde esta lista.","mean":"La lista sirve para gestionar el entrenamiento y las comunicaciones individuales, no publicidad masiva.","check":"Revisad que no existan botones para descargar los contactos de todos los Jugadores o enviar publicidad en bloque.","note":"","sec":"s05"},{"id":"64","kind":"q","pri":"P0","q":"¿Quién decide qué datos de salud ve el entrenador?","a":"Solo el jugador incorpora lesiones, molestias o limitaciones y autoriza por separado el acceso de cada entrenador; revocación inmediata.","mean":"Lesiones y limitaciones son información sensible. Su edición corresponde al jugador, y cada Entrenador necesita permiso separado, revocable en el momento.","check":"Jugador autoriza Entrenador A no B; ambos ven exactamente lo permitido, y A deja de verlo al revocar.","note":"","sec":"s05"},{"id":"65","kind":"q","pri":"P0","q":"¿Qué ocurre con los vídeos cuando vence su plazo de conservación?","a":"Plazo general máximo 12 meses desde subida, con avisos 30, 7 y 1 días antes; resolver antes los casos necesarios para servicios aún activos.","mean":"El temporizador de almacenamiento empieza al subir cada vídeo, no al analizarlo. Avisar antes del vencimiento y resolver los vídeos necesarios para contratos activos.","check":"Subir vídeo con fecha ficticia; verificar avisos 30/7/1 y retención excepcional documentada.","note":"","sec":"s05"},{"id":"66","kind":"q","pri":"P0","q":"¿Cuál es el límite de almacenamiento de vídeo por jugador?","a":"10 GB por jugador (no por entrenador).","mean":"La cuota de vídeos se suma por titular jugador aunque use tres Entrenadores. Evitar asignar 10 GB a cada entrenador o a cada proyecto.","check":"Dos Entrenadores suben contenido del mismo jugador; un único contador de uso y bloqueo al superar cuota.","note":"No introducir mensajes comerciales sobre almacenamiento ampliable o compras futuras.","sec":"s05"},{"id":"67","kind":"q","pri":"P0","q":"¿Qué ocurre cuando un usuario borra un vídeo original?","a":"Eliminar el original y los clips de feedback asociados; mantener objetivos, planes y diario como registros independientes. Advertir si afecta a servicios pendientes.","mean":"La acción de borrar original también borra los clips derivados que dependen de él, pero no las metas, planes ni diarios. Advertir cuando hay videoanálisis sin completar.","check":"Eliminar vídeo con feedback y plan: original+clips desaparecen; objetivos y diario persisten.","note":"","sec":"s05"},{"id":"68","kind":"q","pri":"P1","q":"¿Qué piezas del videoanálisis puede descargar el jugador?","a":"Clips de feedback creados por el entrenador con comentarios, no el vídeo completo de devolución como descarga estándar; derechos RGPD de acceso/portabilidad aparte.","mean":"El UI ofrece descarga de cortes de feedback con comentarios del entrenador, no el vídeo largo completo como acción estándar. Los derechos de acceso RGPD se atienden por otro canal.","check":"Comprobar que descargar clip está disponible; no existe botón de descarga íntegra del análisis general.","note":"","sec":"s05"},{"id":"69","kind":"q","pri":"P0","q":"¿Puede Gimadd publicar un vídeo de un jugador para promocionarse?","a":"No por el hecho de haberlo subido o por haber permitido compartirlo; se requiere autorización específica apropiada de los afectados.","mean":"Una subida privada nunca equivale a autorización para marketing. Publicidad de Gimadd necesita autorización diferenciada y apropiada de cada afectado.","check":"Subir vídeo sin permiso de difusión: no aparece en redes/web públicas ni biblioteca promocional.","note":"","sec":"s05"},{"id":"70","kind":"q","pri":"P1","q":"¿Puede el jugador publicar clips del entrenador en redes?","a":"Solo si el entrenador habilita la opción general, desactivada por defecto, y se respetan derechos de imagen y terceros.","mean":"El Entrenador puede activar una preferencia general de compartir clips, desactivada inicialmente. Aun activa, la publicación debe respetar derechos de imagen de terceros.","check":"Entrenador sin habilitar: botón de compartir público restringido; habilitar y comprobar nuevo permiso.","note":"","sec":"s05"},{"id":"71","kind":"q","pri":"P0","q":"¿Qué consentimiento debe existir para terceros identificables en vídeos?","a":"La persona que graba o sube debe disponer de derechos/autorizaciones suficientes; no pedir una casilla nueva en cada subida, pero ofrecer aviso y canal de retirada.","mean":"El uploader declara disponer de permisos para grabaciones con terceros; se ofrece información y canal de denuncia/retirada. No poner nuevo consentimiento por cada subida.","check":"Subir vídeo: aviso persistente sin checkbox repetido; probar denuncia y ocultación/revisión.","note":"","sec":"s05"},{"id":"72","kind":"q","pri":"P0","q":"¿Qué ocurre al desactivar voluntariamente una cuenta de jugador?","a":"Previo cierre de servicios activos; ventana de reactivación de 90 días con avisos 0,30,60,83,89; respetar por separado el derecho RGPD de supresión sin demora indebida.","mean":"La desactivación ordinaria incluye 90 días para reactivar y avisos. Distinto del ejercicio de supresión RGPD, que no debe demorarse arbitrariamente. Resolver obligaciones pagadas antes de desactivar.","check":"Intentar baja con contrato activo: solicitar resolución; probar reactivación día 60 y solicitud RGPD separada.","note":"","sec":"s05"},{"id":"73","kind":"q","pri":"P0","q":"¿Qué opciones de publicidad aparecen en la cuenta del Jugador?","a":"Tres opciones separadas y apagadas al inicio: emails comerciales, publicidad al móvil y permiso para que Gimadd pregunte si puede usar públicamente vídeos. La tercera no autoriza publicarlos.","mean":"Activar una opción no puede activar las otras. Las notificaciones necesarias de seguridad o pagos se envían aparte.","check":"Cread una cuenta y comprobad las tres opciones apagadas. Encended solo una y revisad que las otras sigan apagadas.","note":"","sec":"s05"},{"id":"74","kind":"q","pri":"P0","q":"¿Qué autenticación se requiere por rol?","a":"Verificación en dos pasos obligatorio para administradores; opcional para entrenadores y jugadores; control de acceso y registro auditado para soporte.","mean":"La autenticación reforzada es obligatoria en backoffice admin. Para Entrenador y jugador será opcional; los permisos se validan en servidor.","check":"Administrador sin verificación en dos pasos no entra; Entrenador sin verificación en dos pasos sí, y puede configurarlo voluntariamente.","note":"","sec":"s05"},{"id":"75","kind":"q","pri":"P0","q":"¿Qué acceso tiene el equipo de soporte de Gimadd a contenidos privados?","a":"Solo ante causa legítima de soporte, seguridad o exigencia legal, con roles de mínimo privilegio y auditoría de accesos.","mean":"El soporte no debe poder curiosear vídeos o chats libremente. Todo acceso extraordinario se justifica, limita y registra con actor, fecha y motivo.","check":"Crear ticket y acceder con permiso; consultar registros de acceso; usuario soporte sin autorización recibe denegación.","note":"","sec":"s05"},{"id":"76","kind":"q","pri":"P1","q":"¿Qué conexión se permite con Google Calendar?","a":"Opcional y unidireccional desde Gimadd hacia el calendario conectado del entrenador; no leer eventos privados ajenos.","mean":"OAuth de entrenador solo autoriza escribir eventos de clases acordadas en calendario externo. No solicitar lectura de reuniones privadas ni sincronización bidireccional.","check":"Conectar Google Calendar, crear clase, ver evento exportado y comprobar permisos OAuth mínimos.","note":"","sec":"s05"},{"id":"77","kind":"q","pri":"P1","q":"¿Qué reseñas se podrán publicar y cómo se moderan?","a":"Solo reseñas de servicios pagados y completados dentro de la plataforma; publicación automática de opiniones positivas y negativas, con denuncia y revisión de contenidos indebidos.","mean":"Solo compras confirmadas y servicios completados generan posibilidad de reseña verificada. No filtrar opiniones negativas automáticamente; denuncia para contenido ilícito o abusivo.","check":"Crear reseña de servicio completado y negativa válida; ambas visibles; cuenta sin compra no opina.","note":"","sec":"s05"},{"id":"78","kind":"q","pri":"P0","q":"¿Cuándo se pueden cargar cookies no esenciales?","a":"Solo tras consentimiento válido; banner con aceptar/rechazar/configurar equivalentes y revocación fácil; inventario exacto de cookies según instalaciones reales.","mean":"El gestor de cookies debe bloquear analítica y píxeles antes de optar voluntariamente. Aceptar/rechazar/configurar son opciones accesibles y equivalentes; listar cookies reales tras instalación.","check":"Abrir sesión nueva y comprobar tráfico sin consentimiento; rechazar, aceptar y revocar.","note":"","sec":"s05"},{"id":"79","kind":"q","pri":"P0","q":"¿Qué ocurre si el Jugador borra el vídeo necesario para un análisis pendiente?","a":"El Entrenador puede pedirle una nueva grabación. No se genera automáticamente un reembolso por esa eliminación.","mean":"Antes de borrar, Gimadd advierte de que puede afectar al análisis pendiente. Registrar si el Entrenador solicita otro vídeo.","check":"Borrad un vídeo con análisis pendiente y comprobad aviso, eliminación y posibilidad de solicitar otro vídeo.","note":"Advertencia antes de borrar y registro de petición de sustitución.","sec":"s06"},{"id":"80","kind":"q","pri":"P0","q":"¿Durante cuánto tiempo se conservarán los mensajes privados?","a":"Mientras las cuentas estén activas, respetando los derechos de supresión y las obligaciones legales de conservación.","mean":"El chat sirve para coordinación y prueba de acuerdos. Conservar mientras cuentas activas y exista base legítima; las solicitudes legales se gestionan con canal específico.","check":"Mantener conversación meses después; tramitar supresión y preservar exclusivamente lo legalmente necesario.","note":"","sec":"s06"},{"id":"81","kind":"q","pri":"P0","q":"¿Podrán los usuarios eliminar mensajes o conversaciones desde el chat?","a":"No. No habrá eliminación manual desde el chat; se aplicarán los derechos legales de supresión.","mean":"No hay «borrar para mí» ni «borrar para ambos» en la interfaz. Esto no anula la gestión administrativa de derechos de supresión.","check":"Inspeccionar chat en móvil y web: no existe función borrar; solicitud RGPD sí tiene procedimiento.","note":"","sec":"s06"},{"id":"82","kind":"q","pri":"P0","q":"¿Cómo se gestionarán las infracciones de las condiciones de uso?","a":"Medidas proporcionales: advertencia, restricción, suspensión o cierre según gravedad, con actuación inmediata ante riesgos graves.","mean":"Las sanciones son graduadas según el caso: advertencia, restricción, suspensión y cierre; el equipo puede actuar urgente frente a riesgos graves.","check":"Simular aviso leve y bloqueo grave; validar que servicio comprado se resuelve y se documenta decisión.","note":"","sec":"s06"},{"id":"83","kind":"q","pri":"P1","q":"¿Cómo se revisarán las suspensiones y restricciones de cuenta?","a":"Mediante soporte por email o centro de ayuda, con revisión individual y respuesta motivada.","mean":"No se requiere módulo de apelaciones dentro de la aplicación; sí dirección/email de soporte, expediente y respuesta motivada.","check":"Cuenta suspendida puede enviar reclamación; soporte registra revisión y comunica decisión.","note":"","sec":"s06"},{"id":"84","kind":"q","pri":"P0","q":"¿Qué datos puede añadir manualmente el Entrenador sobre un Jugador externo?","a":"Datos básicos de contacto. Para acceder al seguimiento deportivo se necesita que el Jugador acepte la vinculación.","mean":"Escribir nombre, teléfono o email no da acceso a vídeos, objetivos, lesiones ni otros datos deportivos del Jugador.","check":"Dad de alta un contacto sin vincular y comprobad que su seguimiento no es accesible.","note":"","sec":"s06"},{"id":"85","kind":"q","pri":"P1","q":"¿Puede el Entrenador invitar a un Jugador a vincularse?","a":"Sí, con invitación individual por email o enlace compartible; no se usarán para campañas publicitarias.","mean":"El Jugador tiene que aceptar el vínculo antes de compartir datos. Evitar invitaciones repetitivas o masivas.","check":"Enviad una invitación individual y comprobad que el Jugador puede aceptarla y que no existe envío masivo.","note":"","sec":"s06"},{"id":"86","kind":"q","pri":"P0","q":"¿Qué pasa con el chat cuando un Jugador se desvincula de un Entrenador?","a":"Se cierra para mensajes nuevos, pero ambos conservan el historial anterior mientras corresponda.","mean":"Ninguno puede escribir nuevos mensajes sin volver a vincularse. No borrar el historial automáticamente.","check":"Desvinculadlos y comprobad que se puede leer el chat antiguo, pero no enviar mensajes nuevos.","note":"","sec":"s06"},{"id":"87","kind":"q","pri":"P0","q":"¿Puede el jugador estar vinculado a varios entrenadores simultáneamente?","a":"Sí, sin límite contractual fijo y manteniendo separados los datos y contenidos de cada relación.","mean":"Un jugador puede trabajar con varios Entrenadores; cada relación tiene permisos y recursos separados. El aislamiento se exige también en consultas sistema interno.","check":"Jugador vinculado a A y B: A intenta abrir ID de vídeo de B y recibe acceso denegado.","note":"","sec":"s06"},{"id":"88","kind":"q","pri":"P0","q":"¿Qué perfil general verá el entrenador vinculado?","a":"Nombre, fotografía, nivel de juego y datos deportivos generales. Nunca los contenidos privados de otros entrenadores.","mean":"El Entrenador ve la ficha general mínima de jugador vinculado, pero no un resumen global de los trabajos de otros entrenadores, ni salud sin autorización.","check":"Entrenador A ve nombre/foto/nivel, no planes de B ni lesión privada; tras desvincular desaparece acceso.","note":"","sec":"s06"},{"id":"89","kind":"q","pri":"P0","q":"¿Habrá servicios para dos Jugadores en pareja?","a":"No. Se han quitado del MVP.","mean":"No deben existir ofertas, precios, formularios ni compras para parejas.","check":"Revisad todos los servicios y la pantalla de pago para confirmar que no aparece pareja.","note":"","sec":"s06"},{"id":"90","kind":"q","pri":"P0","q":"¿Qué cinco tipos de servicios estarán en el MVP?","a":"Programas 3/6/12 meses, videoanálisis, clases presenciales, packs y suscripciones mensuales de Jugadores, todos individuales.","mean":"Distinguir la suscripción mensual del Jugador de la cuota mensual del Entrenador por usar Gimadd.","check":"Comprobad que se pueden crear los cinco servicios individuales.","note":"","sec":"s06"},{"id":"91","kind":"q","pri":"P0","q":"¿Cómo se cambia el precio de una suscripción mensual del Jugador?","a":"Avisar al Jugador al menos 30 días antes y pedir su aceptación expresa antes de cobrar el nuevo precio.","mean":"Si no acepta, no se puede cobrar el importe nuevo.","check":"Subid un precio en una suscripción de prueba y comprobad que sin aceptación no hay nuevo cargo.","note":"","sec":"s06"},{"id":"92","kind":"q","pri":"P0","q":"¿Puede el Entrenador dejar de vender una suscripción mensual?","a":"Puede retirarla para nuevos Jugadores de inmediato, pero debe avisar a los actuales con 30 días y cumplir los periodos que ya han pagado.","mean":"No cortar servicios pagados ni dejar futuras renovaciones activas después de la retirada efectiva.","check":"Retirad una suscripción con Jugadores activos y comprobad avisos, último periodo pagado y ausencia de nuevos cobros.","note":"","sec":"s06"},{"id":"93","kind":"q","pri":"P0","q":"¿Qué pasa cuando termina un programa de 3, 6 o 12 meses?","a":"El programa termina automáticamente. Para continuar, el Jugador hace una compra y un pago nuevos. No se renueva solo.","mean":"El vencimiento no crea otro cargo ni otra factura. El historial deportivo sigue guardado según las reglas correspondientes.","check":"Dejad vencer un programa de prueba. No debe cobrarse nada. Luego comprad uno nuevo y comprobad el nuevo pago.","note":"","sec":"s06"},{"id":"94","kind":"q","pri":"P0","q":"¿Puede el Entrenador cambiar un programa mientras está activo?","a":"Puede cambiar objetivos y planes deportivos, pero para modificar de forma importante precio, duración o servicios incluidos necesita la aceptación del Jugador.","mean":"Un cambio en el entrenamiento no requiere una nueva compra. Un cambio en lo contratado exige confirmación.","check":"Editad un objetivo y luego intentad cambiar el precio. Solo el segundo caso debe pedir aceptación.","note":"","sec":"s06"},{"id":"95","kind":"q","pri":"P1","q":"¿Puede el Jugador pausar un programa por lesión u otra causa?","a":"Sí, si lo acuerda con el Entrenador. No hay una pausa automática.","mean":"El cambio de fechas debe acordarse y quedar registrado. Respetar siempre lo contratado.","check":"Probad una petición de pausa aceptada y otra no aceptada. Solo debe cambiar la fecha en la aceptada.","note":"","sec":"s06"},{"id":"96","kind":"q","pri":"P0","q":"¿Cómo se registra una pausa de programa?","a":"El Jugador y el Entrenador la acuerdan por chat. El Entrenador propone la nueva fecha de finalización y el Jugador la confirma expresamente.","mean":"Sin confirmación del Jugador, la fecha original no cambia.","check":"Proponed una nueva fecha y comprobad que no se aplica hasta que el Jugador la acepte.","note":"","sec":"s06"},{"id":"97","kind":"q","pri":"P0","q":"¿Qué pasa si el Jugador cancela una suscripción mensual a mitad de mes?","a":"No habrá devolución automática por los días restantes. Se impide el siguiente cobro y el Jugador mantiene el seguimiento hasta el fin del periodo pagado, salvo excepciones legales.","mean":"Cancelar una mensualidad no borra el historial ni deja al Jugador sin el periodo pagado.","check":"Cancelad a mitad de mes y comprobad que sigue el acceso hasta el vencimiento, sin nuevo cargo.","note":"","sec":"s06"},{"id":"98","kind":"q","pri":"P0","q":"¿Hay que avisar antes de cada renovación mensual del Jugador?","a":"El precio y la renovación automática deben aparecer claramente en la compra. No habrá recordatorios adicionales salvo los exigidos legalmente.","mean":"El Jugador debe saber qué pagará cada mes y poder cancelar desde su cuenta.","check":"Revisad la pantalla de pago y la cancelación. No añadáis avisos opcionales no acordados.","note":"","sec":"s06"},{"id":"99","kind":"q","pri":"P0","q":"¿Cómo se cambia la fecha de una clase presencial?","a":"Entrenador y Jugador lo acuerdan por chat. El Entrenador actualiza la fecha y hora sin una segunda confirmación en la aplicación.","mean":"Guardar la fecha acordada y el cambio. No exigir al Jugador otro botón de confirmación, a diferencia de las pausas de programas.","check":"Cambiad una clase por chat, actualizadla como Entrenador y comprobad que se informa al Jugador y queda registrada.","note":"La conversación debe acreditar el acuerdo.","sec":"s06"},{"id":"A01","kind":"a","pri":"P0","q":"Facturación — prioridad absoluta","a":"En cada pago online comprobar tres sujetos distintos cuando proceda: vendedor del servicio, comprador del servicio y contratante de la cuota mensual de Gimadd. El NIF y razón social del emisor del servicio deben ser los del vendedor; la factura de comisión, Gimadd; la de la cuota mensual de Gimadd, Gimadd al suscriptor.","mean":"","check":"En una compra real de pruebas, identifique expresamente los tres sujetos y genere los documentos a cada NIF correcto.","note":"","sec":"notes"},{"id":"A02","kind":"a","pri":"P0","q":"Factura por cuenta de terceros","a":"La generación de documentos del servicio se hará en nombre y por cuenta del entrenador/academia, con acuerdo de facturación y controles fiscales. No convertir a Gimadd por error en proveedor del entrenamiento.","mean":"","check":"Pruebe facturación a nombre de autónomo y academia, con series, impuestos y acuerdo de facturación por tercero.","note":"","sec":"notes"},{"id":"A03","kind":"a","pri":"P0","q":"Desglose en pantalla de pago","a":"En pantalla antes de pagar: precio del entrenador con impuestos, comisión Gimadd con su impuesto aplicable, total. En factura, aplicar tratamiento fiscal correcto al territorio y operación (sin tipo impositivo fijo asumido).","mean":"","check":"Compruebe que precio, comisión de Gimadd, impuestos, total de Stripe y facturas cuadran al céntimo en varios importes.","note":"","sec":"notes"},{"id":"A04","kind":"a","pri":"P0","q":"Pago efectivo","a":"Solo clases presenciales: sin Stripe, sin comisión Gimadd, sin factura Gimadd de clase; estados claros de pendiente/pagado. El entrenador puede registrar el pago y es responsable de facturar por su cuenta.","mean":"","check":"Marque una clase como pagada en efectivo y compruebe que no hay pago Stripe ni factura/comisión de Gimadd.","note":"","sec":"notes"},{"id":"A05","kind":"a","pri":"P0","q":"Refund / abonos","a":"Casos de prueba separados: clase cancelada 25 horas antes; cancelada 2 horas antes; cancelación por Entrenador; pack no usado; programa no iniciado; videoanálisis sin empezar; suscripción ya renovada; cobro fallido. Cada abono debe conciliar ambos componentes (servicio + comisión) y los documentos rectificativos.","mean":"","check":"Ejecute y documente cada supuesto de reembolso con pago prueba y el correspondiente documento rectificativo.","note":"","sec":"notes"},{"id":"A06","kind":"a","pri":"P0","q":"Suscripciones diferentes","a":"No confundir cuota mensual para utilizar Gimadd del entrenador, suscripción mensual del jugador y programa prepago 3/6/12 meses. Tienen métodos de renovación, impago y cancelación distintos.","mean":"","check":"Compruebe tres planes diferentes: cuota mensual para utilizar Gimadd Entrenador, mensualidad jugador y programa prepago; cada uno con vida útil propia.","note":"","sec":"notes"},{"id":"A07","kind":"a","pri":"P0","q":"Stripe Connect","a":"Verificar comprobación de identidad, vendedor efectivo, Stripe account ID, reparto, reversos, devoluciones, reclamaciones de devolución al banco, nuevos intentos, eventos duplicados y conciliación contra documentos.","mean":"","check":"Reenvíe avisos automáticos de Stripe y fuerce cancelaciones/reclamaciones de devolución al banco en Stripe prueba; compruebe que no hay dobles cargos.","note":"","sec":"notes"},{"id":"A08","kind":"a","pri":"P0","q":"Cuenta entrenador: baja y retención","a":"90 días solo lectura desde baja efectiva con avisos. Servicio activo comprado online bloquea borrado directo; servicio externo no bloquea cancelación cuota mensual para utilizar Gimadd.","mean":"","check":"Simule baja efectiva de la cuota mensual de Gimadd, lectura durante 90 días y conservación de datos de jugadores.","note":"","sec":"notes"},{"id":"A09","kind":"a","pri":"P0","q":"Diseño del consentimiento","a":"Marketing: email/aviso al móvil/permiso para solicitar uso público de vídeos en tres toggles desligados del alta; nada marcado por defecto. Último toggle no equivale a autorización de uso.","mean":"","check":"Registre nueva cuenta: tres preferencias apagadas. Active una y verifique que no activa las restantes.","note":"","sec":"notes"},{"id":"A10","kind":"a","pri":"P0","q":"Vídeos","a":"10 GB por jugador, 12 meses desde subida, avisos 30/7/1; eliminación original elimina clips de feedback vinculados, no objetivos ni diario; advertir si hay videoanálisis pendiente.","mean":"","check":"Suba vídeos de prueba, mida uso agregado por jugador, simule avisos y compruebe borrado de derivados.","note":"","sec":"notes"},{"id":"A11","kind":"a","pri":"P0","q":"Datos de lesiones","a":"Solo el jugador edita información de salud; permisos separados por entrenador, revocación inmediata y tratamiento sensible con consentimiento explícito cuando corresponda.","mean":"","check":"Revise sistema interno de datos de salud con dos entrenadores y revocación del permiso en tiempo real.","note":"","sec":"notes"}, obal de pantallas, textos y rutas sistema interno antiguas; no ofrecer funcionalidades excluidas.","note":"","sec":"notes"},{"id":"A17","kind":"a","pri":"P0","q":"Copy legal y consentimientos","a":"Registrar versión de términos, política comercial, idioma, fecha/hora y actor. pantalla de pago debe distinguir cancelación contractual de desistimiento legal.","mean":"","check":"Abra un pedido antiguo y recupere exactamente precio, versión contractual, política y consentimiento asociados.","note":"","sec":"notes"},{"id":"A18","kind":"a","pri":"P0","q":"No mezclar confirmaciones","a":"Pausa de programa: nuevo vencimiento necesita botón de aceptación del jugador. Reprogramar clase: Entrenador cambia fecha/hora tras acuerdo en chat, SIN segundo botón.","mean":"","check":"Prueba comparativa: pausa requiere confirmación del jugador; cambio de clase no exige segundo botón.","note":"","sec":"notes"},{"id":"A19","kind":"a","pri":"P0","q":"Cómo se marca cada fila","a":"Cada decisión se marca sin implementar, en proceso o implementado. El estado lo ven Miguel Ángel, Radu y el equipo en cuanto se guarda.","mean":"","check":"Al marcar implementado, dejad una nota del equipo con enlace a prueba, captura o registro de ejecución.","note":"","sec":"notes"},{"id":"F01","kind":"f","pri":"P0","q":"Compra online entrenador autónomo","a":"Servicio a nombre del autónomo, comisión facturada por Gimadd, importes e impuestos correctos.","mean":"","check":"Servicio a nombre del autónomo, comisión facturada por Gimadd, importes e impuestos correctos.","note":"","sec":"tests"},{"id":"F02","kind":"f","pri":"P0","q":"Compra online academia","a":"Factura de servicio a nombre de academia aunque la sesión la imparta un Entrenador individual.","mean":"","check":"Factura de servicio a nombre de academia aunque la sesión la imparta un Entrenador individual.","note":"","sec":"tests"},{"id":"F03","kind":"f","pri":"P0","q":"Cuota de Gimadd contratada por una academia","a":"Factura mensual de la cuota de Gima
