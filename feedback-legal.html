<style>
  :root{
    --bg:#f4f7fb; --surface:#fff; --surface-soft:#f1f5f9; --border:#d9e3ee;
    --ink:#0f172a; --ink-soft:#475569; --ink-faint:#7c8b99;
    --primary:#0369a1; --primary-dark:#0c4a6e; --primary-soft:#e0f2fe;
    --accent:#f2ec1f; --accent-ink:#121212;
    --danger:#c93f3f; --danger-soft:#fbe6e6;
    --warn:#c98a1f; --warn-soft:#faefdb;
    --ok:#15803d; --ok-soft:#e3f2e8;
    --todo:#64748b; --todo-soft:#eef2f6;
    --wip:#b45309; --wip-soft:#fff4e5;
    --shadow: 0 1px 2px rgba(15,30,55,.06), 0 6px 20px -8px rgba(15,30,55,.18);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --surface:#132033; --surface-soft:#18263c; --border:#2a3c55;
      --ink:#e8eef6; --ink-soft:#b4c2d4; --ink-faint:#7f91a8;
      --primary:#38bdf8; --primary-dark:#0ea5e9; --primary-soft:#0c2a3d;
      --accent:#f2ec1f; --accent-ink:#121212;
      --danger:#e57373; --danger-soft:#3a1f22;
      --warn:#e3b563; --warn-soft:#3a2f18;
      --ok:#7fca97; --ok-soft:#1c3324;
      --todo:#94a3b8; --todo-soft:#1a2738;
      --wip:#f0b56a; --wip-soft:#3a2d18;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"DM Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Barlow Semi Condensed","DM Sans",sans-serif;font-weight:700;letter-spacing:.01em;margin:0;}
  a{color:inherit;}
  button,input,select{font-family:inherit;}
  [hidden]{display:none!important;}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px;}
  .topbar{
    display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;
    padding-bottom:18px;margin-bottom:16px;border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(155deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand-text h1{font-size:22px;line-height:1.1;}
  .brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--ink-faint);}
  .home-link{font-size:12px;color:var(--primary);font-weight:600;text-decoration:none;margin-right:10px;}
  .home-link:hover{text-decoration:underline;}
  .top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .reporter{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .reporter input{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:6px 9px;font-size:13px;width:150px;
  }
  .reporter input:focus,.toolbar select:focus,.toolbar input:focus,.note-input:focus{
    outline:2px solid var(--primary);outline-offset:1px;
  }
  .lang-toggle{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface);}
  .lang-toggle button{border:none;background:transparent;color:var(--ink-soft);padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .lang-toggle button.active{background:var(--accent);color:var(--accent-ink);}
  .banner{
    display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);
    border:1px solid var(--warn);border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:14px;
  }
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{
    flex:1 1 110px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow);
  }
  .stat b{display:block;font-family:"Barlow Semi Condensed";font-size:26px;font-variant-numeric:tabular-nums;line-height:1;}
  .stat span{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .stat.todo b{color:var(--todo);}
  .stat.wip b{color:var(--wip);}
  .stat.done b{color:var(--ok);}
  .stat.p0 b{color:var(--danger);}
  .progress{height:8px;background:var(--surface-soft);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin:0 0 14px;display:flex;}
  .progress i{display:block;height:100%;}
  .progress .p-done{background:var(--ok);}
  .progress .p-wip{background:var(--wip);}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;position:sticky;top:0;z-index:8;background:var(--bg);padding:8px 0;}
  .toolbar select,.toolbar input[type="search"]{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:9px;padding:8px 10px;font-size:13px;
  }
  .toolbar input[type="search"]{min-width:180px;flex:1 1 180px;}
  .pills{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .pill.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-soft);border-radius:9px;
    padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .sec{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;
  }
  .sec > summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:14px 16px;font-family:"Barlow Semi Condensed",sans-serif;font-size:17px;font-weight:700;
  }
  .sec > summary::-webkit-details-marker{display:none;}
  .sec > summary:hover{background:var(--surface-soft);}
  .sec-mark{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;}
  .sec-counts{margin-left:auto;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;color:var(--ink-faint);background:var(--surface-soft);border:1px solid var(--border);border-radius:20px;padding:2px 9px;}
  .rows{border-top:1px solid var(--border);}
  .row{
    display:grid;grid-template-columns:auto 1fr;gap:6px 12px;
    padding:12px 14px;border-bottom:1px solid var(--border);align-items:start;
  }
  .row:last-child{border-bottom:none;}
  .row.st-done{background:color-mix(in srgb, var(--ok-soft) 45%, transparent);}
  .row.st-wip{background:color-mix(in srgb, var(--wip-soft) 50%, transparent);}
  .row-head{display:flex;gap:8px;align-items:flex-start;}
  .row-id{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;font-weight:500;
    color:var(--primary);min-width:36px;padding-top:2px;
  }
  .q{
    margin:0;font-size:14.5px;font-weight:600;line-height:1.35;cursor:pointer;
  }
  .q:hover{color:var(--primary);}
  .preview{
    margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--ink-soft);cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .row.open .preview{display:none;}
  .open-hint{font-size:11.5px;font-weight:600;color:var(--primary);margin-top:5px;cursor:pointer;}
  .row.open .open-hint{display:none;}
  .hint{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;font-size:13px;line-height:1.55;color:var(--ink-soft);
    margin-bottom:14px;box-shadow:var(--shadow);
  }
  .hint b{color:var(--ink);}
  .box.mean{background:var(--primary-soft);border-color:color-mix(in srgb, var(--primary) 35%, var(--border));}
  .box.check{background:var(--ok-soft);border-color:color-mix(in srgb, var(--ok) 35%, var(--border));}
  .box.dev{background:var(--warn-soft);border-color:color-mix(in srgb, var(--warn) 35%, var(--border));}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 0;}
  .chip{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:2px 7px;border-radius:20px;white-space:nowrap;
  }
  .chip-p0{background:var(--danger-soft);color:var(--danger);}
  .chip-p1{background:var(--todo-soft);color:var(--todo);}
  .extra{grid-column:1 / -1;display:none;padding:4px 0 2px 36px;}
  .row.open .extra{display:block;}
  .extra .box{
    background:var(--surface-soft);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;
  }
  .extra .box label,.note-wrap label{
    display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-faint);margin-bottom:4px;
  }
  .extra p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-soft);white-space:pre-wrap;}
  .st-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;grid-column:1 / -1;}
  .st-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:20px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .st-btn[data-s="todo"].active{background:var(--todo-soft);border-color:var(--todo);color:var(--todo);}
  .st-btn[data-s="wip"].active{background:var(--wip-soft);border-color:var(--wip);color:var(--wip);}
  .st-btn[data-s="done"].active{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
  .who{font-size:11.5px;color:var(--ink-faint);margin-left:4px;}
  .note-input{
    width:100%;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:9px;padding:8px 10px;font-size:13px;
  }
  .empty{text-align:center;color:var(--ink-faint);padding:28px 12px;font-size:14px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:20px;font-size:13px;box-shadow:var(--shadow);z-index:80;
  }
  .footnote{margin-top:22px;font-size:11.5px;color:var(--ink-faint);text-align:center;}
  @media (min-width:720px){
    .row{grid-template-columns:auto 1fr auto;align-items:start;}
    .st-row{grid-column:auto;margin-top:0;justify-content:flex-end;max-width:360px;padding-top:2px;}
    .extra{grid-column:2 / -1;padding-left:0;}
  }
</style>
</head>

comprobar devolución de servicio y fee, factura rectificativa y saldo conciliado.","note":"","sec":"pay"},{"id":"01","kind":"q","pri":"P0","q":"¿A qué productos se aplicará esta documentación?","a":"Solo Gimadd Mentor: web, marketplace y aplicación para entrenadores y jugadores. No se aplica a la tienda de Gimadd Support.","mean":"El alcance legal y funcional corresponde exclusivamente al ecosistema Gimadd Mentor, no al ecommerce del soporte físico. Evitad reutilizar en Mentor banners, condiciones o flujos contractuales de Gimadd Support.","check":"Entrar en web, marketplace y app: los textos y enlaces remiten a Mentor y no mezclan la tienda física.","note":"","sec":"s01"},{"id":"02","kind":"q","pri":"P0","q":"¿Quién podrá registrarse como entrenador?","a":"Solo personas mayores de 18 años.","mean":"El rol entrenador permite crear servicios, gestionar alumnos y cobrar. No puede activarse por una persona que declare ser menor de edad.","check":"Intentar registrar un coach menor de 18 años y confirmar que no se activa el rol.","note":"","sec":"s01"},{"id":"03","kind":"q","pri":"P0","q":"¿Podrán usar la plataforma los jugadores menores de edad?","a":"Sí, con autorización verificable del padre, madre o representante legal, especialmente para contratar servicios de pago.","mean":"Los menores pueden ser jugadores, pero su uso y especialmente la contratación requieren un representante legal autorizado. El consentimiento del adulto no debe asumirse al escribir su email.","check":"Crear cuenta de menor: no puede contratar antes de completar autorización; tras autorizar se habilitan las funciones permitidas.","note":"Registrar el consentimiento y el adulto autorizante; no pedir documentos de identidad por defecto.","sec":"s01"},{"id":"04","kind":"q","pri":"P0","q":"¿Cómo se autorizará la cuenta de un menor?","a":"Mediante un flujo de autorización por correo electrónico del representante legal, con aceptación registrada y enlace verificable.","mean":"El adulto recibe un enlace verificable, ve qué autoriza y confirma. Guardar quién autorizó, cuándo, desde qué proceso y qué textos aceptó; enlaces caducados o reutilizados no deben funcionar.","check":"Probar enlace válido, caducado y revocado; revisar registro auditable de la autorización.","note":"El menor no debe acceder a contratación sin autorización válida.","sec":"s01"},{"id":"05","kind":"q","pri":"P0","q":"¿Qué ocurrirá si el representante legal revoca la autorización?","a":"El representante podrá revocarla mediante un enlace seguro y verificado; se limitará la cuenta del menor conforme a la ley y contratos pendientes.","mean":"Debe existir un mecanismo seguro para que el responsable legal retire su autorización. La plataforma bloqueará lo que proceda y resolverá servicios ya contratados sin borrar pruebas necesarias.","check":"Revocar desde el enlace autenticado y comprobar que cambian los permisos del menor y que se registra el evento.","note":"","sec":"s01"},{"id":"06","kind":"q","pri":"P0","q":"¿Qué ocurre cuando un jugador menor cumple 18 años?","a":"Deberá aceptar personalmente las condiciones vigentes y confirmar sus datos; se conservará su historial conforme a los plazos aplicables.","mean":"Al llegar a 18 años el usuario pasa a consentir por sí mismo. La transición no debe crear una cuenta nueva ni borrar su progreso deportivo.","check":"Simular cumpleaños 18: solicitar aceptación propia y mantener historial y compras correspondientes.","note":"","sec":"s01"},{"id":"07","kind":"q","pri":"P0","q":"¿Qué usuarios pueden contratar la suscripción SaaS?","a":"Entrenadores individuales y academias o sociedades, con un espacio de trabajo individual por entrenador en el MVP.","mean":"Distinguir el titular de la factura SaaS del usuario entrenador que opera el espacio; una academia puede pagar el SaaS, sin disponer por ello de un CRM multiusuario en MVP.","check":"Dar de alta SaaS pagado por sociedad y comprobar un único workspace de coach y factura a la sociedad.","note":"","sec":"s01"},{"id":"08","kind":"q","pri":"P0","q":"¿Qué se exige para vender servicios en el marketplace?","a":"Mayoría de edad, declaración de actividad profesional y obligaciones fiscales, y verificación de identidad y datos requeridos mediante Stripe Connect; Gimadd podrá pedir información adicional.","mean":"Poder usar CRM no equivale a estar habilitado para vender al público. Exigir declaración profesional y completar onboarding KYC antes de publicar ofertas cobrables.","check":"Entrenador sin KYC puede usar lo permitido pero no vender; al completar KYC se habilita su actividad comercial.","note":"","sec":"s01"},{"id":"09","kind":"q","pri":"P0","q":"¿Quién presta contractualmente el servicio deportivo al jugador?","a":"El entrenador profesional o la academia identificada como vendedor. Gimadd facilita la plataforma y los pagos, pero no presta directamente el servicio de entrenamiento.","mean":"El contrato deportivo se firma entre jugador y profesional/academia. Gimadd intermedia y presta tecnología, no debe figurar como prestador de una clase en pantallas o facturas.","check":"Comprar un servicio y confirmar que el prestador identificado antes y después del pago es el vendedor real.","note":"","sec":"s01"},{"id":"10","kind":"q","pri":"P0","q":"¿Puede figurar una academia como prestadora y titular del cobro?","a":"Sí. El vendedor del servicio, beneficiario del cobro y emisor legal de la factura deben coincidir, ya sea entrenador autónomo o academia/sociedad.","mean":"Una academia puede vender un servicio realizado por su entrenador. El vendedor fiscal, cuenta receptora de Stripe y emisor legal de la factura del servicio deben estar alineados.","check":"Test: academia propietaria de la oferta; revisar cuenta conectada e identidad fiscal de la factura.","note":"","sec":"s01"},{"id":"11","kind":"q","pri":"P0","q":"¿Puede ser distinto el comprador del SaaS respecto al vendedor de clases?","a":"Sí. La suscripción SaaS la paga quien contrata el SaaS; cada servicio al jugador debe registrar su vendedor real, independiente del titular de la suscripción SaaS.","mean":"El titular del SaaS puede ser distinto del profesional que presta un servicio particular. Mantener campos separados: SaaS customer, seller y jugador buyer.","check":"Crear compra con academia pagadora del SaaS y entrenador vendedor distinto; verificar asignación contable.","note":"","sec":"s01"},{"id":"12","kind":"q","pri":"P0","q":"¿Cómo se identifica a un profesional frente al comprador?","a":"La información legal y de contacto exigida del prestador será accesible al jugador antes de pagar; la factura incorporará sus datos fiscales completos.","mean":"En checkout, antes de pagar, el jugador debe saber qué profesional o entidad contrata, con los datos exigibles. La factura posterior no sustituye esta información.","check":"Abrir ficha y checkout como comprador: identidad legal y contacto del vendedor disponibles antes de pagar.","note":"","sec":"s01"},{"id":"13","kind":"q","pri":"P1","q":"¿Puede el entrenador ocultar su perfil en el marketplace?","a":"Sí, mediante un control de visibilidad del perfil; para vender públicamente deberá completar la verificación pertinente.","mean":"El entrenador debe decidir si su ficha es pública. La privacidad del perfil no elimina la posibilidad de trabajar con alumnos ya vinculados cuando el sistema lo permita.","check":"Alternar visibilidad y comprobar búsqueda pública; verificar que funciones internas no desaparecen.","note":"","sec":"s01"},{"id":"14","kind":"q","pri":"P1","q":"¿Cómo se ordenarán los entrenadores en el marketplace?","a":"Por criterios relevantes como ubicación, idioma, especialidad, reseñas verificadas y filtros del jugador; sin priorización pagada encubierta en el lanzamiento.","mean":"Ordenar resultados mediante criterios pertinentes al jugador, sin publicidad encubierta. Documentar el criterio principal de ordenación visible al consumidor.","check":"Buscar con filtros de idioma y ubicación y comprobar cambios coherentes; no insertar puestos pagados sin etiqueta.","note":"","sec":"s01"},{"id":"15","kind":"q","pri":"P0","q":"¿Qué idiomas tendrán los documentos legales de lanzamiento?","a":"Español e inglés, con versión y fecha de aceptación identificables.","mean":"Presentar documentos ES/EN según idioma de interfaz y registrar exactamente la versión aceptada. No bastan enlaces estáticos sin trazabilidad del consentimiento contractual.","check":"Contratar en ambos idiomas y confirmar versión, fecha y texto vinculados a la aceptación.","note":"","sec":"s01"},{"id":"16","kind":"q","pri":"P1","q":"¿Se ofrecerá el marketplace internacionalmente sin restricciones?","a":"Solo en territorios donde sea viable cumplir las obligaciones de contratación, pagos, protección de datos y fiscalidad.","mean":"No habilitar cobros en países no soportados por fiscalidad, prestadores, medios de pago o condiciones regulatorias. Evitar asumir que Stripe disponible significa venta autorizada.","check":"Simular país soportado/no soportado: verificar restricción y mensaje informativo.","note":"","sec":"s01"},{"id":"17","kind":"q","pri":"P0","q":"¿Qué modalidades de servicios incluirá el MVP?","a":"Programas individuales de 3, 6 y 12 meses; videoanálisis individuales; clases presenciales; packs; y suscripciones mensuales de seguimiento.","mean":"El catálogo debe reflejar solo los cinco productos individuales aprobados, sin pantallas antiguas de videollamadas o formatos de pareja.","check":"Crear y contratar un ejemplo de cada producto; revisar que no existe variante pareja.","note":"","sec":"s02"},{"id":"18","kind":"q","pri":"P0","q":"¿Los servicios tendrán modalidad para parejas?","a":"No. La contratación y el seguimiento son individuales en el MVP.","mean":"El MVP no admite precio para dos jugadores ni un servicio compartido por pareja. No confundir esta exclusión con que haya dos jugadores distintos en una clase grupal real fuera de la app.","check":"Revisar formulario de alta, listado y checkout: no existen selector pareja ni precios duales.","note":"","sec":"s02"},{"id":"19","kind":"q","pri":"P0","q":"¿Cómo se contratan los programas de 3, 6 y 12 meses?","a":"Mediante pago único por duración cerrada y condiciones previamente visibles y aceptadas.","mean":"Programa es contrato prepago de plazo fijo, no una suscripción. Deben mostrarse duración y contenido del seguimiento antes del cargo único.","check":"Comprar programa 3 meses; comprobar un único cargo y contrato con vencimiento visible.","note":"","sec":"s02"},{"id":"20","kind":"q","pri":"P0","q":"¿Desde cuándo empieza a contar la duración del programa?","a":"Desde la fecha de pago; debe distinguirse del momento en el que realmente comienza a prestarse el servicio a efectos de cancelaciones.","mean":"El vencimiento se calcula desde el pago, pero las reglas de reembolso dependen de si realmente hubo prestación. Guardar ambos hitos como datos independientes.","check":"Pagar programa sin actividad; confirmar fecha final y que sigue aplicando cancelación de programa no iniciado.","note":"","sec":"s02"},{"id":"21","kind":"q","pri":"P0","q":"¿El entrenador puede fijar el precio de sus servicios?","a":"Sí, indicando precios con los impuestos aplicables y las condiciones particulares de cada servicio antes de su contratación.","mean":"El coach gestiona sus precios de venta con impuestos incluidos y condiciones claras. La plataforma calcula la comisión adicional del jugador sin alterar la oferta del coach.","check":"Editar precio de servicio; comprobar precio en ficha, checkout y factura del vendedor.","note":"","sec":"s02"},{"id":"22","kind":"q","pri":"P1","q":"¿Qué tipos de packs pueden venderse?","a":"Combinaciones de servicios individuales; mostrar composición, vigencia, precio y condiciones particulares antes de pagar.","mean":"Pack agrupa servicios definidos, con cantidad, posible vigencia y reglas de uso. Mantener registro de unidades consumidas para aplicar cancelación total o parcial.","check":"Comprar pack, consumir un componente y comprobar saldo y política de devolución.","note":"","sec":"s02"},{"id":"23","kind":"q","pri":"P0","q":"¿La clase presencial se reserva automáticamente en un calendario externo?","a":"No. Solicitud del jugador, acuerdo por chat y registro manual de fecha/hora por el entrenador.","mean":"No existe reserva automática por huecos de calendario. El jugador solicita y se conversa la hora; el entrenador la registra manualmente.","check":"Crear solicitud sin fecha; acordar por chat y verificar que coach puede asignar fecha y hora.","note":"","sec":"s02"},{"id":"24","kind":"q","pri":"P0","q":"¿Qué estados tendrá una clase presencial?","a":"Pendiente de acordar; programada; completada; cancelada.","mean":"Estados de la clase representan la prestación, no el dinero. No mezclar clase completada con factura emitida ni con cobro en efectivo.","check":"Recorrer pendiente→programada→completada y caso cancelado; verificar historial de estados.","note":"","sec":"s02"},{"id":"25","kind":"q","pri":"P0","q":"¿Qué estados de pago se necesitan para una clase?","a":"Pagado online; pago pendiente en efectivo; pagado en efectivo; incluido en pack.","mean":"Cada clase tiene un estado de pago separado del estado de la clase. En un pack no hay que volver a cobrar al consumir una clase.","check":"Registrar clase pagadera en efectivo, pagada online e incluida en pack; comprobar que no hay doble cargo.","note":"","sec":"s02"},{"id":"26","kind":"q","pri":"P0","q":"¿Puede el entrenador modificar objetivos y planes durante el programa?","a":"Sí. Es parte del seguimiento deportivo ordinario; modificaciones sustanciales del contrato requieren aceptación expresa del jugador.","mean":"Cambiar un ejercicio o meta es la operativa normal del seguimiento. Alterar precio, duración o prestaciones ya vendidas requiere aceptación del comprador.","check":"Editar objetivo sin pedir aceptación contractual; cambiar duración/precio y verificar que requiere aceptación.","note":"","sec":"s02"},{"id":"27","kind":"q","pri":"P0","q":"¿El entrenador puede ofrecer una política de cancelación más favorable?","a":"Sí. Gimadd fija garantías mínimas; la política del entrenador puede ampliar, nunca reducir, los derechos mínimos y legales.","mean":"Los entrenadores pueden mejorar plazos o devoluciones, pero no empeorar los mínimos de Gimadd ni los derechos indisponibles del consumidor.","check":"Introducir política más restrictiva que el mínimo y comprobar que no se aplica.","note":"","sec":"s02"},{"id":"28","kind":"q","pri":"P0","q":"¿Qué infraestructura tramitará los cobros online?","a":"Stripe Connect, con verificación KYC del vendedor, asignación de transacciones al prestador correspondiente, webhooks y conciliación.","mean":"Todos los cobros online vinculados a profesionales deben asociarse con una cuenta Stripe Connect apta. No activar servicios a partir de un webhook duplicado o un pago inconcluso.","check":"Probar pago confirmado, fallo y webhook repetido; una sola operación y conciliación correcta.","note":"Comprobar idempotencia de los webhooks y gestión de errores.","sec":"s03"},{"id":"29","kind":"q","pri":"P0","q":"¿Cómo se muestra el precio al jugador antes del pago?","a":"Separar precio final del servicio del entrenador (impuestos incluidos), comisión de Gimadd y su impuesto aplicable, y total a pagar.","mean":"La suma visible debe separar servicio, comisión de intermediación e impuestos pertinentes. El total autorizado debe coincidir exactamente con el total cobrado y documentado.","check":"Simular compra de 20 €, verificar desglose, impuestos y coincidencia de checkout, Stripe y documentos.","note":"","sec":"s03"},{"id":"30","kind":"q","pri":"P0","q":"¿Cuál es la comisión de Gimadd al comprador?","a":"5 % del importe del servicio o mínimo de 1,50 €, con promociones o condiciones especiales preinformadas y tributación aplicable.","mean":"La tarifa estándar de intermediación al jugador es 5 % del servicio con mínimo 1,50 €. Considerar promociones preanunciadas y el tratamiento fiscal territorial sin aplicar impuestos ficticios.","check":"Comparar un servicio de 10 € (mínimo) y otro de 100 € (porcentaje); comprobar total fiscal.","note":"","sec":"s03"},{"id":"31","kind":"q","pri":"P0","q":"¿Quién paga la comisión del marketplace?","a":"El jugador/comprador, por separado del precio del servicio del entrenador. No se descontará por defecto como comisión facturada al entrenador.","mean":"La comisión de Gimadd se carga al comprador y tiene su propia factura. No restarla silenciosamente al importe facturado por el entrenador, aunque Stripe gestione liquidaciones.","check":"Revisar pedido: jugador paga servicio+fee; coach factura servicio y Gimadd factura fee al jugador.","note":"","sec":"s03"},{"id":"32","kind":"q","pri":"P0","q":"¿Quién emite la factura del servicio deportivo vendido online?","a":"El entrenador o academia prestadora; Gimadd la genera por cuenta y en nombre del vendedor, con acuerdo de facturación y sus datos fiscales correctos.","mean":"El PDF de la clase o programa debe emitirse en nombre del vendedor, aunque se genere técnicamente desde Gimadd. Requiere acuerdo de facturación por tercero y numeración/documentos correctos.","check":"Comprar servicio de autónomo y academia; verificar NIF, serie, impuestos y emisor correcto en ambas facturas.","note":"","sec":"s03"},{"id":"33","kind":"q","pri":"P0","q":"¿Quién factura la comisión de Gimadd al jugador?","a":"Gimadd Fitness S.L. emite un documento fiscal propio por el servicio de intermediación/comisión cobrado al jugador.","mean":"La intermediación es una prestación distinta al servicio deportivo y tiene un documento fiscal emitido por Gimadd al jugador. Separar la operación de la factura del coach.","check":"Realizar compra y obtener factura del servicio y factura de comisión con emisores diferentes.","note":"","sec":"s03"},{"id":"34","kind":"q","pri":"P0","q":"¿Quién emite la factura mensual de suscripción SaaS?","a":"Gimadd Fitness S.L. al entrenador, academia o sociedad que figure como contratante del SaaS, no necesariamente al vendedor de cada clase.","mean":"La factura SaaS se expide al contratante de la suscripción, que puede ser academia o autónomo. No tomar como destinatario automático al comprador del servicio ni al entrenador operador.","check":"Academia paga SaaS y coach vende clase: confirmar dos facturas con clientes correctos.","note":"","sec":"s03"},{"id":"35","kind":"q","pri":"P0","q":"¿Se factura por Gimadd una clase pagada en efectivo?","a":"No. Gimadd no cobra, procesa ni factura la clase en efectivo. El entrenador se ocupa directamente de la facturación que legalmente corresponda.","mean":"La plataforma puede registrar que se abonó en efectivo, pero no participa en el cobro ni emite la factura del servicio. El vendedor tiene su obligación fiscal fuera de Gimadd.","check":"Reservar clase cash, marcar pagado y confirmar ausencia de factura de Gimadd y evento Stripe.","note":"","sec":"s03"},{"id":"36","kind":"q","pri":"P0","q":"¿Se cobra comisión Gimadd en clases presenciales pagadas en efectivo?","a":"No se cobra comisión de marketplace por las clases pagadas fuera de la pasarela en efectivo.","mean":"El pago presencial en efectivo no lleva fee de marketplace. Un cambio de estado en el CRM no puede activar cargos retrospectivos.","check":"Clase cash: coste en Gimadd por intermediación = 0; no se crea factura de comisión.","note":"","sec":"s03"},{"id":"37","kind":"q","pri":"P0","q":"¿Qué servicio permite pago en efectivo?","a":"Solo la clase presencial. Los demás productos del marketplace se pagan online cuando se contratan a través de Gimadd.","mean":"Solo las clases presenciales ofrecen opción efectivo. Programas, videoanálisis, packs y mensualidades se contratan online si pasan por Mentor.","check":"Revisar checkout de los cinco productos: botón efectivo únicamente en clase presencial.","note":"","sec":"s03"},{"id":"38","kind":"q","pri":"P0","q":"¿Qué ocurre cuando el pago online se confirma pero falla la emisión documental?","a":"La operación debe quedar conciliable, no duplicarse y pasar a cola de reintento/alerta. Pago, servicio, split y documentos fiscales deben tener referencias cruzadas.","mean":"Un éxito de Stripe y un error del generador fiscal son procesos distintos. No se debe repetir el cargo para solucionar un fallo documental; generar incidencia y reintento seguro.","check":"Forzar error de factura tras pago exitoso y verificar un solo cargo, servicio activo y alerta de facturación.","note":"Prueba obligatoria: webhook duplicado y fallo de factura.","sec":"s03"},{"id":"39","kind":"q","pri":"P0","q":"¿Cómo debe aplicarse un reembolso de compra online?","a":"Reembolsar por separado, cuando corresponda, el importe del servicio del vendedor y la comisión de Gimadd, y generar las rectificaciones fiscales pertinentes.","mean":"Cada reembolso debe revertir los componentes que correspondan y generar documentos rectificativos del emisor respectivo. Mantener enlace entre pago, devolución y factura.","check":"Cancelación con reembolso total: comprobar devolución del servicio y fee, factura rectificativa y saldo conciliado.","note":"","sec":"s03"},{"id":"40","kind":"q","pri":"P0","q":"¿Qué datos deben guardarse por cada operación?","a":"Vendedor legal, comprador, servicio, importe con impuestos, base y cuota que correspondan, comisión Gimadd, moneda, país, estado Stripe, documento fiscal y eventual abono.","mean":"Guardar un libro lógico de la operación con identificadores estables de vendedor, comprador, SaaS, impuestos, moneda, Stripe y documentos, sin limitarse a un flag «pagado».","check":"Consultar una compra desde backoffice y reconstruir toda la transacción sin cálculos manuales.","note":"","sec":"s03"},{"id":"41","kind":"q","pri":"P0","q":"¿Qué sucede si el entrenador cancela un servicio sin causa justificada?","a":"Reembolso del 100 % del importe del servicio y del 100 % de la comisión Gimadd; salvo reprogramación expresamente aceptada por el jugador.","mean":"Si el vendedor cancela unilateralmente sin causa justificada, el jugador recupera servicio y fee. Solo mantener la reserva si el jugador acepta un cambio equivalente.","check":"Coach cancela: devolución 100 % total; si jugador acepta fecha nueva, no duplicar devolución.","note":"","sec":"s04"},{"id":"42","kind":"q","pri":"P0","q":"¿Hasta cuándo puede cancelar gratuitamente el jugador una clase presencial?","a":"Hasta 24 horas antes de la fecha y hora acordadas: reembolso íntegro del precio del servicio y de la comisión Gimadd.","mean":"Se toma la fecha/hora finalmente acordada. Hasta 24 horas antes, el jugador tiene reembolso íntegro incluido fee; cuidado con huso horario y nuevas fechas reprogramadas.","check":"Cancelar 25 horas antes y comprobar reintegro de ambos conceptos; verificar hora de corte.","note":"","sec":"s04"},{"id":"43","kind":"q","pri":"P0","q":"¿Qué ocurre con la cancelación de una clase dentro de las últimas 24 horas?","a":"Se aplicará la política particular del entrenador comunicada antes de contratar, siempre que sea legalmente válida.","mean":"Fuera de la ventana gratuita se aplica la política explícita del coach que figuraba al contratar, siempre subordinada a las normas de consumidores.","check":"Cancelar 2 horas antes y comprobar que sistema consulta condiciones guardadas de la compra.","note":"","sec":"s04"},{"id":"44","kind":"q","pri":"P0","q":"¿Quién gestiona penalizaciones por no asistencia a una clase pagadera en efectivo?","a":"El entrenador directamente, solo si la penalización fue pactada previamente y es válida; Gimadd no la cobra ni la factura.","mean":"Gimadd no actúa como cobrador de sanciones de clases cash. Solo puede reflejar el estado de la reserva; el coach gestiona directamente cualquier penalización válida.","check":"Marcar no-show en clase cash y verificar cero cargo y cero factura por penalización en Gimadd.","note":"","sec":"s04"},{"id":"45","kind":"q","pri":"P0","q":"¿Puede el jugador cancelar un programa si todavía no se ha prestado ningún servicio?","a":"Sí, reembolso íntegro del precio del programa y de la comisión de Gimadd, sin perjuicio de otras garantías legales.","mean":"Aunque ya haya empezado a correr el plazo desde el pago, si no se ha ejecutado ninguna prestación procede el reembolso integral acordado. Registrar actividad efectivamente prestada.","check":"Pagar un programa, no entregar análisis ni planes, cancelar: reintegro servicio y fee.","note":"","sec":"s04"},{"id":"46","kind":"q","pri":"P0","q":"¿Qué ocurre si se cancela un programa ya iniciado?","a":"Aplicar la política previamente aceptada del entrenador y los mínimos de Gimadd, con respeto al desistimiento y demás derechos legales.","mean":"Con prestación ya iniciada, consultar las condiciones aceptadas por ese jugador, no una política modificada después. Mantener las excepciones legales de desistimiento.","check":"Editar política del coach después de compra; cancelar y verificar aplicación de versión contractual original.","note":"","sec":"s04"},{"id":"47","kind":"q","pri":"P0","q":"¿Qué ocurre si se cancela un pack totalmente sin usar?","a":"Reembolso del 100 % del precio del pack y de la comisión Gimadd.","mean":"El pack totalmente sin usar tiene devolución total, tanto del vendedor como de Gimadd. Consumir cero elementos debe verificarse en backend.","check":"Comprar pack sin uso, cancelar y obtener reembolso íntegro y rectificaciones.","note":"","sec":"s04"},{"id":"48","kind":"q","pri":"P0","q":"¿Qué ocurre con un pack usado parcialmente?","a":"Aplicar la política del entrenador aceptada antes de contratar, sin perjuicio de derechos legales.","mean":"Si se ha utilizado una parte, computar componentes ya prestados y aplicar las condiciones iniciales del entrenador respetando derechos legales.","check":"Consumir una clase de un pack y confirmar que no se trata como «pack intacto».","note":"","sec":"s04"},{"id":"49","kind":"q","pri":"P0","q":"¿Cuándo deja de ser cancelable gratis un videoanálisis ordinario?","a":"El jugador recibe reembolso íntegro mientras el entrenador no haya comenzado efectivamente el análisis; el inicio real debe quedar registrado y nunca eliminar derechos legales de desistimiento por sí solo.","mean":"El comienzo del análisis exige trabajo real del coach, con marca temporal auditable. No vale iniciar ficticiamente para negar devolución; el desistimiento legal se trata aparte.","check":"Cancelar antes de iniciar y recuperar todo; iniciar con evento real y verificar política posterior.","note":"","sec":"s04"},{"id":"50","kind":"q","pri":"P0","q":"¿Cómo se informa del derecho de desistimiento en compras a distancia?","a":"Checkout con información legal adaptada al tipo de servicio y, cuando proceda, solicitud expresa para empezar antes de 14 días; no asumir pérdida automática del derecho por iniciar la actividad.","mean":"Antes de pagar mostrar desistimiento y reglas aplicables al servicio específico. Solicitar expresamente el comienzo anticipado cuando corresponda, sin checkbox genérico que suponga renuncia automática.","check":"Verificar checkout de clase, programa y videoanálisis y registro de solicitud de inicio anticipado.","note":"","sec":"s04"},{"id":"51","kind":"q","pri":"P0","q":"¿Qué ocurre con un impago de la suscripción mensual de un jugador?","a":"Día 0 fallo; días 1–3 acceso y reintentos; días 4–6 servicio suspendido; día 7 cancelación por impago, sin borrar historial.","mean":"La mensualidad del jugador es recurrente y tiene ventanas de gracia y suspensión distintas del SaaS coach. El historial no se borra por un fallo de tarjeta.","check":"Simular cobro fallido; días 1–3 acceso, 4–6 suspendido, 7 cancelado; sin pérdida de historial.","note":"","sec":"s04"},{"id":"52","kind":"q","pri":"P0","q":"¿Qué sucede si falla el pago de la suscripción SaaS del entrenador?","a":"Días 1–7 acceso completo; días 8–30 únicamente funciones para cumplir contratos activos; tras 30 días Gimadd puede iniciar terminación y gestión de obligaciones pendientes.","mean":"El coach con cuota SaaS impagada debe seguir atendiendo contratos de jugadores durante restricción. Bloquear venta nueva desde día 8, sin bloquear el cumplimiento de obligaciones.","check":"Simular día 10 sin pagar: no vender nuevos programas, sí terminar videoanálisis pendiente.","note":"","sec":"s04"},{"id":"53","kind":"q","pri":"P0","q":"¿Cómo cancela su SaaS un entrenador sin servicios activos pendientes?","a":"Desactivar la renovación; acceso hasta fin del periodo pagado; sin devolución proporcional ordinaria, salvo derechos legales.","mean":"Cancelación estándar al final de ciclo pagado si no hay contratos activos que dependan del SaaS. No reembolsar prorrata ordinaria salvo obligación legal.","check":"Cancelar SaaS sin contratos activos y comprobar fecha efectiva y ausencia de próximo cobro.","note":"","sec":"s04"},{"id":"54","kind":"q","pri":"P0","q":"¿Qué opciones tiene el entrenador que desea cancelar SaaS con servicios ya vendidos activos?","a":"Mantener SaaS y cumplir obligaciones hasta terminar los contratos previos, o resolver los servicios pendientes con devolución íntegra al jugador, incluso si se hubieran prestado parcialmente, según la política acordada.","mean":"Con servicios comprados por jugadores pendientes, el coach no puede abandonar la relación sin resolverla. Debe conservar SaaS hasta cumplir o cancelar y reintegrar íntegramente lo exigido.","check":"Coach con programa parcialmente realizado solicita baja: sistema exige elegir cumplir o resolver con reembolso.","note":"Servicios externos no pagados en Gimadd no bloquean la baja SaaS.","sec":"s04"},{"id":"55","kind":"q","pri":"P0","q":"¿Qué ocurre con las renovaciones de suscripciones de jugadores si el entrenador cancela su SaaS?","a":"Desactivar renovaciones futuras y notificar. Mantener el seguimiento del periodo ya cobrado o devolver íntegramente si se interrumpe por decisión del entrenador.","mean":"Si coach abandona SaaS, la plataforma debe detener siguientes cargos recurrentes al jugador y resolver el periodo que ya está pagado.","check":"Cancelar SaaS con mensualidad jugador: siguiente renovación deshabilitada y jugador notificado.","note":"","sec":"s04"},{"id":"56","kind":"q","pri":"P0","q":"¿Qué ocurre con el acceso del entrenador tras terminar su SaaS?","a":"90 días de acceso de solo lectura desde la baja efectiva; posibilitar reactivación. Después, eliminar el espacio de trabajo salvo conservación legal; no borrar los datos independientes de jugadores.","mean":"La baja efectiva inicia 90 días de solo lectura para coach, con opción de reactivarse; después se elimina el espacio salvo obligación de retención. El progreso del jugador no pertenece al workspace del coach.","check":"Simular día 1, 89, 91 tras baja; probar solo lectura, reactivación y no eliminación de datos independientes.","note":"","sec":"s04"},{"id":"57","kind":"q","pri":"P1","q":"¿Qué avisos habrá antes de borrar el espacio del entrenador?","a":"En fechas 0, 7, 30, 60, 83, 89 y 90 días, con canales legalmente permitidos y diferenciación de avisos operativos frente a marketing.","mean":"Los avisos de cuenta van por necesidad contractual y no dependen de consentimientos publicitarios. Programar cada día respecto a la baja efectiva, no respecto a la solicitud.","check":"Forzar cronograma de 0, 7, 30, 60, 83, 89 y 90 y verificar una sola notificación por evento.","note":"","sec":"s04"},{"id":"58","kind":"q","pri":"P0","q":"¿Cómo se aplican las subidas de precio del SaaS de Gimadd?","a":"Aviso mínimo de 30 días; entrenador puede cancelar. Contratos de jugadores contraídos antes del anuncio protegen la tarifa anterior hasta cumplirse; nuevos contratos posteriores no prolongan protección.","mean":"La subida del SaaS no perjudica compromisos con jugadores anteriores a la comunicación. La tarifa anterior se prolonga solo mientras duren compromisos protegidos anteriores.","check":"Crear contrato antes y después del anuncio y comprobar qué compromisos mantienen tarifa vieja.","note":"","sec":"s04"},{"id":"59","kind":"q","pri":"P1","q":"¿Cuándo se considera cliente a un jugador del CRM?","a":"Todo jugador vinculado es cliente; el servicio activo es un estado independiente, y también puede existir actividad deportiva sin compra online.","mean":"En CRM distinguir vínculo comercial «cliente» del hecho de disponer de servicio pagado y de la actividad deportiva reciente. No confundir inactividad con desvinculación.","check":"Vincular jugador sin compra y comprobar que aparece como cliente sin servicio activo.","note":"","sec":"s05"},{"id":"60","kind":"q","pri":"P0","q":"¿Cómo se identifica un seguimiento contratado fuera de Gimadd?","a":"Como Servicio externo, distinto de un servicio comprado en la plataforma y sin transacción de marketplace asociada.","mean":"La actividad externa permite seguimiento con la relación autorizada, pero no debe generar pedido, comisión ni facturas marketplace ficticias.","check":"Registrar servicio externo y comprobar seguimiento permitido sin cargo Stripe.","note":"","sec":"s05"},{"id":"61","kind":"q","pri":"P0","q":"¿Cómo se incorporan alumnos al entrenador?","a":"Alta manual de contacto; enlace genérico o código de entrenador, con aceptación de vinculación antes de compartir datos deportivos.","mean":"Alta de contacto, link y código son mecanismos distintos. Ninguno debe revelar información de jugador registrado hasta aceptación expresa de la vinculación.","check":"Invitar contacto y abrir código: datos deportivos bloqueados antes de aceptar y visibles después según permisos.","note":"","sec":"s05"},{"id":"62","kind":"q","pri":"P0","q":"¿Puede un entrenador ver datos de una cuenta solo porque la añadió manualmente?","a":"No. El alta manual no da acceso a la cuenta ni a datos personales deportivos hasta aceptación de vínculo por el jugador.","mean":"Agregar un email o teléfono al CRM no autoriza a ver la cuenta de ese email, ni siquiera si ya tiene usuario Gimadd.","check":"Coach añade email existente: el panel no muestra sus vídeos ni historial sin aceptar vínculo.","note":"","sec":"s05"},{"id":"63","kind":"q","pri":"P0","q":"¿Pueden los entrenadores exportar su CRM para campañas publicitarias?","a":"No incluir una función estándar de exportación masiva orientada a marketing externo ni campañas de marketing en el CRM MVP.","mean":"No diseñar exportación en lote para publicidad ni panel de email marketing. No confundir con acceso individual autorizado o derechos legales de portabilidad.","check":"Revisar CRM y API: no existe acción de extracción masiva comercial o campañas.","note":"","sec":"s05"},{"id":"64","kind":"q","pri":"P0","q":"¿Quién decide qué datos de salud ve el entrenador?","a":"Solo el jugador incorpora lesiones, molestias o limitaciones y autoriza por separado el acceso de cada entrenador; revocación inmediata.","mean":"Lesiones y limitaciones son información sensible. Su edición corresponde al jugador, y cada coach necesita permiso separado, revocable en el momento.","check":"Jugador autoriza coach A no B; ambos ven exactamente lo permitido, y A deja de verlo al revocar.","note":"","sec":"s05"},{"id":"65","kind":"q","pri":"P0","q":"¿Qué ocurre con los vídeos cuando vence su plazo de conservación?","a":"Plazo general máximo 12 meses desde subida, con avisos 30, 7 y 1 días antes; resolver antes los casos necesarios para servicios aún activos.","mean":"El temporizador de almacenamiento empieza al subir cada vídeo, no al analizarlo. Avisar antes del vencimiento y resolver los vídeos necesarios para contratos activos.","check":"Subir vídeo con fecha ficticia; verificar avisos 30/7/1 y retención excepcional documentada.","note":"","sec":"s05"},{"id":"66","kind":"q","pri":"P0","q":"¿Cuál es el límite de almacenamiento de vídeo por jugador?","a":"10 GB por jugador (no por entrenador).","mean":"La cuota de vídeos se suma por titular jugador aunque use tres coaches. Evitar asignar 10 GB a cada entrenador o a cada proyecto.","check":"Dos coaches suben contenido del mismo jugador; un único contador de uso y bloqueo al superar cuota.","note":"No introducir mensajes comerciales sobre almacenamiento ampliable o compras futuras.","sec":"s05"},{"id":"67","kind":"q","pri":"P0","q":"¿Qué ocurre cuando un usuario borra un vídeo original?","a":"Eliminar el original y los clips de feedback asociados; mantener objetivos, planes y diario como registros independientes. Advertir si afecta a servicios pendientes.","mean":"La acción de borrar original también borra los clips derivados que dependen de él, pero no las metas, planes ni diarios. Advertir cuando hay videoanálisis sin completar.","check":"Eliminar vídeo con feedback y plan: original+clips desaparecen; objetivos y diario persisten.","note":"","sec":"s05"},{"id":"68","kind":"q","pri":"P1","q":"¿Qué piezas del videoanálisis puede descargar el jugador?","a":"Clips de feedback creados por el entrenador con comentarios, no el vídeo completo de devolución como descarga estándar; derechos RGPD de acceso/portabilidad aparte.","mean":"El UI ofrece descarga de cortes de feedback con comentarios del entrenador, no el vídeo largo completo como acción estándar. Los derechos de acceso RGPD se atienden por otro canal.","check":"Comprobar que descargar clip está disponible; no existe botón de descarga íntegra del análisis general.","note":"","sec":"s05"},{"id":"69","kind":"q","pri":"P0","q":"¿Puede Gimadd publicar un vídeo de un jugador para promocionarse?","a":"No por el hecho de haberlo subido o por haber permitido compartirlo; se requiere autorización específica apropiada de los afectados.","mean":"Una subida privada nunca equivale a autorización para marketing. Publicidad de Gimadd necesita autorización diferenciada y apropiada de cada afectado.","check":"Subir vídeo sin permiso de difusión: no aparece en redes/web públicas ni biblioteca promocional.","note":"","sec":"s05"},{"id":"70","kind":"q","pri":"P1","q":"¿Puede el jugador publicar clips del entrenador en redes?","a":"Solo si el entrenador habilita la opción general, desactivada por defecto, y se respetan derechos de imagen y terceros.","mean":"El coach puede activar una preferencia general de compartir clips, desactivada inicialmente. Aun activa, la publicación debe respetar derechos de imagen de terceros.","check":"Coach sin habilitar: botón de compartir público restringido; habilitar y comprobar nuevo permiso.","note":"","sec":"s05"},{"id":"71","kind":"q","pri":"P0","q":"¿Qué consentimiento debe existir para terceros identificables en vídeos?","a":"La persona que graba o sube debe disponer de derechos/autorizaciones suficientes; no pedir una casilla nueva en cada subida, pero ofrecer aviso y canal de retirada.","mean":"El uploader declara disponer de permisos para grabaciones con terceros; se ofrece información y canal de denuncia/retirada. No poner nuevo consentimiento por cada subida.","check":"Subir vídeo: aviso persistente sin checkbox repetido; probar denuncia y ocultación/revisión.","note":"","sec":"s05"},{"id":"72","kind":"q","pri":"P0","q":"¿Qué ocurre al desactivar voluntariamente una cuenta de jugador?","a":"Previo cierre de servicios activos; ventana de reactivación de 90 días con avisos 0,30,60,83,89; respetar por separado el derecho RGPD de supresión sin demora indebida.","mean":"La desactivación ordinaria incluye 90 días para reactivar y avisos. Distinto del ejercicio de supresión RGPD, que no debe demorarse arbitrariamente. Resolver obligaciones pagadas antes de desactivar.","check":"Intentar baja con contrato activo: solicitar resolución; probar reactivación día 60 y solicitud RGPD separada.","note":"","sec":"s05"},{"id":"73","kind":"q","pri":"P0","q":"¿Cómo se gestionan los consentimientos comerciales?","a":"Tres preferencias independientes y desactivadas inicialmente: email comercial, push promocional y permiso para recibir solicitudes de uso público de vídeos; esta tercera no autoriza la difusión.","mean":"Los tres controles de marketing son independientes, apagados por defecto. Permiso de recibir propuestas de uso publicitario NO autoriza publicar vídeos.","check":"Crear usuario nuevo: tres switches off; activar uno y verificar que los otros siguen off.","note":"","sec":"s05"},{"id":"74","kind":"q","pri":"P0","q":"¿Qué autenticación se requiere por rol?","a":"2FA obligatorio para administradores; opcional para entrenadores y jugadores; control de acceso y registro auditado para soporte.","mean":"La autenticación reforzada es obligatoria en backoffice admin. Para coach y jugador será opcional; los permisos se validan en servidor.","check":"Administrador sin 2FA no entra; coach sin 2FA sí, y puede configurarlo voluntariamente.","note":"","sec":"s05"},{"id":"75","kind":"q","pri":"P0","q":"¿Qué acceso tiene el equipo de soporte de Gimadd a contenidos privados?","a":"Solo ante causa legítima de soporte, seguridad o exigencia legal, con roles de mínimo privilegio y auditoría de accesos.","mean":"El soporte no debe poder curiosear vídeos o chats libremente. Todo acceso extraordinario se justifica, limita y registra con actor, fecha y motivo.","check":"Crear ticket y acceder con permiso; consultar logs; usuario soporte sin autorización recibe denegación.","note":"","sec":"s05"},{"id":"76","kind":"q","pri":"P1","q":"¿Qué conexión se permite con Google Calendar?","a":"Opcional y unidireccional desde Gimadd hacia el calendario conectado del entrenador; no leer eventos privados ajenos.","mean":"OAuth de entrenador solo autoriza escribir eventos de clases acordadas en calendario externo. No solicitar lectura de reuniones privadas ni sincronización bidireccional.","check":"Conectar Google Calendar, crear clase, ver evento exportado y comprobar permisos OAuth mínimos.","note":"","sec":"s05"},{"id":"77","kind":"q","pri":"P1","q":"¿Qué reseñas se podrán publicar y cómo se moderan?","a":"Solo reseñas de servicios pagados y completados dentro de la plataforma; publicación automática de opiniones positivas y negativas, con denuncia y revisión de contenidos indebidos.","mean":"Solo compras confirmadas y servicios completados generan posibilidad de reseña verificada. No filtrar opiniones negativas automáticamente; denuncia para contenido ilícito o abusivo.","check":"Crear reseña de servicio completado y negativa válida; ambas visibles; cuenta sin compra no opina.","note":"","sec":"s05"},{"id":"78","kind":"q","pri":"P0","q":"¿Cuándo se pueden cargar cookies no esenciales?","a":"Solo tras consentimiento válido; banner con aceptar/rechazar/configurar equivalentes y revocación fácil; inventario exacto de cookies según instalaciones reales.","mean":"El gestor de cookies debe bloquear analítica y píxeles antes de optar voluntariamente. Aceptar/rechazar/configurar son opciones accesibles y equivalentes; listar cookies reales tras instalación.","check":"Abrir sesión nueva y comprobar tráfico sin consentimiento; rechazar, aceptar y revocar.","note":"","sec":"s05"},{"id":"79","kind":"q","pri":"P0","q":"¿Qué ocurre si un jugador elimina el vídeo necesario para un análisis pendiente?","a":"El entrenador podrá solicitar una nueva grabación sin que se genere automáticamente un reembolso.","mean":"Un jugador puede borrar su vídeo, pero si era imprescindible para un análisis no puede exigir devolución automática por esa sola acción. El coach debe poder pedir reemplazo.","check":"Borrar vídeo pendiente: advertencia; coach envía solicitud de nuevo vídeo; servicio sigue pendiente.","note":"Advertencia antes de borrar y registro de petición de sustitución.","sec":"s06"},{"id":"80","kind":"q","pri":"P0","q":"¿Durante cuánto tiempo se conservarán los mensajes privados?","a":"Mientras las cuentas estén activas, respetando los derechos de supresión y las obligaciones legales de conservación.","mean":"El chat sirve para coordinación y prueba de acuerdos. Conservar mientras cuentas activas y exista base legítima; las solicitudes legales se gestionan con canal específico.","check":"Mantener conversación meses después; tramitar supresión y preservar exclusivamente lo legalmente necesario.","note":"","sec":"s06"},{"id":"81","kind":"q","pri":"P0","q":"¿Podrán los usuarios eliminar mensajes o conversaciones desde el chat?","a":"No. No habrá eliminación manual desde el chat; se aplicarán los derechos legales de supresión.","mean":"No hay «borrar para mí» ni «borrar para ambos» en la interfaz. Esto no anula la gestión administrativa de derechos de supresión.","check":"Inspeccionar chat en móvil y web: no existe función borrar; solicitud RGPD sí tiene procedimiento.","note":"","sec":"s06"},{"id":"82","kind":"q","pri":"P0","q":"¿Cómo se gestionarán las infracciones de las condiciones de uso?","a":"Medidas proporcionales: advertencia, restricción, suspensión o cierre según gravedad, con actuación inmediata ante riesgos graves.","mean":"Las sanciones son graduadas según el caso: advertencia, restricción, suspensión y cierre; el equipo puede actuar urgente frente a riesgos graves.","check":"Simular aviso leve y bloqueo grave; validar que servicio comprado se resuelve y se documenta decisión.","note":"","sec":"s06"},{"id":"83","kind":"q","pri":"P1","q":"¿Cómo se revisarán las suspensiones y restricciones de cuenta?","a":"Mediante soporte por email o centro de ayuda, con revisión individual y respuesta motivada.","mean":"No se requiere módulo de apelaciones dentro de la app; sí dirección/email de soporte, expediente y respuesta motivada.","check":"Cuenta suspendida puede enviar reclamación; soporte registra revisión y comunica decisión.","note":"","sec":"s06"},{"id":"84","kind":"q","pri":"P0","q":"¿Qué información puede introducir el entrenador sobre clientes externos?","a":"Datos básicos de contacto; el seguimiento deportivo requiere que el jugador acepte la vinculación.","mean":"Sin vínculo, solo almacenar contacto básico de alumno externo. No habilitar notas médicas, vídeos, planes deportivos ni historial de usuario desde esa alta manual.","check":"Crear contacto sin cuenta: solo nombre, teléfono, email y notas administrativas; seguimiento bloqueado.","note":"","sec":"s06"},{"id":"85","kind":"q","pri":"P1","q":"¿Podrá el entrenador invitar a clientes externos desde Gimadd?","a":"Sí, invitaciones individuales por email o enlaces compartibles; sin campañas comerciales.","mean":"Invitación dirigida a un cliente concreto desde plataforma, o link compartible; no campañas en lote ni envío automático indiscriminado a contactos.","check":"Coach invita una persona; invitación enlaza aceptación; no hay botón enviar a todos.","note":"","sec":"s06"},{"id":"86","kind":"q","pri":"P0","q":"¿Qué ocurre con el chat cuando un jugador se desvincula?","a":"Se cierra para mensajes nuevos; ambos conservan acceso al historial anterior conforme a las reglas de conservación.","mean":"Desvincular debe cerrar mensajes nuevos entre las dos personas, sin destruir el historial previo permitido. Servicios activos requieren resolución antes de perder canal operativo.","check":"Desvincular y tratar de enviar mensaje: bloqueado; conversación anterior aún legible.","note":"","sec":"s06"},{"id":"87","kind":"q","pri":"P0","q":"¿Puede el jugador estar vinculado a varios entrenadores simultáneamente?","a":"Sí, sin límite contractual fijo y manteniendo separados los datos y contenidos de cada relación.","mean":"Un jugador puede trabajar con varios coaches; cada relación tiene permisos y recursos separados. El aislamiento se exige también en consultas API.","check":"Jugador vinculado a A y B: A intenta abrir ID de vídeo de B y recibe acceso denegado.","note":"","sec":"s06"},{"id":"88","kind":"q","pri":"P0","q":"¿Qué perfil general verá el entrenador vinculado?","a":"Nombre, fotografía, nivel de juego y datos deportivos generales. Nunca los contenidos privados de otros entrenadores.","mean":"El coach ve la ficha general mínima de jugador vinculado, pero no un resumen global de los trabajos de otros entrenadores, ni salud sin autorización.","check":"Coach A ve nombre/foto/nivel, no planes de B ni lesión privada; tras desvincular desaparece acceso.","note":"","sec":"s06"},{"id":"89","kind":"q","pri":"P0","q":"¿Cómo funcionarán los servicios de seguimiento en pareja?","a":"Funcionalidad eliminada del MVP. No programar contratación, precios ni seguimiento en pareja.","mean":"Esta función fue eliminada expresamente. No programar pareja ni dejarlo como opción oculta en formularios de lanzamiento.","check":"Buscar en servicios, checkout, facturas y filtros: ningún campo de pareja.","note":"","sec":"s06"},{"id":"90","kind":"q","pri":"P0","q":"¿Qué cinco tipos de servicios individuales estarán disponibles?","a":"Programas 3/6/12 meses, videoanálisis, clases presenciales, packs y suscripciones mensuales.","mean":"Verificación transversal del catálogo: la suscripción mensual de jugador es un producto adicional, no debe confundirse con el programa prepago ni con SaaS coach.","check":"Crear los cinco tipos y comprobar frecuencia de cobros y flujos propios.","note":"","sec":"s06"},{"id":"91","kind":"q","pri":"P0","q":"¿Cómo cambian los precios de suscripciones mensuales de jugadores?","a":"Aviso previo mínimo de 30 días y aceptación expresa del jugador antes de cobrar el nuevo precio.","mean":"Una subida del precio mensual al jugador requiere aviso 30 días y aceptación antes del nuevo cobro. Sin aceptación no ejecutar importe aumentado.","check":"Programar aumento, no aceptar y simular renovación: no se cobra más; aceptar y confirmar nuevo precio.","note":"","sec":"s06"},{"id":"92","kind":"q","pri":"P0","q":"¿Cómo retira un entrenador una suscripción de su catálogo?","a":"Puede retirarla para nuevos clientes de inmediato; debe avisar a suscriptores activos con 30 días de antelación y cumplir los periodos ya pagados.","mean":"Retirar oferta no debe cortar inmediatamente el contrato vigente. Ocultar para nuevos compradores, informar a suscriptores activos y agotar periodos ya pagados.","check":"Coach retira plan: no aparece para nuevos; cliente actual accede hasta vencimiento; renovación futura detenida.","note":"","sec":"s06"},{"id":"93","kind":"q","pri":"P0","q":"¿Qué ocurre al terminar un programa de 3, 6 o 12 meses?","a":"Renovación manual: termina automáticamente y, para continuar, el jugador realiza nueva contratación y nuevo pago. Sin cargos automáticos.","mean":"Programa de 3/6/12 meses termina automáticamente y no genera factura ni cobro nuevo sin compra expresa. Es diferente de la mensualidad recurrente.","check":"Vencer programa: acceso según vencimiento, ninguna orden de cobro; nueva compra crea nuevo programa.","note":"","sec":"s06"},{"id":"94","kind":"q","pri":"P0","q":"¿Qué puede modificar el entrenador durante un programa activo?","a":"Objetivos y planes deportivos libremente; modificaciones sustanciales de precio, duración o prestaciones necesitan aceptación expresa.","mean":"El coach adapta entrenamiento continuamente, pero un cambio sustancial del contrato requiere aceptación del comprador. Guardar propuesta, versión anterior y respuesta.","check":"Editar ejercicio: inmediato; ampliar plazo o cambiar precio: queda pendiente hasta aceptación.","note":"","sec":"s06"},{"id":"95","kind":"q","pri":"P1","q":"¿Pueden pausarse programas por lesión u otras causas?","a":"Solo por acuerdo entre jugador y entrenador, conforme a las condiciones contratadas y derechos legales.","mean":"La lesión no provoca automáticamente congelación de plazo. Ambos acuerdan pausa respetando condiciones del programa y derechos legales.","check":"Jugador pide pausa: el sistema no modifica solo la fecha de vencimiento.","note":"","sec":"s06"},{"id":"96","kind":"q","pri":"P0","q":"¿Cómo se tramitará la pausa de un programa?","a":"Se acuerda por chat; el entrenador registra nueva fecha final y el jugador confirma expresamente el cambio.","mean":"El acuerdo se documenta en chat, coach propone nuevo vencimiento y el jugador confirma expresamente en plataforma. Sin esa confirmación la fecha antigua se mantiene.","check":"Coach modifica fin, jugador rechaza/no responde: fecha no cambia; aceptación queda registrada.","note":"","sec":"s06"},{"id":"97","kind":"q","pri":"P0","q":"¿Cómo se reembolsa una cancelación voluntaria de suscripción mensual?","a":"Se desactiva siguiente renovación, sin prorrateo automático; el servicio continúa hasta fin del periodo pagado, salvo derechos legales o incumplimiento.","mean":"Cancelar mensualidad detiene siguiente ciclo, pero lo abonado se disfruta hasta fin de periodo sin prorrateo ordinario. Mantener excepciones legales y fallo del coach.","check":"Cancelar a mitad de mes: próxima renovación desactivada, acceso vigente y cero reembolso automático.","note":"","sec":"s06"},{"id":"98","kind":"q","pri":"P0","q":"¿Qué avisos de renovación se enviarán al jugador?","a":"Mostrar precio y renovación automática con claridad en el checkout; no recordatorios adicionales, salvo los exigidos legalmente.","mean":"Checkout de mensualidad indica precio, periodicidad y renovación automática de forma inequívoca; no introducir recordatorios opcionales que no fueron pedidos.","check":"Comprar mensualidad, registrar autorización y comprobar que solo se generan avisos obligatorios.","note":"","sec":"s06"},{"id":"99","kind":"q","pri":"P0","q":"¿Cómo se reprogramará una clase presencial?","a":"Por acuerdo en el chat; el entrenador modifica manualmente fecha y hora, sin segunda confirmación en la app.","mean":"El coach cambia fecha de clase tras pactarla por chat. A diferencia de una pausa de programa, no hace falta segundo clic de aceptación del jugador; guardar trazabilidad.","check":"Acordar por chat, coach ajusta fecha y verificar notificación e historial sin botón de segunda aceptación.","note":"La conversación debe acreditar el acuerdo.","sec":"s06"},{"id":"A01","kind":"a","pri":"P0","q":"Facturación — prioridad absoluta","a":"En cada pago online comprobar tres sujetos distintos cuando proceda: vendedor del servicio, comprador del servicio y contratante del SaaS. El NIF y razón social del emisor del servicio deben ser los del vendedor; la factura de comisión, Gimadd; la del SaaS, Gimadd al suscriptor.","mean":"","check":"En una compra real de pruebas, identifique expresamente los tres sujetos y genere los documentos a cada NIF correcto.","note":"","sec":"notes"},{"id":"A02","kind":"a","pri":"P0","q":"Factura por cuenta de terceros","a":"La generación de documentos del servicio se hará en nombre y por cuenta del entrenador/academia, con acuerdo de facturación y controles fiscales. No convertir a Gimadd por error en proveedor del entrenamiento.","mean":"","check":"Pruebe facturación a nombre de autónomo y academia, con series, impuestos y acuerdo de facturación por tercero.","note":"","sec":"notes"},{"id":"A03","kind":"a","pri":"P0","q":"Desglose en checkout","a":"En pantalla antes de pagar: precio del entrenador con impuestos, comisión Gimadd con su impuesto aplicable, total. En factura, aplicar tratamiento fiscal correcto al territorio y operación (sin tipo impositivo fijo asumido).","mean":"","check":"Compruebe que precio, fee, impuestos, total de Stripe y facturas cuadran al céntimo en varios importes.","note":"","sec":"notes"},{"id":"A04","kind":"a","pri":"P0","q":"Pago efectivo","a":"Solo clases presenciales: sin Stripe, sin comisión Gimadd, sin factura Gimadd de clase; estados claros de pendiente/pagado. El entrenador puede registrar el pago y es responsable de facturar por su cuenta.","mean":"","check":"Marque una clase como pagada en efectivo y compruebe que no hay pago Stripe ni factura/fee Gimadd.","note":"","sec":"notes"},{"id":"A05","kind":"a","pri":"P0","q":"Refund / abonos","a":"Casos de prueba separados: clase cancelada 25 horas antes; cancelada 2 horas antes; cancelación por coach; pack no usado; programa no iniciado; videoanálisis sin empezar; suscripción ya renovada; cobro fallido. Cada abono debe conciliar ambos componentes (servicio + comisión) y los documentos rectificativos.","mean":"","check":"Ejecute y documente cada supuesto de reembolso con pago test y el correspondiente documento rectificativo.","note":"","sec":"notes"},{"id":"A06","kind":"a","pri":"P0","q":"Suscripciones diferentes","a":"No confundir suscripción SaaS del entrenador, suscripción mensual del jugador y programa prepago 3/6/12 meses. Tienen métodos de renovación, impago y cancelación distintos.","mean":"","check":"Compruebe tres planes diferentes: SaaS coach, mensualidad jugador y programa prepago; cada uno con vida útil propia.","note":"","sec":"notes"},{"id":"A07","kind":"a","pri":"P0","q":"Stripe Connect","a":"Verificar KYC, vendedor efectivo, Stripe account ID, reparto, reversos, devoluciones, chargebacks, reintentos, eventos duplicados y conciliación contra documentos.","mean":"","check":"Reenvíe webhooks y fuerce cancelaciones/chargebacks en Stripe test; compruebe que no hay dobles cargos.","note":"","sec":"notes"},{"id":"A08","kind":"a","pri":"P0","q":"Cuenta entrenador: baja y retención","a":"90 días solo lectura desde baja efectiva con avisos. Servicio activo comprado online bloquea borrado directo; servicio externo no bloquea cancelación SaaS.","mean":"","check":"Simule baja efectiva de SaaS, lectura durante 90 días y conservación de datos de jugadores.","note":"","sec":"notes"},{"id":"A09","kind":"a","pri":"P0","q":"Diseño del consentimiento","a":"Marketing: email/push/permiso para solicitar uso público de vídeos en tres toggles desligados del alta; nada marcado por defecto. Último toggle no equivale a autorización de uso.","mean":"","check":"Registre nueva cuenta: tres preferencias apagadas. Active una y verifique que no activa las restantes.","note":"","sec":"notes"},{"id":"A10","kind":"a","pri":"P0","q":"Vídeos","a":"10 GB por jugador, 12 meses desde subida, avisos 30/7/1; eliminación original elimina clips de feedback vinculados, no objetivos ni diario; advertir si hay videoanálisis pendiente.","mean":"","check":"Suba vídeos de prueba, mida uso agregado por jugador, simule avisos y compruebe borrado de derivados.","note":"","sec":"notes"},{"id":"A11","kind":"a","pri":"P0","q":"Datos de lesiones","a":"Solo el jugador edita información de salud; permisos separados por entrenador, revocación inmediata y tratamiento sensible con consentimiento explícito cuando corresponda.","mean":"","check":"Revise backend de datos de salud con dos entrenadores y revocación del permiso en tiempo real.","note":"","sec":"notes"},{"id":"A12","kind":"a","pri":"P0","q":"Separación multi-entrenador","a":"Test de seguridad con dos entrenadores vinculados al mismo jugador: ninguno ve vídeos, objetivos, plan, notas ni chat correspondiente al otro.","mean":"","check":"Ejecute pruebas de autorización con IDs pertenecientes a otro entrenador; exigir rechazo del servidor.","note":"","sec":"notes"},{"id":"A13","kind":"a","pri":"P0","q":"Incidencias y accesos","a":"2FA obligatorio admin; accesos de soporte registrados; reclamaciones de suspensión por soporte; denuncias de vídeos/reseñas, moderación proporcional y notificación.","mean":"","check":"Acceda como administrador sin 2FA, pruebe denuncia y compruebe que hay motivo y log de moderación.","note":"","sec":"notes"},{"id":"A14","kind":"a","pri":"P0","q":"Cookies y marketing técnico","a":"Revisar integraciones REALES del despliegue; consentimiento previo a píxeles y etiquetas, rechazo equivalente y revocación. Herramientas deseadas para evaluar: GA4, GTM, Google Ads, Meta Pixel/CAPI, TikTok, Clarity, OneSignal, CMP. No instalar ni declararlas como activas por mera mención.","mean":"","check":"Inspeccione peticiones de red antes/después de aceptar y rechazar; actualice inventario de cookies reales.","note":"","sec":"notes"},{"id":"A15","kind":"a","pri":"P0","q":"Autorización de menores","a":"Email al representante con enlace verificable; aceptar antes de pagos y funciones restringidas; guardar versión y fecha; revocación; al cumplir 18 años nueva aceptación por titular.","mean":"","check":"Simule enlace caducado, revocación y mayoría de edad; guardar evidencia de cada consentimiento.","note":"","sec":"notes"},{"id":"A16","kind":"a","pri":"P0","q":"Funcionalidades excluidas","a":"Sin servicio en pareja, sin videollamada para mentoría, sin reconocimiento facial, sin calendario externo bidireccional y sin IA no implantada. Revisar textos comerciales y checkout.","mean":"","check":"Haga búsqueda global de pantallas, textos y rutas API antiguas; no ofrecer funcionalidades excluidas.","note":"","sec":"notes"},{"id":"A17","kind":"a","pri":"P0","q":"Copy legal y consentimientos","a":"Registrar versión de términos, política comercial, idioma, fecha/hora y actor. Checkout debe distinguir cancelación contractual de desistimiento legal.","mean":"","check":"Abra un pedido antiguo y recupere exactamente precio, versión contractual, política y consentimiento asociados.","note":"","sec":"notes"},{"id":"A18","kind":"a","pri":"P0","q":"No mezclar confirmaciones","a":"Pausa de programa: nuevo vencimiento necesita botón de aceptación del jugador. Reprogramar clase: coach cambia fecha/hora tras acuerdo en chat, SIN segundo botón.","mean":"","check":"Prueba comparativa: pausa requiere confirmación del jugador; cambio de clase no exige segundo botón.","note":"","sec":"notes"},{"id":"A19","kind":"a","pri":"P0","q":"Cómo se marca cada fila","a":"Cada decisión se marca sin implementar, en proceso o implementado. El estado lo ven Miguel Ángel, Radu y el equipo en cuanto se guarda.","mean":"","check":"Al marcar implementado, dejad una nota del equipo con enlace a prueba, captura o registro de ejecución.","note":"","sec":"notes"},{"id":"F01","kind":"f","pri":"P0","q":"Compra online entrenador autónomo","a":"Servicio a nombre del autónomo, comisión facturada por Gimadd, importes e impuestos correctos.","mean":"","check":"Servicio a nombre del autónomo, comisión facturada por Gimadd, importes e impuestos correctos.","note":"","sec":"tests"},{"id":"F02","kind":"f","pri":"P0","q":"Compra online academia","a":"Factura de servicio a nombre de academia aunque la sesión la imparta un coach individual.","mean":"","check":"Factura de servicio a nombre de academia aunque la sesión la imparta un coach individual.","note":"","sec":"tests"},{"id":"F03","kind":"f","pri":"P0","q":"SaaS contratado por academia","a":"Factura mensual SaaS a academia, sin confundirse con facturas de clases.","mean":"","check":"Factura mensual SaaS a academia, sin confundirse con facturas de clases.","note":"","sec":"tests"},{"id":"F04","kind":"f","pri":"P0","q":"Clase pagada en efectivo","a":"No cargo Stripe, no comisión, no factura de servicio de Gimadd, estado registrado.","mean":"","check":"No cargo Stripe, no comisión, no factura de servicio de Gimadd, estado registrado.","note":"","sec":"tests"},{"id":"F05","kind":"f","pri":"P0","q":"Cancelación de clase 25 h antes","a":"Reembolso 100 % precio servicio + 100 % fee, con rectificaciones.","mean":"","check":"Reembolso 100 % precio servicio + 100 % fee, con rectificaciones.","note":"","sec":"tests"},{"id":"F06","kind":"f","pri":"P0","q":"Cancelación clase 2 h antes","a":"Aplicar política preaceptada y derechos legales, no refund total automático.","mean":"","check":"Aplicar política preaceptada y derechos legales, no refund total automático.","note":"","sec":"tests"},{"id":"F07","kind":"f","pri":"P0","q":"Coach cancela injustificadamente","a":"100 % servicio y fee; no dejar saldo parcial inadvertido.","mean":"","check":"100 % servicio y fee; no dejar saldo parcial inadvertido.","note":"","sec":"tests"},{"id":"F08","kind":"f","pri":"P0","q":"Videoanálisis sin inicio real","a":"Reembolso completo; fecha de inicio real auditable.","mean":"","check":"Reembolso completo; fecha de inicio real auditable.","note":"","sec":"tests"},{"id":"F09","kind":"f","pri":"P0","q":"Pack sin uso y programa sin prestación","a":"Reembolso completo servicio + fee.","mean":"","check":"Reembolso completo servicio + fee.","note":"","sec":"tests"},{"id":"F10","kind":"f","pri":"P0","q":"Jugador no acepta subida de precio","a":"No cobrar nuevo importe; cancelar renovación si procede.","mean":"","check":"No cobrar nuevo importe; cancelar renovación si procede.","note":"","sec":"tests"},{"id":"F11","kind":"f","pri":"P0","q":"Webhook Stripe recibido dos veces","a":"Una sola orden, split y factura; sin duplicados.","mean":"","check":"Una sola orden, split y factura; sin duplicados.","note":"","sec":"tests"},{"id":"F12","kind":"f","pri":"P0","q":"Fallo de emisión fiscal tras pago","a":"Pago conciliado, alerta y reintento; nunca duplicar cargo.","mean":"","check":"Pago conciliado, alerta y reintento; nunca duplicar cargo.","note":"","sec":"tests"},{"id":"F13","kind":"f","pri":"P0","q":"Reembolso parcial/total y contracargo","a":"Reversos, comisión, conciliación y abonos correctos.","mean":"","check":"Reversos, comisión, conciliación y abonos correctos.","note":"","sec":"tests"},{"id":"F14","kind":"f","pri":"P0","q":"Impago SaaS y jugador mensual","a":"Aplicar dos cronogramas diferentes sin bloquear servicios activos indebidamente.","mean":"","check":"Aplicar dos cronogramas diferentes sin bloquear servicios activos indebidamente.","note":"","sec":"tests"}];
