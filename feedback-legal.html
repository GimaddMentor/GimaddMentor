    if (target === "ru" && hasCyrillic(text)) return Promise.resolve(text);
    if (target === "es" && !hasCyrillic(text)) return Promise.resolve(text);
    var cacheKey = target + ":" + text;
    if (trCache[cacheKey]) return Promise.resolve(trCache[cacheKey]);
    var sl = hasCyrillic(text) ? "ru" : "es";
    if (sl === target) return Promise.resolve(text);
    function save(out){ trCache[cacheKey] = out; persistTrCache(); return out; }
    function googleOne(q){
      var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + target + "&dt=t&q=" + encodeURIComponent(q);
      return fetch(url).then(function(r){ return r.json(); }).then(function(data){
        return (data[0] || []).map(function(row){ return row[0]; }).join("");
      });
    }
    function memoryOne(q){
      var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + sl + "|" + target;
      return fetch(url).then(function(r){ return r.json(); }).then(function(data){
        return (data.responseData && data.responseData.translatedText) || q;
      });
    }
    return googleOne(text).catch(function(){ return memoryOne(text); }).then(save).catch(function(){ return text; });
  }
  function applyContentTranslations(){
    var nodes = document.querySelectorAll("[data-i18n-text]");
    nodes.forEach(function(el){
      var extra = el.closest(".extra");
      if (extra && !el.closest(".row.open")) return;
      var src = el.getAttribute("data-i18n-text");
      translateText(src, state.lang).then(function(out){
        if (el.getAttribute("data-i18n-text") === src && el.textContent !== out) el.textContent = out;
      });
    });
  }
  function toast(msg){
    var root = document.getElementById("toastRoot");
    root.innerHTML = '<div class="toast">' + escapeHtml(msg) + "</div>";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ root.innerHTML = ""; }, 2400);
  }
  function reporterName(){
    return (state.reporter || "").trim() || t("anon");
  }
  function itemStatus(id){
    var row = state.status[id];
    if (!row || !row.s) return { s:"todo", by:"", at:"", note:"" };
    return row;
  }
  function counts(){
    var c = { total: ITEMS.length, todo:0, wip:0, done:0, p0:0 };
    ITEMS.forEach(function(it){
      var s = itemStatus(it.id).s;
      c[s] = (c[s]||0)+1;
      if (it.pri === "P0" && s !== "done") c.p0++;
    });
    return c;
  }
  function matches(it){
    if (state.filterSec !== "all" && it.sec !== state.filterSec) return false;
    if (state.filterPri !== "all" && it.pri !== state.filterPri) return false;
    var s = itemStatus(it.id).s;
    if (state.filterSt !== "all" && s !== state.filterSt) return false;
    if (state.onlyPending && s === "done") return false;
    var q = (state.filterSearch || "").trim().toLowerCase();
    if (q){
      var blob = (it.id + " " + it.q + " " + it.a + " " + (it.mean||"") + " " + (it.check||"") + " " + (it.note||"") + " " + (itemStatus(it.id).note||"")).toLowerCase();
      if (blob.indexOf(q) === -1) return false;
    }
    return true;
  }
  function fmtWhen(iso){
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var now = Date.now();
    var diff = (now - d.getTime()) / 1000;
    if (diff < 60) return t("justNow");
    if (diff < 3600) return Math.floor(diff/60) + " " + t("mins");
    if (diff < 86400) return Math.floor(diff/3600) + " " + t("hours");
    return d.toLocaleDateString(state.lang === "ru" ? "ru-RU" : "es-ES", {day:"numeric", month:"short"});
  }

  function chrome(){
    document.getElementById("pageTitle").textContent = t("pageTitle");
    document.getElementById("pageSubtitle").textContent = t("pageSubtitle");
    document.getElementById("hint").innerHTML = escapeHtml(t("hint"));
    document.getElementById("homeLink").textContent = t("home");
    document.getElementById("qaLink").textContent = t("qa");
    document.getElementById("reporterLabel").textContent = t("reporter");
    document.getElementById("reporterInput").placeholder = t("reporterPh");
    document.getElementById("filterSearch").placeholder = t("search");
    document.getElementById("langEs").classList.toggle("active", state.lang==="es");
    document.getElementById("langRu").classList.toggle("active", state.lang==="ru");
    document.documentElement.lang = state.lang;
    var pills = [
      {id:"all", label:t("all")},
      {id:"todo", label:t("todo")},
      {id:"wip", label:t("wip")},
      {id:"done", label:t("done")}
    ];
    document.getElementById("statusPills").innerHTML = pills.map(function(p){
      return '<button type="button" class="pill' + (state.filterSt===p.id?" active":"") + '" data-st="' + p.id + '">' + escapeHtml(p.label) + "</button>";
    }).join("");
    var secSel = document.getElementById("filterSec");
    secSel.innerHTML = '<option value="all">' + escapeHtml(t("allSec")) + "</option>" + SECTIONS.map(function(s){
      return '<option value="' + s.id + '"' + (state.filterSec===s.id?" selected":"") + ">" + escapeHtml(secTitle(s.id)) + "</option>";
    }).join("");
    var priSel = document.getElementById("filterPri");
    priSel.innerHTML = '<option value="all">' + escapeHtml(t("allPri")) + "</option>"
      + '<option value="P0"' + (state.filterPri==="P0"?" selected":"") + ">" + escapeHtml(t("priP0")) + "</option>"
      + '<option value="P1"' + (state.filterPri==="P1"?" selected":"") + ">" + escapeHtml(t("priP1")) + "</option>";
    document.getElementById("btnPending").textContent = state.onlyPending ? t("showAll") : t("onlyPending");
    document.getElementById("btnToggleSecs").textContent = state.secsOpen ? t("collapse") : t("expand");
    var c = counts();
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + c.total + "</b><span>" + escapeHtml(t("statTotal")) + "</span></div>"
      + '<div class="stat todo"><b>' + c.todo + "</b><span>" + escapeHtml(t("statTodo")) + "</span></div>"
      + '<div class="stat wip"><b>' + c.wip + "</b><span>" + escapeHtml(t("statWip")) + "</span></div>"
      + '<div class="stat done"><b>' + c.done + "</b><span>" + escapeHtml(t("statDone")) + "</span></div>"
      + '<div class="stat p0"><b>' + c.p0 + "</b><span>" + escapeHtml(t("statP0")) + "</span></div>";
    var pd = Math.round(100 * c.done / c.total);
    var pw = Math.round(100 * c.wip / c.total);
    document.getElementById("progress").innerHTML =
      '<i class="p-done" style="width:' + pd + '%"></i><i class="p-wip" style="width:' + pw + '%"></i>';
    document.getElementById("footnote").textContent = (state.dbMode === "remote" ? t("footnoteDb") : t("footnoteLocal")) + " " + t("closeRule");
  }

  function render(){
    chrome();
    var openIds = {};
    document.querySelectorAll(".row.open").forEach(function(el){ openIds[el.getAttribute("data-id")] = true; });
    var openSecs = {};
    var hadSecs = false;
    document.querySelectorAll("details.sec").forEach(function(el){
      hadSecs = true;
      openSecs[el.getAttribute("data-sec")] = el.open;
    });
    var html = "";
    var any = false;
    SECTIONS.forEach(function(sec){
      var rows = ITEMS.filter(function(it){ return it.sec === sec.id && matches(it); });
      if (!rows.length) return;
      any = true;
      var allInSec = ITEMS.filter(function(it){ return it.sec === sec.id; });
      var doneN = allInSec.filter(function(it){ return itemStatus(it.id).s === "done"; }).length;
      var isOpen;
      if (hadSecs && Object.prototype.hasOwnProperty.call(openSecs, sec.id)) isOpen = openSecs[sec.id];
      else isOpen = doneN < allInSec.length;
      if (!state.secsOpen) isOpen = false;
      html += '<details class="sec" data-sec="' + sec.id + '"' + (isOpen ? " open" : "") + ">"
        + '<summary><span class="sec-mark"></span><span>' + escapeHtml(secTitle(sec.id)) + "</span>"
        + '<span class="sec-counts">' + doneN + " / " + allInSec.length + "</span></summary><div class=\"rows\">";
      rows.forEach(function(it){
        var st = itemStatus(it.id);
        var open = !!openIds[it.id];
        var preview = it.mean || it.a;
        var answerLabel = it.kind === "f" ? t("expected") : t("answer");
        var showCheck = !!(it.check && it.check !== it.a);
        html += '<article class="row st-' + st.s + (open?" open":"") + '" data-id="' + escapeHtml(it.id) + '">'
          + '<div class="row-id">' + escapeHtml(it.id) + "</div>"
          + '<div class="row-copy">'
          + '<p class="q" data-i18n-text="' + escapeHtml(it.q) + '">' + escapeHtml(it.q) + "</p>"
          + '<div class="chips"><span class="chip chip-' + it.pri.toLowerCase() + '">' + escapeHtml(it.pri === "P1" ? t("priP1") : t("priP0")) + "</span></div>"
          + (preview ? '<p class="preview" data-i18n-text="' + escapeHtml(preview) + '">' + escapeHtml(preview) + "</p>" : "")
          + '<div class="open-hint">' + escapeHtml(t("more")) + "</div>"
          + "</div>"
          + '<div class="st-row">'
          + '<button type="button" class="st-btn' + (st.s==="todo"?" active":"") + '" data-s="todo">' + escapeHtml(t("todo")) + "</button>"
          + '<button type="button" class="st-btn' + (st.s==="wip"?" active":"") + '" data-s="wip">' + escapeHtml(t("wip")) + "</button>"
          + '<button type="button" class="st-btn' + (st.s==="done"?" active":"") + '" data-s="done">' + escapeHtml(t("done")) + "</button>"
          + (st.by ? '<span class="who">' + escapeHtml(t("by") + " " + st.by + (st.at ? " · " + fmtWhen(st.at) : "")) + "</span>" : "")
          + "</div>"
          + '<div class="extra">'
          + '<div class="box"><label>' + escapeHtml(answerLabel) + '</label><p data-i18n-text="' + escapeHtml(it.a) + '">' + escapeHtml(it.a) + "</p></div>"
          + (it.mean ? '<div class="box mean"><label>' + escapeHtml(t("meaning")) + '</label><p data-i18n-text="' + escapeHtml(it.mean) + '">' + escapeHtml(it.mean) + "</p></div>" : "")
          + (showCheck ? '<div class="box check"><label>' + escapeHtml(t("howTo")) + '</label><p data-i18n-text="' + escapeHtml(it.check) + '">' + escapeHtml(it.check) + "</p></div>" : "")
          + (it.note ? '<div class="box dev"><label>' + escapeHtml(t("noteDev")) + '</label><p data-i18n-text="' + escapeHtml(it.note) + '">' + escapeHtml(it.note) + "</p></div>" : "")
          + '<div class="note-wrap"><label>' + escapeHtml(t("noteTeam")) + "</label>"
          + '<input class="note-input" data-note-id="' + escapeHtml(it.id) + '" maxlength="280" placeholder="' + escapeHtml(t("notePh")) + '" value="' + escapeHtml(st.note || "") + '">'
          + "</div></div></article>";
      });
      html += "</div></details>";
    });
    document.getElementById("list").innerHTML = any ? html : '<p class="empty">' + escapeHtml(t("empty")) + "</p>";
    if (state.lang === "ru") applyContentTranslations();
  }

  function persistLocal(){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ v:1, items: state.status, savedAt: new Date().toISOString() })); } catch(e){}
  }
  function loadLocal(){
    try {
      var raw = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
      if (raw && raw.items) state.status = raw.items;
    } catch(e){}
  }
  function mergeStatus(remote){
    var out = {};
    var ids = {};
    ITEMS.forEach(function(it){ ids[it.id] = true; });
    function take(map, force){
      if (!map) return;
      Object.keys(map).forEach(function(id){
        if (!ids[id]) return;
        var a = out[id];
        var b = map[id];
        if (!b || !b.s) return;
        if (force || !a || (b.at && (!a.at || b.at >= a.at))) out[id] = {
          s: b.s, by: b.by || "", at: b.at || "", note: b.note || ""
        };
      });
    }
    take(state.status, false);
    take(remote, false);
    take(state.dirty, true);
    state.status = out;
  }
  function mantlePath(path, method, body){
    var url = MANTLE_BASE + "/" + path;
    var opts = { method: method || "GET", headers: { "X-Mantle-Key": MANTLE_KEY, "Accept": "application/json" } };
    if (body !== undefined){
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function(res){
      if (res.status === 404) return null;
      if (!res.ok){
        return res.text().then(function(txt){
          var err = new Error(res.status + " " + txt);
          err.status = res.status;
          if (res.status === 429 || /rate limit/i.test(txt || "")) err.rateLimited = true;
          throw err;
        });
      }
      if (res.status === 204) return null;
      return res.json();
    });
  }
  function showBanner(msg){
    var el = document.getElementById("banner");
    if (!msg){ el.innerHTML = ""; el.hidden = true; return; }
    el.hidden = false;
    el.className = "banner";
    el.textContent = msg;
  }
  function saveRemote(){
    if (state.saving) return Promise.resolve();
    state.saving = true;
    return mantlePath(LEGAL_PATH, "GET").then(function(remote){
      var remoteItems = (remote && remote.items) || {};
      mergeStatus(remoteItems);
      var payload = { v:1, updatedAt: new Date().toISOString(), items: Object.assign({}, remoteItems) };
      Object.keys(state.dirty).forEach(function(id){ payload.items[id] = state.dirty[id]; });
      Object.keys(state.status).forEach(function(id){
        if (!payload.items[id]) payload.items[id] = state.status[id];
      });
      return mantlePath(LEGAL_PATH, "POST", payload).then(function(){
        state.dirty = {};
        state.status = payload.items;
        state.dbMode = "remote";
        persistLocal();
        showBanner("");
        syncBackoffMs = SYNC_MS;
      });
    }).catch(function(err){
      state.dbMode = "local";
      persistLocal();
      showBanner(err && err.rateLimited ? t("syncFailRate") : t("syncFail"));
      if (err && err.rateLimited) syncBackoffMs = Math.min(syncBackoffMs * 2, 10 * 60 * 1000);
    }).then(function(){ state.saving = false; });
  }
  function pullRemote(silent){
    return mantlePath(LEGAL_PATH, "GET").then(function(remote){
      mergeStatus((remote && remote.items) || {});
      state.dbMode = "remote";
      persistLocal();
      showBanner("");
      if (!silent) render();
      else {
        chrome();
        render();
      }
    }).catch(function(err){
      if (state.dbMode !== "remote") state.dbMode = "local";
      showBanner(err && err.rateLimited ? t("syncFailRate") : t("syncFail"));
    });
  }
  function setStatus(id, s){
    var prev = itemStatus(id);
    var row = { s:s, by: reporterName(), at: new Date().toISOString(), note: prev.note || "" };
    state.status[id] = row;
    state.dirty[id] = row;
    persistLocal();
    render();
    saveRemote().then(function(){ toast(t("saved")); });
  }
  function setNote(id, note){
    var prev = itemStatus(id);
    var row = { s: prev.s || "todo", by: reporterName(), at: new Date().toISOString(), note: note };
    state.status[id] = row;
    state.dirty[id] = row;
    persistLocal();
    saveRemote();
  }
  function scheduleSync(){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){
      if (document.hidden){ scheduleSync(); return; }
      pullRemote(true).then(scheduleSync);
    }, syncBackoffMs);
  }

  document.getElementById("langEs").addEventListener("click", function(){ state.lang = "es"; localStorage.setItem(langKey, "es"); render(); });
  document.getElementById("langRu").addEventListener("click", function(){ state.lang = "ru"; localStorage.setItem(langKey, "ru"); render(); });
  document.getElementById("reporterInput").addEventListener("input", function(e){
    state.reporter = e.target.value;
    try { localStorage.setItem(reporterKey, state.reporter); } catch(err){}
  });
  document.getElementById("statusPills").addEventListener("click", function(e){
    var btn = e.target.closest("[data-st]");
    if (!btn) return;
    state.filterSt = btn.getAttribute("data-st");
    render();
  });
  document.getElementById("filterSec").addEventListener("change", function(e){ state.filterSec = e.target.value; render(); });
  document.getElementById("filterPri").addEventListener("change", function(e){ state.filterPri = e.target.value; render(); });
  document.getElementById("filterSearch").addEventListener("input", function(e){ state.filterSearch = e.target.value; render(); });
  document.getElementById("btnPending").addEventListener("click", function(){ state.onlyPending = !state.onlyPending; render(); });
  document.getElementById("btnToggleSecs").addEventListener("click", function(){
    state.secsOpen = !state.secsOpen;
    document.querySelectorAll("details.sec").forEach(function(el){ el.open = state.secsOpen; });
    chrome();
  });
  document.getElementById("list").addEventListener("click", function(e){
    var stBtn = e.target.closest(".st-btn");
    if (stBtn){
      var row = stBtn.closest(".row");
      setStatus(row.getAttribute("data-id"), stBtn.getAttribute("data-s"));
      return;
    }
    var openEl = e.target.closest(".q, .preview, .open-hint, .row-copy");
    if (openEl){
      openEl.closest(".row").classList.toggle("open");
      if (state.lang === "ru") applyContentTranslations();
    }
  });
  document.getElementById("list").addEventListener("input", function(e){
    var inp = e.target.closest(".note-input");
    if (!inp) return;
    var id = inp.getAttribute("data-note-id");
    clearTimeout(noteTimers[id]);
    noteTimers[id] = setTimeout(function(){ setNote(id, inp.value); }, 700);
  });

  state.lang = localStorage.getItem(langKey) === "ru" ? "ru" : "es";
  state.reporter = localStorage.getItem(reporterKey) || "";
  document.getElementById("reporterInput").value = state.reporter;
  loadLocal();
  render();
  pullRemote(false).then(scheduleSync);
})();
</script>
</body>
</html>
